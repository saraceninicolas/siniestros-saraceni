    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  const filas = MESES_CORTO.map((m, i) => {
    const r = movs.find((x) => x.companiaId === cia.id && x.anio === anio && x.mes === i + 1);
    return { mes: m, facturado: r && r.total != null ? Number(r.total) : null, cobrado: r && r.pago != null ? Number(r.pago) : null, nro: r ? r.nroFactura : "" };
  });
  const totF = filas.reduce((s, f) => s + (f.facturado || 0), 0);
  const totC = filas.reduce((s, f) => s + (f.cobrado || 0), 0);
  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <div className="modal modal-wide" onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div><h2>{cia.razonSocial}</h2><p>Facturación {anio} · CUIT {cia.cuit}</p></div>
          <button className="btn-ghost tb-icon" onClick={onClose}><Ico name="close" size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="fact-det-res">
            <div><span className="fact-res-k">Facturado {anio}</span><span className="fact-res-v">{money0(totF)}</span></div>
            <div><span className="fact-res-k">Cobrado</span><span className="fact-res-v">{money0(totC)}</span></div>
            <div><span className="fact-res-k">Pendiente</span><span className="fact-res-v" style={{ color: totF - totC > 0 ? "#C0241D" : "#15803D" }}>{money0(totF - totC)}</span></div>
          </div>
          <div className="table-wrap" style={{ marginTop: 14 }}>
            <table className="table fact-det-tabla">
              <thead><tr><th>Mes</th><th>N° factura</th><th style={{ textAlign: "right" }}>Facturado</th><th style={{ textAlign: "right" }}>Cobrado</th><th style={{ textAlign: "right" }}>Pendiente</th><th>Estado</th></tr></thead>
              <tbody>
                {filas.map((f) => (
                  <tr key={f.mes}>
                    <td><b>{f.mes}</b></td>
                    <td className="mono cell-sub">{f.nro || "—"}</td>
                    <td className="mono" style={{ textAlign: "right" }}>{f.facturado == null ? "—" : money0(f.facturado)}</td>
                    <td className="mono" style={{ textAlign: "right" }}>{f.cobrado == null ? "—" : money0(f.cobrado)}</td>
                    <td className="mono" style={{ textAlign: "right" }}>{f.facturado == null ? "—" : money0((f.facturado || 0) - (f.cobrado || 0))}</td>
                    <td><EstadoCobro facturado={f.facturado || 0} cobrado={f.cobrado || 0} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function FactEstadisticas({ companias, movs, anio, mes, onAnio, onMes, onNav }) {
  const hoy = new Date();
  const [verTodas, setVerTodas] = React.useState(false);
  const [rango, setRango] = React.useState(6);
  const [detalle, setDetalle] = React.useState(null);
  const anios = [];
  for (let a = hoy.getFullYear() + 1; a >= 2025; a--) anios.push(a);

  const idx = React.useMemo(() => {
    const m = {};
    movs.forEach((x) => { m[x.companiaId + "-" + x.anio + "-" + x.mes] = x; });
    return m;
  }, [movs]);
  const facDe = (cid, a, ms) => { const r = idx[cid + "-" + a + "-" + ms]; return r && r.total != null ? Number(r.total) : 0; };
  const cobDe = (cid, a, ms) => { const r = idx[cid + "-" + a + "-" + ms]; return r && r.pago != null ? Number(r.pago) : 0; };
  const cargada = (cid, a, ms) => { const r = idx[cid + "-" + a + "-" + ms]; return !!(r && r.total != null); };

  const prev = mesAnterior(anio, mes);
  const filas = React.useMemo(() => companias.map((c) => {
    const facturado = facDe(c.id, anio, mes);
    const cobrado = cobDe(c.id, anio, mes);
    const antes = facDe(c.id, prev.anio, prev.mes);
    return {
      cia: c, facturado, cobrado, pendiente: facturado - cobrado,
      pctCobro: facturado > 0 ? (cobrado / facturado) * 100 : null,
      crecimiento: antes > 0 ? ((facturado - antes) / antes) * 100 : null,
      antes, cargada: cargada(c.id, anio, mes),
    };
  }).sort((a, b) => b.facturado - a.facturado), [companias, idx, anio, mes]);

  const conMovimiento = filas.filter((f) => f.facturado > 0);
  const facturado = conMovimiento.reduce((s, f) => s + f.facturado, 0);
  const cobrado = conMovimiento.reduce((s, f) => s + f.cobrado, 0);
  const pendiente = facturado - cobrado;
  const facturadoPrev = filas.reduce((s, f) => s + f.antes, 0);
  const cobradoPrev = companias.reduce((s, c) => s + cobDe(c.id, prev.anio, prev.mes), 0);
  const pendientePrev = facturadoPrev - cobradoPrev;
  const varTotal = facturadoPrev > 0 ? ((facturado - facturadoPrev) / facturadoPrev) * 100 : null;
  const varCobrado = cobradoPrev > 0 ? ((cobrado - cobradoPrev) / cobradoPrev) * 100 : null;
  const varPendiente = pendientePrev > 0 ? ((pendiente - pendientePrev) / pendientePrev) * 100 : null;
  const conSaldo = conMovimiento.filter((f) => f.pendiente > 0);
  const sinCargar = companias.filter((c) => c.activa && !cargada(c.id, anio, mes));
  const mesPrevLabel = MESES_F[prev.mes - 1] + " " + prev.anio;

  // evolución de los últimos N meses terminando en el período elegido
  const evolucion = React.useMemo(() => {
    const cols = [];
    for (let i = rango - 1; i >= 0; i--) {
      const d = new Date(anio, mes - 1 - i, 1);
      const a = d.getFullYear(), ms = d.getMonth() + 1;
      cols.push({
        label: MESES_CORTO[ms - 1] + " " + String(a).slice(2),
        valores: [
          companias.reduce((s, c) => s + facDe(c.id, a, ms), 0),
          companias.reduce((s, c) => s + cobDe(c.id, a, ms), 0),
        ],
      });
    }
    return cols;
  }, [companias, idx, anio, mes, rango]);

  // estado de cobro por importe facturado
  const dona = [
    { label: "Cobrado", color: CH_COLOR.verde, valor: conMovimiento.filter((f) => f.cobrado >= f.facturado).reduce((s, f) => s + f.facturado, 0) },
    { label: "Parcial", color: CH_COLOR.ambar, valor: conMovimiento.filter((f) => f.cobrado > 0 && f.cobrado < f.facturado).reduce((s, f) => s + f.facturado, 0) },
    { label: "Pendiente", color: CH_COLOR.rojo, valor: conMovimiento.filter((f) => f.cobrado <= 0).reduce((s, f) => s + f.facturado, 0) },
  ];
  const donaTotal = dona.reduce((s, d) => s + d.valor, 0);

  // alertas
  const alertas = [];
  conMovimiento.filter((f) => f.cobrado <= 0).forEach((f) => alertas.push({
    tono: "alta", titulo: f.cia.razonSocial, txt: "No registra pagos en el período. Pendiente " + money0(f.pendiente),
  }));
  conMovimiento.filter((f) => f.crecimiento != null && f.crecimiento <= -15).forEach((f) => alertas.push({
    tono: "media", titulo: f.cia.razonSocial, txt: `Caída del ${Math.abs(Math.round(f.crecimiento))}% en facturación respecto a ${mesPrevLabel}.`,
  }));
  if (sinCargar.length) alertas.push({
    tono: "media", titulo: `${sinCargar.length} ${sinCargar.length === 1 ? "compañía activa sin cargar" : "compañías activas sin cargar"}`,
    txt: sinCargar.map((c) => c.razonSocial).join(", "), accion: { label: "Ir a la carga", key: "fact-carga" },
  });
  if (conSaldo.length) alertas.push({
    tono: "baja", titulo: `${conSaldo.length} ${conSaldo.length === 1 ? "compañía con saldo pendiente" : "compañías con saldos pendientes"}`,
    txt: "Total a cobrar del período: " + money0(pendiente),
  });

  const ranking = filas.filter((f) => f.crecimiento != null || f.facturado > 0)
    .sort((a, b) => (b.crecimiento == null ? -Infinity : b.crecimiento) - (a.crecimiento == null ? -Infinity : a.crecimiento));

  const kpis = [
    { label: "Facturado total", value: money2(facturado), delta: varTotal, tone: { bg: "#E8F0FE", fg: "#1D4ED8" }, icon: "doc" },
    { label: "Cobrado total", value: money2(cobrado), delta: varCobrado, tone: { bg: "#E6F4EA", fg: "#15803D" }, icon: "card" },
    { label: "Pendiente de cobro", value: money2(pendiente), delta: varPendiente, invertir: true, tone: { bg: "#FEF3E2", fg: "#B45309" }, icon: "clock" },
    { label: "Compañías con saldo", value: conSaldo.length + " de " + conMovimiento.length, hint: "facturaron y deben algo", tone: { bg: "#FBE3E3", fg: "#C0241D" }, icon: "folder" },
  ];
  const visiblesTabla = verTodas ? filas : filas.slice(0, 6);

  return (
    <div className="fact-dash">
      <div className="fact-periodo">
        <div className="fact-periodo-sel">
          <span className="fact-periodo-label">Período</span>
          <div className="fact-mes-pills">
            {MESES_CORTO.map((m, i) => (
              <button key={m} className={"fact-mes-pill" + (mes === i + 1 ? " on" : "")} onClick={() => onMes(i + 1)}>{m}</button>
            ))}
          </div>
          <select className="select" value={anio} onChange={(e) => onAnio(Number(e.target.value))}>
            {anios.map((a) => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        <div className="fact-periodo-res">
          <div><span className="fact-res-k">Mostrando</span><span className="fact-res-v" style={{ fontFamily: "inherit", fontSize: 15 }}>{MESES_F[mes - 1]} {anio}</span></div>
        </div>
      </div>

      <div className="kpis fact-kpis">
        {kpis.map((c) => (
          <div className="kpi" key={c.label}>
            <span className="kpi-stripe" style={{ background: c.tone.fg }} />
            <div className="kpi-top"><span className="kpi-ico" style={{ background: c.tone.bg, color: c.tone.fg }}><Ico name={c.icon} size={17} /></span><span className="kpi-label">{c.label}</span></div>
            <div className="kpi-mid"><span className="kpi-value fact-kpi-v">{c.value}</span></div>
            <div className="kpi-foot">
              {c.hint ? <span className="kpi-hint">{c.hint}</span>
                : <><span className="kpi-hint">vs {mesPrevLabel}</span>
                  <FactDelta v={c.delta} invertido={c.invertir} /></>}
            </div>
          </div>
        ))}
      </div>

      <div className="fact-dash-grid">
        <div className="fact-dash-main">
          <section className="est-card">
            <div className="est-card-head">
              <div><h3>Resumen por compañía</h3><p>{MESES_F[mes - 1]} {anio}</p></div>
            </div>
            <div className="table-wrap">
              <table className="table fact-resumen">
                <thead>
                  <tr>
                    <th style={{ minWidth: 180 }}>Compañía</th>
                    <th style={{ textAlign: "right" }}>Facturado</th>
                    <th style={{ textAlign: "right" }}>Cobrado</th>
                    <th style={{ minWidth: 120 }}>% Cobro</th>
                    <th style={{ textAlign: "right" }}>Pendiente</th>
                    <th>Estado</th>
                    <th style={{ width: 40 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {visiblesTabla.map((f) => (
                    <tr key={f.cia.id}>
                      <td>
                        <div className="fact-cia-cell">
                          <CiaMarca nombre={f.cia.razonSocial} />
                          <div><div className="cell-strong sm">{f.cia.razonSocial}</div><div className="cell-sub mono">{f.cia.cuit}</div></div>
                        </div>
                      </td>
                      <td className="mono" style={{ textAlign: "right" }}>{f.facturado ? money0(f.facturado) : "—"}</td>
                      <td className="mono" style={{ textAlign: "right", color: f.cobrado > 0 ? "#15803D" : "var(--muted)" }}>{f.cobrado ? money0(f.cobrado) : "$ 0"}</td>
                      <td>
                        <div className="fact-cobro">
                          <span className="fact-cobro-track">
                            <span style={{
                              width: Math.min(100, Math.max(0, f.pctCobro || 0)) + "%",
                              background: (f.pctCobro || 0) >= 100 ? "#16A34A" : (f.pctCobro || 0) >= 50 ? "#F59E0B" : "#EA580C",
                            }} />
                          </span>
                          <b className="mono">{f.pctCobro == null ? "—" : Math.round(f.pctCobro) + "%"}</b>
                        </div>
                      </td>
                      <td className="mono" style={{ textAlign: "right", color: f.pendiente > 0 ? "#C0241D" : "var(--ink-2)" }}>{f.facturado ? money0(f.pendiente) : "—"}</td>
                      <td><EstadoCobro facturado={f.facturado} cobrado={f.cobrado} /></td>
                      <td>
                        <button className="row-open" title="Ver el año de esta compañía" onClick={() => setDetalle(f.cia)}><Ico name="chevR" size={16} /></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {filas.length > 6 && (
              <div className="fact-vertodas">
                <button className="btn-ghost sm" onClick={() => setVerTodas((v) => !v)}>
                  {verTodas ? "Ver solo las principales" : `Ver todas las compañías (${filas.length})`}
                </button>
              </div>
            )}
          </section>

          <div className="fact-dash-duo">
            <section className="est-card">
              <div className="est-card-head"><div><h3>Alertas</h3><p>lo que conviene mirar de este mes</p></div></div>
              {alertas.length ? (
                <div className="fact-alertas">
                  {alertas.slice(0, 6).map((a, i) => (
                    <div className={"fact-alerta " + a.tono} key={i}>
                      <span className="fact-alerta-ico"><Ico name={a.tono === "alta" ? "alert" : a.tono === "media" ? "info" : "clock"} size={15} /></span>
                      <div className="fact-alerta-txt">
                        <b>{a.titulo}</b>
                        <span>{a.txt}</span>
                      </div>
                      {a.accion && onNav && <button className="fact-alerta-link" onClick={() => onNav(a.accion.key)}>{a.accion.label}</button>}
                    </div>
                  ))}
                </div>
              ) : <div className="ch-vacio">Sin alertas: el mes está cargado y cobrado.</div>}
            </section>

            <section className="est-card">
              <div className="est-card-head"><div><h3>Ranking de crecimiento</h3><p>vs {mesPrevLabel}</p></div></div>
              {ranking.length ? (
                <ol className="fact-rank">
                  {ranking.slice(0, 8).map((f, i) => (
                    <li key={f.cia.id}>
                      <span className="fact-rank-n">{i + 1}</span>
                      <CiaMarca nombre={f.cia.razonSocial} />
                      <span className="fact-rank-name" title={f.cia.razonSocial}>{f.cia.razonSocial}</span>
                      <FactDelta v={f.crecimiento} />
                    </li>
                  ))}
                </ol>
              ) : <div className="ch-vacio">Sin datos para comparar</div>}
            </section>
          </div>
        </div>

        <div className="fact-dash-side">
          <section className="est-card">
            <div className="est-card-head">
              <div><h3>Evolución de facturación</h3><ChLeyenda series={[{ nombre: "Facturado", color: CH_COLOR.azul }, { nombre: "Cobrado", color: CH_COLOR.verde }]} /></div>
              <select className="select sm" value={rango} onChange={(e) => setRango(Number(e.target.value))}>
                <option value={6}>Últimos 6 meses</option>
                <option value={12}>Últimos 12 meses</option>
              </select>
            </div>
            <ChBarras data={evolucion}
              series={[{ nombre: "Facturado", color: CH_COLOR.azul }, { nombre: "Cobrado", color: CH_COLOR.verde }]}
              fmtEje={moneyK} fmtValor={money0} alto={240} />
          </section>

          <section className="est-card">
            <div className="est-card-head"><div><h3>Estado de cobro</h3><p>por importe facturado</p></div></div>
            {donaTotal > 0 ? (
              <div className="fact-dona-wrap">
                <ChDona items={dona} centro={{ valor: Math.round((cobrado / (facturado || 1)) * 100) + "%", label: "cobrado" }} />
                <div className="fact-dona-leg">
                  {dona.map((d) => (
                    <div className="fact-dona-item" key={d.label}>
                      <span className="ch-leyenda-dot" style={{ background: d.color }} />
                      <div>
                        <b>{d.label}</b>
                        <span className="mono">{money0(d.valor)} ({(Math.round((d.valor / donaTotal) * 1000) / 10).toLocaleString("es-AR")}%)</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : <div className="ch-vacio">Todavía no hay facturación cargada en {MESES_F[mes - 1]}.</div>}
          </section>

          {onNav && (
            <section className="est-card">
              <div className="est-card-head"><div><h3>Acciones rápidas</h3></div></div>
              <div className="fact-acciones">
                {[
                  { k: "fact-carga", ico: "edit", t: "Cargar el mes", s: "Completar la grilla de " + MESES_F[mes - 1] },
                  { k: "fact-crecimiento", ico: "target", t: "Crecimiento anual", s: "Matriz de compañías por mes" },
                  { k: "fact-companias", ico: "folder", t: "Compañías", s: "Datos fijos y alta de compañías" },
                ].map((a) => (
                  <button className="fact-accion" key={a.k} onClick={() => onNav(a.k)}>
                    <span className="fact-accion-ico"><Ico name={a.ico} size={17} /></span>
                    <span className="fact-accion-txt"><b>{a.t}</b><span>{a.s}</span></span>
                    <Ico name="chevR" size={16} />
                  </button>
                ))}
              </div>
            </section>
          )}
        </div>
      </div>

      {detalle && <FactDetalleCia cia={detalle} movs={movs} anio={anio} onClose={() => setDetalle(null)} />}
    </div>
  );
}

function FacturacionModule({ active, station, query, onNav }) {
  const hoy = new Date();
  const [companias, setCompanias] = React.useState([]);
  const [movs, setMovs] = React.useState([]);
  const [anio, setAnio] = React.useState(hoy.getFullYear());
  const [mes, setMes] = React.useState(hoy.getMonth() + 1);
  const [loading, setLoading] = React.useState(true);
  const [modal, setModal] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const tt = React.useRef(null);
  const flash = (msg, err) => {
    setToast({ msg, err: !!err, id: Date.now() });
    clearTimeout(tt.current); tt.current = setTimeout(() => setToast(null), err ? 4000 : 2400);
  };

  const load = React.useCallback(async () => {
    if (!window.DB || !window.DB.configured() || !window.DB.fact) { setLoading(false); return; }
    try {
      const [cs, ms] = await Promise.all([window.DB.fact.companias.list(), window.DB.fact.mensual.list()]);
      setCompanias(cs); setMovs(ms);
    } catch (e) { console.error("Facturación:", e); flash("No se pudo cargar la facturación", true); }
    setLoading(false);
  }, []);
  React.useEffect(() => { load(); }, [load]);
  React.useEffect(() => {
    if (!window.DB || !window.DB.configured() || !window.DB.fact) return;
    let t = null;
    const unsub = window.DB.fact.subscribe(() => { clearTimeout(t); t = setTimeout(load, 500); });
    return () => { clearTimeout(t); if (unsub) unsub(); };
  }, [load]);

  const guardarMes = async (item) => {
    try {
      const saved = await window.DB.fact.mensual.save(item);
      setMovs((p) => {
        const i = p.findIndex((x) => x.companiaId === saved.companiaId && x.anio === saved.anio && x.mes === saved.mes);
        if (i >= 0) { const q = [...p]; q[i] = saved; return q; }
        return [...p, saved];
      });
      flash("Guardado");
    } catch (e) { console.error(e); flash("No se pudo guardar", true); }
  };
  const guardarCompania = async (f) => {
    try {
      if (f.id) {
        const up = await window.DB.fact.companias.update(f);
        setCompanias((p) => p.map((x) => (x.id === up.id ? up : x)).sort((a, b) => a.orden - b.orden));
        flash("Compañía actualizada");
      } else {
        const nu = await window.DB.fact.companias.create(f);
        setCompanias((p) => [...p, nu].sort((a, b) => a.orden - b.orden));
        flash("Compañía agregada");
      }
      setModal(null);
    } catch (e) {
      console.error(e);
      flash(String(e.message || "").indexOf("duplicate") >= 0 ? "Ya existe una compañía con ese CUIT" : "No se pudo guardar la compañía", true);
    }
  };
  const eliminarCompania = async (c) => {
    const n = movs.filter((m) => m.companiaId === c.id).length;
    const msg = n
      ? `${c.razonSocial} tiene ${n} ${n === 1 ? "mes cargado" : "meses cargados"}. Si la eliminás se borra también esa facturación. ¿Seguir?`
      : `¿Eliminar ${c.razonSocial}?`;
    if (!window.confirm(msg)) return;
    try {
      await window.DB.fact.companias.remove(c);
      setCompanias((p) => p.filter((x) => x.id !== c.id));
      setMovs((p) => p.filter((m) => m.companiaId !== c.id));
      flash("Compañía eliminada");
    } catch (e) { console.error(e); flash("No se pudo eliminar", true); }
  };

  const q = (query || "").trim().toLowerCase();
  const visibles = React.useMemo(() => {
    let cs = companias;
    if (q) cs = cs.filter((c) => (c.razonSocial + " " + c.cuit).toLowerCase().includes(q));
    return cs;
  }, [companias, q]);
  const activas = visibles.filter((c) => c.activa);

  if (loading) return <div className="boot"><div className="boot-inner"><div className="boot-spin" />Cargando facturación…</div></div>;

  return (
    <>
      {active === "fact-estadisticas"
        ? <FactEstadisticas companias={visibles} movs={movs} anio={anio} mes={mes}
            onAnio={setAnio} onMes={setMes} onNav={onNav} />
        : active === "fact-crecimiento"
        ? <CrecimientoAnual companias={visibles} movs={movs} anio={anio} onAnio={setAnio} />
        : active === "fact-companias"
        ? <CompaniasView companias={visibles} movs={movs}
            onNueva={() => setModal({ tipo: "cia" })}
            onEditar={(c) => setModal({ tipo: "cia", item: c })}
            onEliminar={eliminarCompania} />
        : <CargaMensual companias={activas} movs={movs} anio={anio} mes={mes}
            onAnio={setAnio} onMes={setMes} onGuardar={guardarMes} station={station} />}

      {modal?.tipo === "cia" && (
        <CompaniaForm initial={modal.item} onClose={() => setModal(null)} onSubmit={guardarCompania} />
      )}
      {toast && (
        <div className="toast">
          <span className="toast-ico" style={toast.err ? { background: "#DC2626" } : null}><Ico name={toast.err ? "alert" : "check"} size={15} /></span>
          <span>{toast.msg}</span>
        </div>
      )}
    </>
  );
}

Object.assign(window, { FacturacionModule, CargaMensual, CrecimientoAnual, CompaniasView, FactEstadisticas });
</script>
<script type="text/babel" data-file="renovaciones.jsx">
// renovaciones.jsx — Saraceni Seguros · Módulo de Renovaciones

const ESTADOS_RENOV = ["Pendiente", "En gestión", "Renovada", "No renueva"];
const ESTADO_RENOV_COLOR = {
  "Pendiente": { fg: "#B45309", bg: "#FEF3E2" },
  "En gestión": { fg: "#1D4ED8", bg: "#E8F0FE" },
  "Renovada": { fg: "#15803D", bg: "#E6F4EA" },
  "No renueva": { fg: "#475569", bg: "#EEF1F4" },
};
const MESES_R = ["", "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const MESES_R_CORTO = ["", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const RESUELTOS = ["Renovada", "No renueva"];

function fmtF(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00"); if (isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
function fmtFShort(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00"); if (isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function addYearISO(iso, y) {
  if (!iso) return iso;
  const d = new Date(iso + "T00:00:00"); if (isNaN(d)) return iso;
  d.setFullYear(d.getFullYear() + y);
  return d.toISOString().slice(0, 10);
}
function urgenciaR(finVig) {
  const du = daysUntil(finVig);
  if (du == null) return "adelante";
  if (du < 0) return "vencido";
  if (du <= 30) return "pronto";
  if (du <= 60) return "proximo";
  return "adelante";
}
function faltanTexto(finVig) {
  const du = daysUntil(finVig);
  if (du == null) return "—";
  if (du < 0) return "venció hace " + Math.abs(du) + " d";
  if (du === 0) return "vence hoy";
  if (du === 1) return "vence mañana";
  return "faltan " + du + " d";
}
function estadoBadgeR(estado) {
  const c = ESTADO_RENOV_COLOR[estado] || { fg: "#475569", bg: "#EEF1F4" };
  return <span className="badge" style={{ background: c.bg, color: c.fg, fontSize: 11.5 }}><span className="badge-dot" style={{ background: c.fg }} />{estado}</span>;
}

const BUCKETS_R = [
  { key: "vencido", label: "Vencidas", icon: "alert", head: "ag-vencido", rail: "ag-rail-vencido" },
  { key: "pronto", label: "Vencen en ≤ 30 días", icon: "clock", head: "ag-hoy", rail: "ag-rail-hoy" },
  { key: "proximo", label: "En 31 – 60 días", icon: "clock", head: "ag-proximo", rail: "ag-rail-proximo" },
  { key: "adelante", label: "Más adelante", icon: "agenda", head: "ag-normal", rail: "ag-rail-normal" },
];

// ---------- KPIs ----------
function RenovKpis({ data }) {
  const pend = data.filter((r) => RESUELTOS.indexOf(r.estado) < 0);
  const vencidas = pend.filter((r) => urgenciaR(r.finVig) === "vencido").length;
  const esteMes = pend.filter((r) => urgenciaR(r.finVig) === "pronto").length;
  const renovadas = data.filter((r) => r.estado === "Renovada").length;
  const cards = [
    { label: "Pólizas a renovar", value: pend.length, hint: "pendientes", tone: { bg: "#FEF3E2", fg: "#B45309" }, icon: "refresh" },
    { label: "Vencen ≤ 30 días", value: esteMes, hint: "próximas", tone: { bg: "#FEF3E2", fg: "#D97706" }, icon: "clock" },
    { label: "Vencidas", value: vencidas, hint: "requieren acción", tone: { bg: "#FBE3E3", fg: "#C0241D" }, icon: "alert" },
    { label: "Renovadas", value: renovadas, hint: "cerradas", tone: { bg: "#E6F4EA", fg: "#15803D" }, icon: "check" },
  ];
  return (
    <div className="kpis">
      {cards.map((c) => (
        <div className="kpi" key={c.label}>
          <span className="kpi-stripe" style={{ background: c.tone.fg }} />
          <div className="kpi-top"><span className="kpi-ico" style={{ background: c.tone.bg, color: c.tone.fg }}><Ico name={c.icon} size={17} /></span><span className="kpi-label">{c.label}</span></div>
          <div className="kpi-mid"><span className="kpi-value">{c.value}</span></div>
          <div className="kpi-foot"><span className="kpi-hint">{c.hint}</span></div>
        </div>
      ))}
    </div>
  );
}

// ---------- próximas a vencer (worklist) ----------
function RenovProximas({ data, onOpen, onRenovar, onNew }) {
  const pend = data.filter((r) => RESUELTOS.indexOf(r.estado) < 0 && r.finVig);
  const groups = {};
  BUCKETS_R.forEach((b) => (groups[b.key] = []));
  pend.forEach((r) => groups[urgenciaR(r.finVig)].push(r));
  Object.values(groups).forEach((arr) => arr.sort((a, b) => (daysUntil(a.finVig) - daysUntil(b.finVig))));
  const total = pend.length;
  return (
    <div className="agenda">
      <div className="ag-banner">
        <span className="ag-banner-ico"><Ico name="refresh" size={22} /></span>
        <div className="ag-banner-txt">
          <span className="ag-banner-title">Renovaciones próximas</span>
          <span className="ag-banner-sub">{total} pólizas pendientes de renovar</span>
        </div>
        <button className="btn-primary" style={{ marginLeft: "auto" }} onClick={onNew}><Ico name="plus" size={16} />Registrar renovación</button>
      </div>
      {BUCKETS_R.map((b) => groups[b.key].length > 0 && (
        <section className="ag-group" key={b.key}>
          <div className={"ag-head " + b.head}><Ico name={b.icon} size={16} /><span>{b.label}</span><span className="ag-count">{groups[b.key].length}</span></div>
          <div className="ag-list">
            {groups[b.key].map((r) => (
              <button className="ag-card" key={r.id} onClick={() => onOpen(r.id)}>
                <span className={"ag-rail " + b.rail} />
                <div className="ag-card-main">
                  <div className="ag-card-top">
                    <span className="ag-client">{r.cliente}</span>
                    {estadoBadgeR(r.estado)}
                  </div>
                  <div className="ag-gestion">Póliza <span className="mono">{r.poliza || "—"}</span> · {r.seccion || "—"}</div>
                  <div className="ag-meta">
                    <span className="cia-pill sm">{r.aseguradora || "—"}</span>
                    <span className="ag-dot">·</span>
                    <span className="ag-gestor"><Ico name="clock" size={12} />{faltanTexto(r.finVig)}</span>
                  </div>
                </div>
                <div className="ag-card-right">
                  <span className="ag-vence-label">Vence</span>
                  <span className="ag-vence-date mono">{fmtFShort(r.finVig)}</span>
                  <span className="ag-vence-rel">{r.finVig ? new Date(r.finVig + "T00:00:00").getFullYear() : ""}</span>
                  <span className="btn-gcal xs" style={{ background: "#15803D", borderColor: "#15803D" }} onClick={(e) => { e.stopPropagation(); onRenovar(r); }}><Ico name="refresh" size={13} />Renovar</span>
                </div>
              </button>
            ))}
          </div>
        </section>
      ))}
      {total === 0 && (
        <div className="empty"><div className="empty-ico"><Ico name="check" size={26} /></div>
          <div className="empty-title">Sin renovaciones pendientes</div>
          <div className="empty-sub">No hay pólizas por renovar cargadas.</div></div>
      )}
    </div>
  );
}

// ---------- historial (tabla) ----------
function RenovToolbar({ count, aseguradoras, secciones, anios, asegF, onAseg, seccF, onSecc, estadoF, onEstado, anioF, onAnio, selected, onNew, onEdit, onDelete }) {
  return (
    <div className="toolbar">
      <div className="toolbar-left"><span className="toolbar-title">Renovaciones</span><span className="toolbar-count">{count}</span></div>
      <div className="toolbar-right">
        <div className="seg">
          {["Todos", ...ESTADOS_RENOV].map((s) => (
            <button key={s} className={"seg-btn" + (estadoF === s ? " is-on" : "")} onClick={() => onEstado(s)}>{s}</button>
          ))}
        </div>
        <select className="select" value={anioF} onChange={(e) => onAnio(e.target.value)}>
          <option value="Todos">Todos los años</option>
          {anios.map((a) => <option key={a} value={a}>{a}</option>)}
        </select>
        <select className="select" value={asegF} onChange={(e) => onAseg(e.target.value)}>
          <option value="Todos">Todas las aseguradoras</option>
          {aseguradoras.map((a) => <option key={a} value={a}>{a}</option>)}
        </select>
        <select className="select" value={seccF} onChange={(e) => onSecc(e.target.value)}>
          <option value="Todos">Todas las secciones</option>
          {secciones.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <div className="toolbar-divider" />
        <button className="btn-ghost" disabled={!selected} onClick={onEdit}><Ico name="edit" size={15} />Editar</button>
        <button className="btn-ghost danger" disabled={!selected} onClick={onDelete}><Ico name="trash" size={15} />Eliminar</button>
        <button className="btn-primary" onClick={onNew}><Ico name="plus" size={17} />Registrar</button>
      </div>
    </div>
  );
}
function RenovTable({ rows, selectedId, onSelect, onOpen }) {
  if (!rows.length) {
    return (<div className="empty"><div className="empty-ico"><Ico name="search" size={26} /></div><div className="empty-title">Sin resultados</div><div className="empty-sub">No hay renovaciones que coincidan.</div></div>);
  }
  return (
    <div className="table-wrap">
      <table className="table">
        <thead><tr>
          <th style={{ width: 34 }}></th><th>Vence</th><th>Estado</th><th>Cliente</th><th>Aseguradora</th><th>Sección</th><th>Póliza</th><th style={{ width: 44 }}></th>
        </tr></thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.id} className={selectedId === r.id ? "is-selected" : ""} onClick={() => onOpen(r.id)}>
              <td onClick={(e) => { e.stopPropagation(); onSelect(selectedId === r.id ? null : r.id); }}><span className={"radio" + (selectedId === r.id ? " on" : "")} /></td>
              <td><div className="vence"><span className="vence-date mono">{fmtF(r.finVig)}</span><span className="cell-sub">{faltanTexto(r.finVig)}</span></div></td>
              <td>{estadoBadgeR(r.estado)}</td>
              <td><div className="cell-strong">{r.cliente}</div></td>
              <td><span className="cia-pill">{r.aseguradora || "—"}</span></td>
              <td className="dim">{r.seccion || "—"}</td>
              <td><div className="mono cell-id">{r.poliza || "—"}</div><div className="cell-sub">{r.id}</div></td>
              <td onClick={(e) => { e.stopPropagation(); onOpen(r.id); }}><button className="row-open" title="Ver detalle"><Ico name="chevR" size={16} /></button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ---------- modal + form ----------
function RModal({ title, sub, onClose, children, footer, wide }) {
  React.useEffect(() => { const h = (e) => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <div className={"modal" + (wide ? " modal-wide" : "")} onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-head"><div><h2>{title}</h2>{sub && <p>{sub}</p>}</div><button className="btn-ghost tb-icon" onClick={onClose}><Ico name="close" size={18} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}
function RField({ label, children, required, full }) {
  return (<label className={"field" + (full ? " field-full" : "")}><span className="field-label">{label}{required && <i> *</i>}</span>{children}</label>);
}
function RenovFormModal({ mode, initial, station, onClose, onSubmit }) {
  const blank = { poliza: "", cliente: "", aseguradora: "", seccion: "", inicioVig: "", finVig: "", estado: "Pendiente", observaciones: "" };
  const [f, setF] = React.useState(initial ? { ...blank, ...initial } : blank);
  const [touched, setTouched] = React.useState(false);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const valid = String(f.cliente).trim() && f.finVig;
  const submit = () => { setTouched(true); if (!valid) return; onSubmit({ ...f }); };
  return (
    <RModal wide title={mode === "edit" ? "Editar renovación" : "Registrar renovación"}
      sub={mode === "edit" ? `${initial.id} · ${initial.cliente}` : "Cargá la póliza a renovar"} onClose={onClose}
      footer={<><span className="foot-note"><Ico name="monitor" size={14} /> Como <b>{station}</b></span>
        <div className="foot-btns"><button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={submit} disabled={!valid}><Ico name="check" size={16} />{mode === "edit" ? "Guardar" : "Registrar"}</button></div></>}>
      <div className="form-grid">
        <RField label="Cliente" required full><input className={"input" + (touched && !String(f.cliente).trim() ? " err" : "")} value={f.cliente} onChange={(e) => set("cliente", e.target.value)} placeholder="Nombre / razón social" /></RField>
        <RField label="N° de póliza"><input className="input mono" value={f.poliza} onChange={(e) => set("poliza", e.target.value)} placeholder="000000" /></RField>
        <RField label="Aseguradora"><input className="input" value={f.aseguradora} onChange={(e) => set("aseguradora", e.target.value)} placeholder="Allianz, Mercantil Andina…" /></RField>
        <RField label="Sección / Ramo"><input className="input" value={f.seccion} onChange={(e) => set("seccion", e.target.value)} placeholder="AUTOS, INT.COMERC…" /></RField>
        <RField label="Estado">
          <select className="input" value={f.estado} onChange={(e) => set("estado", e.target.value)}>{ESTADOS_RENOV.map((s) => <option key={s} value={s}>{s}</option>)}</select>
        </RField>
        <RField label="Inicio de vigencia"><input className="input" type="date" value={f.inicioVig} onChange={(e) => set("inicioVig", e.target.value)} /></RField>
        <RField label="Fin de vigencia (vence)" required><input className={"input" + (touched && !f.finVig ? " err" : "")} type="date" value={f.finVig} onChange={(e) => set("finVig", e.target.value)} /></RField>
        <RField label="Observaciones" full><textarea className="input" rows={2} value={f.observaciones} onChange={(e) => set("observaciones", e.target.value)} placeholder="Notas…" /></RField>
      </div>
    </RModal>
  );
}
function RenovDetailModal({ item, onClose, onEdit, onDelete, onRenovar }) {
  const Row = ({ k, v, mono }) => (<div className="dt-row"><span className="dt-k">{k}</span><span className={"dt-v" + (mono ? " mono" : "")}>{v || "—"}</span></div>);
  return (
    <RModal wide title={item.cliente} sub={<span className="mono">Póliza {item.poliza || "—"} · {item.id}</span>} onClose={onClose}
      footer={<><button className="btn-ghost danger" onClick={() => onDelete(item)}><Ico name="trash" size={15} />Eliminar</button>
        <div className="foot-btns"><button className="btn-ghost" onClick={() => onEdit(item)}><Ico name="edit" size={15} />Editar</button>
          <button className="btn-primary" onClick={() => onRenovar(item)}><Ico name="refresh" size={15} />Renovar (+1 año)</button></div></>}>
      <div className="dt-head">{estadoBadgeR(item.estado)}<span className="cia-pill">{item.aseguradora || "—"}</span><span className="dt-cal"><Ico name="clock" size={13} />{faltanTexto(item.finVig)}</span></div>
      <div className="dt-action">
        <div className="dt-action-k"><Ico name="refresh" size={14} />Vencimiento de la póliza</div>
        <div className="dt-action-v">{fmtF(item.finVig)}</div>
        <div className="dt-action-deadline">Vigencia desde <b className="mono">{fmtF(item.inicioVig)}</b></div>
      </div>
      <div className="dt-cols">
        <div className="dt-block"><span className="dt-block-title">Póliza</span>
          <Row k="Cliente" v={item.cliente} /><Row k="N° póliza" v={item.poliza} mono /><Row k="Aseguradora" v={item.aseguradora} /><Row k="Sección" v={item.seccion} />
        </div>
        <div className="dt-block"><span className="dt-block-title">Vigencia</span>
          <Row k="Inicio" v={fmtF(item.inicioVig)} mono /><Row k="Fin (vence)" v={fmtF(item.finVig)} mono /><Row k="Estado" v={item.estado} />
        </div>
      </div>
      {item.observaciones && <div className="dt-block"><span className="dt-block-title">Observaciones</span><p className="dt-obs">{item.observaciones}</p></div>}
    </RModal>
  );
}
function RenovConfirmDelete({ item, station, onClose, onConfirm }) {
  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <div className="modal modal-sm" onMouseDown={(e) => e.stopPropagation()}>
        <div className="confirm"><div className="confirm-ico"><Ico name="trash" size={22} /></div><h2>Eliminar renovación</h2>
          <p>Vas a dar de baja la renovación de <b>{item.cliente}</b> (póliza <span className="mono">{item.poliza || item.id}</span>).</p>
          <div className="confirm-note"><Ico name="monitor" size={14} /> Como <b>{station}</b></div>
          <div className="confirm-btns"><button className="btn-ghost" onClick={onClose}>Cancelar</button><button className="btn-danger" onClick={() => onConfirm(item)}><Ico name="trash" size={15} />Sí, eliminar</button></div></div>
      </div>
    </div>
  );
}

// ---------- orquestador ----------
function RenovacionesModule({ active, station, query }) {
  const [renovs, setRenovs] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [usingDb, setUsingDb] = React.useState(false);
  const [estadoF, setEstadoF] = React.useState("Todos");
  const [asegF, setAsegF] = React.useState("Todos");
  const [seccF, setSeccF] = React.useState("Todos");
  const [anioF, setAnioF] = React.useState("Todos");
  const [selectedId, setSelectedId] = React.useState(null);
  const [detailId, setDetailId] = React.useState(null);
  const [modal, setModal] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const tt = React.useRef(null);
  const flash = React.useCallback((msg) => { setToast({ msg, id: Date.now() }); clearTimeout(tt.current); tt.current = setTimeout(() => setToast(null), 2600); }, []);

  React.useEffect(() => {
    let alive = true;
    (async () => {
      if (window.DB && window.DB.configured() && window.DB.renov) {
        try { const items = await window.DB.renov.list(); if (alive) { setRenovs(items); setUsingDb(true); } }
        catch (e) { console.error("Renov:", e); if (alive) { setRenovs([]); setUsingDb(false); flash("No se pudieron cargar las renovaciones"); } }
      }
      if (alive) setLoading(false);
    })();
    return () => { alive = false; };
  }, [flash]);

  React.useEffect(() => {
    if (!usingDb || !window.DB.renov || !window.DB.renov.subscribe) return;
    let timer = null, alive = true;
    const refresh = () => { clearTimeout(timer); timer = setTimeout(async () => { try { const items = await window.DB.renov.list(); if (alive) setRenovs(items); } catch (e) { console.error(e); } }, 400); };
    const unsub = window.DB.renov.subscribe(refresh);
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb]);

  const activos = renovs.filter((r) => !r.eliminado);
  const aseguradoras = Array.from(new Set(activos.map((r) => r.aseguradora).filter(Boolean))).sort();
  const secciones = Array.from(new Set(activos.map((r) => r.seccion).filter(Boolean))).sort();
  const anios = Array.from(new Set(activos.map((r) => (r.finVig ? new Date(r.finVig + "T00:00:00").getFullYear() : null)).filter(Boolean))).sort();

  const rows = React.useMemo(() => {
    const q = (query || "").trim().toLowerCase();
    return activos.filter((r) => {
      if (estadoF !== "Todos" && r.estado !== estadoF) return false;
      if (asegF !== "Todos" && r.aseguradora !== asegF) return false;
      if (seccF !== "Todos" && r.seccion !== seccF) return false;
      if (anioF !== "Todos" && String(r.finVig ? new Date(r.finVig + "T00:00:00").getFullYear() : "") !== String(anioF)) return false;
      if (q) { const hay = [r.cliente, r.poliza, r.aseguradora, r.seccion, r.id].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
      return true;
    }).sort((a, b) => (a.finVig || "").localeCompare(b.finVig || ""));
  }, [activos, query, estadoF, asegF, seccF, anioF]);

  const selected = activos.find((r) => r.id === selectedId) || null;
  const detailItem = activos.find((r) => r.id === detailId) || null;
  const openEdit = (item) => { setDetailId(null); setModal({ type: "edit", item }); };
  const askDelete = (item) => { setDetailId(null); setModal({ type: "delete", item }); };

  const persist = async (item, isNew) => {
    if (!usingDb) return item;
    return isNew ? await window.DB.renov.create(item) : await window.DB.renov.update(item);
  };
  const handleCreate = async (data) => {
    let n;
    if (usingDb) { try { n = (await window.DB.renov.maxN()) + 1; } catch (e) { n = activos.reduce((m, r) => Math.max(m, r.n || 0), 0) + 1; } }
    else { n = activos.reduce((m, r) => Math.max(m, r.n || 0), 0) + 1; }
    let item = { ...data, id: "REN-" + String(n).padStart(4, "0"), n, ultimaModPor: station, ultimaModFecha: new Date().toISOString(), eliminado: false };
    try { if (usingDb) item = await window.DB.renov.create(item); } catch (e) { console.error(e); flash("Error al guardar"); return; }
    setRenovs((p) => [item, ...p]); setModal(null); flash(`Renovación de ${data.cliente} registrada`);
  };
  const handleUpdate = async (data) => {
    let updated = { ...data, ultimaModPor: station, ultimaModFecha: new Date().toISOString() };
    try { if (usingDb) updated = await window.DB.renov.update(updated); } catch (e) { console.error(e); flash("Error al actualizar"); return; }
    setRenovs((p) => p.map((r) => r.id === data.id ? { ...r, ...updated } : r)); setModal(null); flash(`Renovación de ${data.cliente} actualizada`);
  };
  const handleDelete = async (item) => {
    try { if (usingDb) await window.DB.renov.remove(item); } catch (e) { console.error(e); flash("Error al eliminar"); return; }
    setRenovs((p) => p.map((r) => r.id === item.id ? { ...r, eliminado: true } : r));
    if (selectedId === item.id) setSelectedId(null); setModal(null); flash(`Renovación de ${item.cliente} dada de baja`);
  };
  const handleRenovar = async (item) => {
    const rolled = { ...item, inicioVig: addYearISO(item.inicioVig, 1), finVig: addYearISO(item.finVig, 1), estado: "Pendiente", ultimaModPor: station, ultimaModFecha: new Date().toISOString() };
    let updated = rolled;
    try { if (usingDb) updated = await window.DB.renov.update(rolled); } catch (e) { console.error(e); flash("Error al renovar"); return; }
    setRenovs((p) => p.map((r) => r.id === item.id ? { ...r, ...updated } : r));
    setDetailId(null); flash(`${item.cliente} renovada — vuelve el año próximo`);
  };

  if (loading) return <div className="boot"><div className="boot-inner"><div className="boot-spin" />Cargando renovaciones…</div></div>;

  const modals = (
    <>
      {detailItem && <RenovDetailModal item={detailItem} onClose={() => setDetailId(null)} onEdit={openEdit} onDelete={askDelete} onRenovar={handleRenovar} />}
      {modal?.type === "new" && <RenovFormModal mode="new" station={station} onClose={() => setModal(null)} onSubmit={handleCreate} />}
      {modal?.type === "edit" && <RenovFormModal mode="edit" initial={modal.item} station={station} onClose={() => setModal(null)} onSubmit={handleUpdate} />}
      {modal?.type === "delete" && <RenovConfirmDelete item={modal.item} station={station} onClose={() => setModal(null)} onConfirm={handleDelete} />}
      {toast && <div className="toast"><span className="toast-ico"><Ico name="check" size={15} /></span><span>{toast.msg}</span></div>}
    </>
  );

  if (active === "renov-proximas") {
    return (<>
      <RenovKpis data={activos} />
      <RenovProximas data={activos} onOpen={(id) => setDetailId(id)} onRenovar={handleRenovar} onNew={() => setModal({ type: "new" })} />
      {modals}
    </>);
  }
  return (<>
    <div className="panel">
      <RenovToolbar count={rows.length} aseguradoras={aseguradoras} secciones={secciones} anios={anios}
        asegF={asegF} onAseg={setAsegF} seccF={seccF} onSecc={setSeccF} estadoF={estadoF} onEstado={setEstadoF} anioF={anioF} onAnio={setAnioF}
        selected={selected} onNew={() => setModal({ type: "new" })} onEdit={() => selected && openEdit(selected)} onDelete={() => selected && askDelete(selected)} />
      <RenovTable rows={rows} selectedId={selectedId} onSelect={setSelectedId} onOpen={(id) => setDetailId(id)} />
    </div>
    {modals}
  </>);
}

Object.assign(window, { RenovacionesModule });
</script>
<script type="text/babel" data-file="comercial.jsx">
// comercial.jsx — Saraceni Seguros · Módulo COMERCIAL
// Pedidos de cotización que llegan del link público /cotizar-hogar.
// Panel con KPIs + bandeja de cotizaciones para gestionar y cerrar.

const COT_ESTADO = {
  "nueva":      { fg: "#B91C1C", bg: "#FBE3E3", t: "Nueva" },
  "cotizada":   { fg: "#15803D", bg: "#E6F4EA", t: "Cotizada" },
  "descartada": { fg: "#475569", bg: "#EEF1F4", t: "Descartada" },
};
function cotBadge(estado) {
  const c = COT_ESTADO[estado] || COT_ESTADO.nueva;
  return <span className="badge" style={{ background: c.bg, color: c.fg, fontSize: 12 }}><span className="badge-dot" style={{ background: c.fg }} />{c.t}</span>;
}
const money = (v) => (v == null || v === "" ? "" : "$ " + Number(v).toLocaleString("es-AR"));
// "notebook Lenovo IdeaPad 3 — $ 1.200.000" a partir de los campos separados
function equipoTxt(objeto, marca, modelo, valor) {
  const desc = [objeto, marca, modelo].filter(Boolean).join(" ");
  if (!desc && valor == null) return "";
  return desc + (valor != null ? (desc ? " — " : "") + money(valor) : "");
}

// ---------- tarjeta de cotización ----------
function CotCard({ c, onCotizar, onDescartar, onReabrir, onNotas }) {
  const [notas, setNotas] = React.useState(c.notasInternas || "");
  const [editNotas, setEditNotas] = React.useState(false);
  const nueva = c.estado === "nueva";
  const D = ({ k, v, mono }) => (v || v === 0 ? <div><div className="sol-k">{k}</div><div className={"sol-v" + (mono ? " mono" : "")}>{v}</div></div> : null);
  const domicilio = [c.direccion, c.piso ? "Piso " + c.piso : null, c.localidad, c.codigoPostal ? "CP " + c.codigoPostal : null].filter(Boolean).join(" · ");

  return (
    <div className={"sol-card" + (nueva ? " nueva" : "")}>
      <div className="sol-head">
        <div>
          <div className="sol-name">{c.nombre}</div>
          <div className="sol-meta mono">{c.id} · ref {c.ref}{c.creado ? " · " + fmtTimeAgo(c.creado) : ""}</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <span className="cia-pill sm">Hogar</span>
          {cotBadge(c.estado)}
        </div>
      </div>

      <div className="sol-sub">Contacto</div>
      <div className="sol-grid-datos">
        <D k="Documento" v={c.documento} mono />
        <D k="Teléfono" v={c.telefono} mono />
        <D k="Email" v={c.email} />
      </div>

      <div className="sol-sub">Vivienda</div>
      <div className="sol-grid-datos">
        <D k="Tipo" v={c.tipoVivienda} />
        <D k="Superficie" v={c.metros2 ? c.metros2 + " m²" : ""} />
        <D k="Código postal" v={c.codigoPostal} mono />
        {c.enCountry != null && (
          <div>
            <div className="sol-k">Country / barrio cerrado</div>
            <div className="sol-v" style={c.enCountry ? { color: "#15803D", fontWeight: 700 } : null}>
              {c.enCountry ? "Sí — con vallado perimetral" : "No"}
            </div>
          </div>
        )}
        {c.tienePileta != null && (
          <div>
            <div className="sol-k">Pileta</div>
            <div className="sol-v" style={c.tienePileta ? { color: "#1D4ED8", fontWeight: 700 } : null}>
              {c.tienePileta ? "Sí" : "No"}
            </div>
          </div>
        )}
      </div>
      {domicilio && <div className="sol-relato" style={{ marginTop: 8 }}>{domicilio}</div>}
      {(c.alarma || c.medidasSeguridad) && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
          {c.alarma && <span className="cia-pill sm">Alarma</span>}
          {c.medidasSeguridad && <span className="cia-pill sm">Medidas mínimas de seguridad</span>}
        </div>
      )}

      <div className="sol-sub">Coberturas pedidas</div>
      {(c.equiposFuera || c.notebookPc || c.bicicleta || c.roboCelular) ? (
        <>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {c.equiposFuera && <span className="cia-pill sm">Equipos electrónicos fuera del domicilio</span>}
            {c.notebookPc && <span className="cia-pill sm">Notebook o PC en el domicilio</span>}
            {c.bicicleta && <span className="cia-pill sm">Bicicleta</span>}
            {c.roboCelular && <span className="cia-pill sm">Robo de celular{c.celularValor ? " — " + money(c.celularValor) : ""}</span>}
          </div>
          {c.bicicleta && (
            <div className="sol-relato" style={{ marginTop: 8 }}>
              <b>Bicicleta:</b> {[c.bicicletaMarca, c.bicicletaModelo].filter(Boolean).join(" ")}
              {c.bicicletaValor ? " — " + money(c.bicicletaValor) : ""}
            </div>
          )}
          {c.equiposFuera && (equipoTxt(c.equiposFueraObjeto, c.equiposFueraMarca, c.equiposFueraModelo, c.equiposFueraValor) || c.equiposFueraDetalle) && (
            <div className="sol-relato" style={{ marginTop: 8 }}>
              <b>Equipo fuera del domicilio:</b>{" "}
              {equipoTxt(c.equiposFueraObjeto, c.equiposFueraMarca, c.equiposFueraModelo, c.equiposFueraValor) || c.equiposFueraDetalle}
            </div>
          )}
          {c.notebookPc && (equipoTxt("", c.notebookPcMarca, c.notebookPcModelo, c.notebookPcValor) || c.notebookPcDetalle) && (
            <div className="sol-relato" style={{ marginTop: 8 }}>
              <b>Notebook / PC:</b>{" "}
              {equipoTxt("", c.notebookPcMarca, c.notebookPcModelo, c.notebookPcValor) || c.notebookPcDetalle}
            </div>
          )}
        </>
      ) : (
        <div className="sol-v" style={{ color: "var(--muted)" }}>Solo la cobertura base</div>
      )}
      {c.observaciones && <div className="sol-relato" style={{ marginTop: 8 }}>{c.observaciones}</div>}

      {(editNotas || c.notasInternas) && (
        <div style={{ marginTop: 12 }}>
          <div className="sol-k" style={{ marginBottom: 4 }}>Notas internas</div>
          {editNotas ? (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <textarea className="input" rows={2} style={{ flex: "1 1 260px" }} value={notas} autoFocus
                onChange={(e) => setNotas(e.target.value)} placeholder="Prima cotizada, compañía, seguimiento…" />
              <button className="btn-primary sm" onClick={() => { onNotas(c, notas); setEditNotas(false); }}>Guardar</button>
              <button className="btn-ghost sm" onClick={() => { setNotas(c.notasInternas || ""); setEditNotas(false); }}>Cancelar</button>
            </div>
          ) : (
            <div className="sol-v" style={{ whiteSpace: "pre-wrap" }}>{c.notasInternas}</div>
          )}
        </div>
      )}

      <div className="sol-actions">
        {!editNotas && <button className="btn-ghost sm" onClick={() => setEditNotas(true)}><Ico name="edit" size={14} />{c.notasInternas ? "Editar notas" : "Agregar notas"}</button>}
        {nueva ? (
          <>
            <button className="btn-primary" onClick={() => onCotizar(c)}><Ico name="check" size={16} />Marcar cotizada</button>
            <button className="btn-ghost danger" onClick={() => onDescartar(c)}><Ico name="close" size={15} />Descartar</button>
          </>
        ) : (
          <button className="btn-ghost sm" onClick={() => onReabrir(c)}><Ico name="refresh" size={14} />Reabrir</button>
        )}
      </div>
    </div>
  );
}

// ---------- panel de control ----------
function ComercialPanel({ data }) {
  const nuevas = data.filter((c) => c.estado === "nueva");
  const cotizadas = data.filter((c) => c.estado === "cotizada");
  const descartadas = data.filter((c) => c.estado === "descartada");
  const cerradas = cotizadas.length + descartadas.length;
  const conversion = cerradas ? Math.round((cotizadas.length / cerradas) * 100) : 0;
  const hoy = new Date().toISOString().slice(0, 10);
  const delMes = data.filter((c) => (c.creado || "").slice(0, 7) === hoy.slice(0, 7)).length;

  const cards = [
    { label: "Pedidos sin responder", value: nuevas.length, hint: "esperando cotización", tone: { bg: "#FBE3E3", fg: "#C0241D" }, icon: "mail" },
    { label: "Cotizadas", value: cotizadas.length, hint: "propuesta enviada", tone: { bg: "#E6F4EA", fg: "#15803D" }, icon: "check" },
    { label: "Pedidos del mes", value: delMes, hint: "entraron este mes", tone: { bg: "#E8F0FE", fg: "#1D4ED8" }, icon: "grid" },
    { label: "Cotizadas / cerradas", value: conversion + "%", hint: cerradas + " cerradas en total", tone: { bg: "#FDF1DC", fg: "#B45309" }, icon: "target" },
  ];

  return (
    <div>
      <div className="kpis">
        {cards.map((c) => (
          <div className="kpi" key={c.label}>
            <span className="kpi-stripe" style={{ background: c.tone.fg }} />
            <div className="kpi-top"><span className="kpi-ico" style={{ background: c.tone.bg, color: c.tone.fg }}><Ico name={c.icon} size={17} /></span><span className="kpi-label">{c.label}</span></div>
            <div className="kpi-mid"><span className="kpi-value">{c.value}</span></div>
            <div className="kpi-foot"><span className="kpi-hint">{c.hint}</span></div>
          </div>
        ))}
      </div>
      <div className="panel">
        <div className="toolbar">
          <div className="toolbar-left"><span className="toolbar-title">Últimos pedidos de cotización</span><span className="toolbar-count">{data.length}</span></div>
        </div>
        {data.length === 0 ? (
          <div className="empty"><div className="empty-ico"><Ico name="mail" size={26} /></div>
            <div className="empty-title">Todavía no llegaron pedidos</div>
            <div className="empty-sub">Compartí el link de cotización con tus clientes y los pedidos aparecen acá al instante.</div></div>
        ) : (
          <div className="table-wrap">
            <table className="table">
              <thead><tr><th>Recibido</th><th>Interesado</th><th>Vivienda</th><th>Contacto</th><th>Estado</th><th>N°</th></tr></thead>
              <tbody>
                {data.slice(0, 25).map((c) => (
                  <tr key={c._dbId}>
                    <td className="cell-sub">{c.creado ? fmtDate(c.creado.slice(0, 10)) : "—"}</td>
                    <td><div className="cell-strong">{c.nombre}</div><div className="cell-sub mono">{c.documento}</div></td>
                    <td>
                      <div>{c.tipoVivienda}{c.metros2 ? " · " + c.metros2 + " m²" : ""}</div>
                      <div className="cell-sub">{[c.localidad, c.codigoPostal].filter(Boolean).join(" · ")}</div>
                    </td>
                    <td className="mono">{c.telefono}</td>
                    <td>{cotBadge(c.estado)}</td>
                    <td className="mono cell-id">{c.id}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- bandeja de cotizaciones ----------
function CotizacionesView({ data, onCotizar, onDescartar, onReabrir, onNotas }) {
  const [verHist, setVerHist] = React.useState(false);
  const nuevas = data.filter((c) => c.estado === "nueva");
  const resto = data.filter((c) => c.estado !== "nueva");
  const baseLinkCot = (window.location.origin && window.location.origin !== "null") ? window.location.origin : "https://tu-portal.com.ar";
  const linkPublico = baseLinkCot + "/cotizar-hogar";
  const copiar = () => { try { navigator.clipboard.writeText(linkPublico); } catch (e) { /* noop */ } };

  return (
    <div className="sol-wrap">
      <div className="ag-banner">
        <span className="ag-banner-ico" style={{ background: "#fdecec", color: "var(--brand)" }}><Ico name="home" size={22} /></span>
        <div className="ag-banner-txt">
          <span className="ag-banner-title">Cotizaciones de seguro de hogar</span>
          <span className="ag-banner-sub">Compartí este link con tus clientes: <b className="mono">{linkPublico}</b></span>
        </div>
        <button className="btn-ghost" style={{ marginLeft: "auto" }} onClick={copiar}><Ico name="link" size={15} />Copiar link</button>
      </div>

      {nuevas.length > 0 ? (
        <div className="sol-grid">
          {nuevas.map((c) => <CotCard key={c._dbId} c={c} onCotizar={onCotizar} onDescartar={onDescartar} onReabrir={onReabrir} onNotas={onNotas} />)}
        </div>
      ) : (
        <div className="empty"><div className="empty-ico"><Ico name="check" size={26} /></div>
          <div className="empty-title">Sin pedidos pendientes</div>
          <div className="empty-sub">Cuando alguien complete el formulario de cotización, aparece acá al instante.</div></div>
      )}

      {resto.length > 0 && (
        <div style={{ marginTop: 22 }}>
          <button className="btn-ghost sm" onClick={() => setVerHist((v) => !v)}>
            <Ico name={verHist ? "chevL" : "chevR"} size={14} />{verHist ? "Ocultar gestionadas" : `Ver cotizadas y descartadas (${resto.length})`}
          </button>
          {verHist && (
            <div className="sol-grid" style={{ marginTop: 12 }}>
              {resto.map((c) => <CotCard key={c._dbId} c={c} onCotizar={onCotizar} onDescartar={onDescartar} onReabrir={onReabrir} onNotas={onNotas} />)}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---------- orquestador ----------
function ComercialModule({ active, station, query }) {
  const [data, setData] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [toast, setToast] = React.useState(null);
  const timer = React.useRef(null);
  const flash = (msg, err) => {
    setToast({ msg, err: !!err, id: Date.now() });
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), err ? 4000 : 2600);
  };

  const load = React.useCallback(async () => {
    if (!window.DB || !window.DB.configured() || !window.DB.cot) { setLoading(false); return; }
    try { setData(await window.DB.cot.list()); }
    catch (e) { console.error("Cotizaciones:", e); }
    setLoading(false);
  }, []);

  React.useEffect(() => { load(); }, [load]);
  React.useEffect(() => {
    if (!window.DB || !window.DB.configured() || !window.DB.cot) return;
    let t = null;
    const unsub = window.DB.cot.subscribe(() => { clearTimeout(t); t = setTimeout(load, 400); });
    return () => { clearTimeout(t); if (unsub) unsub(); };
  }, [load]);

  const cambiarEstado = async (c, estado, msg) => {
    try {
      const up = await window.DB.cot.update({ _dbId: c._dbId, estado, gestionadaPor: station });
      setData((p) => p.map((x) => (x._dbId === c._dbId ? up : x)));
      flash(msg);
    } catch (e) { console.error(e); flash("No se pudo actualizar la cotización", true); }
  };
  const guardarNotas = async (c, notas) => {
    try {
      const up = await window.DB.cot.update({ _dbId: c._dbId, estado: c.estado, gestionadaPor: station, notasInternas: notas });
      setData((p) => p.map((x) => (x._dbId === c._dbId ? up : x)));
      flash("Notas guardadas");
    } catch (e) { console.error(e); flash("No se pudieron guardar las notas", true); }
  };

  const filtrada = React.useMemo(() => {
    const q = (query || "").trim().toLowerCase();
    if (!q) return data;
    return data.filter((c) => [c.nombre, c.documento, c.telefono, c.email, c.direccion, c.localidad, c.codigoPostal, c.id, c.ref]
      .join(" ").toLowerCase().includes(q));
  }, [data, query]);

  if (loading) return <div className="boot"><div className="boot-inner"><div className="boot-spin" />Cargando…</div></div>;

  return (
    <>
      {active === "com-panel"
        ? <ComercialPanel data={filtrada} />
        : <CotizacionesView data={filtrada}
            onCotizar={(c) => cambiarEstado(c, "cotizada", "Cotización marcada como enviada")}
            onDescartar={(c) => { if (window.confirm(`¿Descartar el pedido de ${c.nombre}?`)) cambiarEstado(c, "descartada", "Pedido descartado"); }}
            onReabrir={(c) => cambiarEstado(c, "nueva", "Pedido reabierto")}
            onNotas={guardarNotas} />}
      {toast && (
        <div className="toast">
          <span className="toast-ico" style={toast.err ? { background: "#DC2626" } : null}><Ico name={toast.err ? "alert" : "check"} size={15} /></span>
          <span>{toast.msg}</span>
        </div>
      )}
    </>
  );
}

Object.assign(window, { ComercialModule, CotizacionesView, ComercialPanel });
</script>
<script type="text/babel" data-file="pendientes.jsx">
// pendientes.jsx — Saraceni Seguros · Módulo de Pendientes (tareas del día a día)

const ESTADOS_PEND = ["Pendiente", "En curso", "Hecho"];
const ESTADO_PEND_COLOR = {
  "Pendiente": { fg: "#B45309", bg: "#FEF3E2" },
  "En curso":  { fg: "#1D4ED8", bg: "#E8F0FE" },
  "Hecho":     { fg: "#15803D", bg: "#E6F4EA" },
};
const PRIO_PEND = ["Alta", "Media", "Baja"];
const PRIO_PEND_COLOR = {
  "Alta":  { fg: "#C0241D", bg: "#FBE3E3" },
  "Media": { fg: "#B45309", bg: "#FEF3E2" },
  "Baja":  { fg: "#475569", bg: "#EEF1F4" },
};
const CATS_PEND = ["Cotización", "Póliza", "Cobranza", "Administración", "Otro"];

function pendBadge(estado) {
  const c = ESTADO_PEND_COLOR[estado] || { fg: "#475569", bg: "#EEF1F4" };
  return <span className="badge" style={{ background: c.bg, color: c.fg, fontSize: 12 }}><span className="badge-dot" style={{ background: c.fg }} />{estado}</span>;
}
function prioBadge(p) {
  const c = PRIO_PEND_COLOR[p] || PRIO_PEND_COLOR.Media;
  return <span className="badge" style={{ background: c.bg, color: c.fg, fontSize: 11.5, fontWeight: 800 }}>{p}</span>;
}
function urgPend(p) {
  if (p.estado === "Hecho") return "resuelto";
  if (!p.fechaLimite) return "sinfecha";
  const du = daysUntil(p.fechaLimite);
  if (du == null) return "sinfecha";
  if (du < 0) return "vencido";
  if (du === 0) return "hoy";
  if (du <= 3) return "proximo";
  return "normal";
}

// ---------- KPIs ----------
function PendKpis({ data }) {
  const activas = data.filter((p) => p.estado !== "Hecho");
  const vencidas = activas.filter((p) => urgPend(p) === "vencido").length;
  const porVencer = activas.filter((p) => ["hoy", "proximo"].includes(urgPend(p))).length;
  const hechas = data.filter((p) => p.estado === "Hecho").length;
  const cards = [
    { label: "Tareas activas", value: activas.length, hint: "pendientes + en curso", tone: { bg: "#FEF3E2", fg: "#B45309" }, icon: "flag" },
    { label: "Por vencer", value: porVencer, hint: "vencen en ≤ 3 días", tone: { bg: "#E8F0FE", fg: "#1D4ED8" }, icon: "clock" },
    { label: "Vencidas", value: vencidas, hint: "requieren acción", tone: { bg: "#FBE3E3", fg: "#C0241D" }, icon: "alert" },
    { label: "Hechas", value: hechas, hint: "completadas", tone: { bg: "#E6F4EA", fg: "#15803D" }, icon: "check" },
  ];
  return (
    <div className="kpis">
      {cards.map((c) => (
        <div className="kpi" key={c.label}>
          <span className="kpi-stripe" style={{ background: c.tone.fg }} />
          <div className="kpi-top"><span className="kpi-ico" style={{ background: c.tone.bg, color: c.tone.fg }}><Ico name={c.icon} size={17} /></span><span className="kpi-label">{c.label}</span></div>
          <div className="kpi-mid"><span className="kpi-value">{c.value}</span></div>
          <div className="kpi-foot"><span className="kpi-hint">{c.hint}</span></div>
        </div>
      ))}
    </div>
  );
}

// ---------- modal + form ----------
function PModal({ title, sub, onClose, children, footer, wide }) {
  React.useEffect(() => { const h = (e) => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <div className={"modal" + (wide ? " modal-wide" : "")} onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-head"><div><h2>{title}</h2>{sub && <p>{sub}</p>}</div><button className="btn-ghost tb-icon" onClick={onClose}><Ico name="close" size={18} /></button></div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}
function PField({ label, children, required, full }) {
  return (<label className={"field" + (full ? " field-full" : "")}><span className="field-label">{label}{required && <i> *</i>}</span>{children}</label>);
}
function PendFormModal({ mode, initial, station, onClose, onSubmit, usuarios }) {
  const blank = { titulo: "", descripcion: "", cliente: "", categoria: "Otro", prioridad: "Media", fechaLimite: "", estado: "Pendiente", asignado: station || "", asignadoA: null };
  const [f, setF] = React.useState(initial ? { ...blank, ...initial } : blank);
  const [touched, setTouched] = React.useState(false);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const valid = String(f.titulo).trim();
  const submit = () => { setTouched(true); if (!valid) return; onSubmit({ ...f }); };
  return (
    <PModal wide title={mode === "edit" ? "Editar pendiente" : "Nuevo pendiente"}
      sub={mode === "edit" ? `${initial.id}` : "Cargá la tarea a seguir"} onClose={onClose}
      footer={<><span className="foot-note"><Ico name="monitor" size={14} /> Como <b>{station}</b></span>
        <div className="foot-btns"><button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={submit} disabled={!valid}><Ico name="check" size={16} />{mode === "edit" ? "Guardar" : "Registrar"}</button></div></>}>
      <div className="form-grid">
        <PField label="Tarea" required full>
          <input className={"input" + (touched && !valid ? " err" : "")} value={f.titulo} onChange={(e) => set("titulo", e.target.value)} placeholder="Qué hay que hacer" autoFocus />
        </PField>
        <PField label="Detalle" full>
          <textarea className="input" rows={2} value={f.descripcion} onChange={(e) => set("descripcion", e.target.value)} placeholder="Notas, contexto…" />
        </PField>
        <PField label="Cliente (opcional)"><input className="input" value={f.cliente} onChange={(e) => set("cliente", e.target.value)} placeholder="A quién refiere" /></PField>
        <PField label="Categoría">
          <select className="input" value={f.categoria} onChange={(e) => set("categoria", e.target.value)}>{CATS_PEND.map((c) => <option key={c} value={c}>{c}</option>)}</select>
        </PField>
        <PField label="Prioridad">
          <div className="estado-pills">
            {PRIO_PEND.map((p) => (
              <button key={p} type="button" className={"epill" + (f.prioridad === p ? " on" : "")} onClick={() => set("prioridad", p)}>
                <span className="epill-dot" style={{ background: PRIO_PEND_COLOR[p].fg }} />{p}
              </button>
            ))}
          </div>
        </PField>
        <PField label="Vence"><input className="input" type="date" value={f.fechaLimite} onChange={(e) => set("fechaLimite", e.target.value)} /></PField>
        <PField label="Estado">
          <select className="input" value={f.estado} onChange={(e) => set("estado", e.target.value)}>{ESTADOS_PEND.map((s) => <option key={s} value={s}>{s}</option>)}</select>
        </PField>
        <PField label="Responsable">
          {(usuarios || []).length > 0 ? (
            <select className="input" value={f.asignadoA || ""}
              onChange={(e) => {
                const id = e.target.value || null;
                const u = (usuarios || []).find((x) => x.id === id);
                setF((p) => ({ ...p, asignadoA: id, asignado: u ? (u.nombre || u.email) : "" }));
              }}>
              <option value="">Sin asignar</option>
              {usuarios.map((u) => <option key={u.id} value={u.id}>{u.nombre || u.email}</option>)}
            </select>
          ) : (
            <input className="input" value={f.asignado} onChange={(e) => set("asignado", e.target.value)} placeholder="Hernan / Nicolas" />
          )}
        </PField>
      </div>
    </PModal>
  );
}
function PendConfirmDelete({ item, station, onClose, onConfirm }) {
  return (
    <div className="modal-scrim" onMouseDown={onClose}>

      </div>

}

// ---------- agenda por urgencia ----------
const BUCKETS_PEND = [
  { key: "vencido", label: "Vencidas", icon: "alert", head: "ag-vencido", rail: "ag-rail-vencido" },
  { key: "hoy", label: "Vencen hoy", icon: "clock", head: "ag-hoy", rail: "ag-rail-hoy" },
  { key: "proximo", label: "Próximos 3 días", icon: "clock", head: "ag-proximo", rail: "ag-rail-proximo" },
  { key: "normal", label: "Más adelante", icon: "agenda", head: "ag-normal", rail: "ag-rail-normal" },
  { key: "sinfecha", label: "Sin fecha", icon: "flag", head: "ag-normal", rail: "ag-rail-normal" },
];
function PendAgenda({ data, onOpen, onToggle, onNew }) {
  const activas = data.filter((p) => p.estado !== "Hecho");
  const groups = {}; BUCKETS_PEND.forEach((b) => (groups[b.key] = []));
  activas.forEach((p) => { const k = urgPend(p); if (groups[k]) groups[k].push(p); });
  Object.values(groups).forEach((arr) => arr.sort((a, b) => (a.fechaLimite || "9999").localeCompare(b.fechaLimite || "9999")));
  return (
    <div className="agenda">
      <div className="ag-banner">
        <span className="ag-banner-ico"><Ico name="flag" size={22} /></span>
        <div className="ag-banner-txt">

        <button className="btn-primary" style={{ marginLeft: "auto" }} onClick={onNew}><Ico name="plus" size={16} />Nuevo pendiente</button>
      </div>
      {BUCKETS_PEND.map((b) => groups[b.key].length > 0 && (
        <section className="ag-group" key={b.key}>
          <div className={"ag-head " + b.head}><Ico name={b.icon} size={16} /><span>{b.label}</span><span className="ag-count">{groups[b.key].length}</span></div>
          <div className="ag-list">
            {groups[b.key].map((p) => (
              <button className="ag-card" key={p.id} onClick={() => onOpen(p)}>
                <span className={"ag-rail " + b.rail} />
                <div className="ag-card-main">
                  <div className="ag-card-top">
                    <span className="ag-client">{p.titulo}</span>
                    {prioBadge(p.prioridad)}
                    {pendBadge(p.estado)}
                  </div>
                  {p.descripcion && <div className="ag-gestion">{p.descripcion}</div>}
                  <div className="ag-meta">
                    <span className="cia-pill sm">{p.categoria}</span>
                    {p.cliente && <><span className="ag-dot">·</span><span className="ag-gestor"><Ico name="user" size={12} />{p.cliente}</span></>}
                    {p.asignado && <><span className="ag-dot">·</span><span className="ag-gestor"><Ico name="monitor" size={12} />{p.asignado}</span></>}
                  </div>
                </div>
                <div className="ag-card-right">
                  <span className="ag-vence-label">Vence</span>
                  <span className="ag-vence-date mono">{p.fechaLimite ? fmtDateShort(p.fechaLimite) : "—"}</span>
                  <span className="ag-vence-rel">{p.fechaLimite ? venceTexto(p.fechaLimite) : "sin fecha"}</span>
                  <span className="btn-gcal xs" style={{ background: "#15803D", borderColor: "#15803D" }}
                    onClick={(e) => { e.stopPropagation(); onToggle(p); }}><Ico name="check" size={13} />Hecha</span>
                </div>
