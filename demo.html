}

// ---------- orquestador ----------
function PendientesModule({ active, station, query, usuarios }) {
  const [tareas, setTareas] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [usingDb, setUsingDb] = React.useState(false);
  const [estadoF, setEstadoF] = React.useState("Activas");
  const [prioF, setPrioF] = React.useState("Todos");
  const [catF, setCatF] = React.useState("Todos");
  const [modal, setModal] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const tt = React.useRef(null);
  const flash = React.useCallback((msg) => { setToast({ msg, id: Date.now() }); clearTimeout(tt.current); tt.current = setTimeout(() => setToast(null), 2600); }, []);

  React.useEffect(() => {
    let alive = true;
    (async () => {
      if (window.DB && window.DB.configured() && window.DB.pend) {
        try { const items = await window.DB.pend.list(); if (alive) { setTareas(items); setUsingDb(true); } }
        catch (e) { console.error("Pendientes:", e); if (alive) flash("No se pudieron cargar los pendientes"); }
      }
      if (alive) setLoading(false);
    })();
    return () => { alive = false; };
  }, [flash]);

  React.useEffect(() => {
    if (!usingDb || !window.DB.pend.subscribe) return;
    let timer = null, alive = true;
    const refresh = () => { clearTimeout(timer); timer = setTimeout(async () => { try { const items = await window.DB.pend.list(); if (alive) setTareas(items); } catch (e) { console.error(e); } }, 400); };
    const unsub = window.DB.pend.subscribe(refresh);
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb]);

  const activos = tareas.filter((p) => !p.eliminado);
  const rows = React.useMemo(() => {
    const q = (query || "").trim().toLowerCase();
    return activos.filter((p) => {
      if (estadoF === "Activas" && p.estado === "Hecho") return false;
      if (estadoF !== "Todos" && estadoF !== "Activas" && p.estado !== estadoF) return false;
      if (prioF !== "Todos" && p.prioridad !== prioF) return false;
      if (catF !== "Todos" && p.categoria !== catF) return false;
      if (q) { const hay = [p.titulo, p.descripcion, p.cliente, p.categoria, p.asignado].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
      return true;
    }).sort((a, b) => {
      if ((a.estado === "Hecho") !== (b.estado === "Hecho")) return a.estado === "Hecho" ? 1 : -1;
      return (a.fechaLimite || "9999").localeCompare(b.fechaLimite || "9999");
    });
  }, [activos, query, estadoF, prioF, catF]);

  const handleCreate = async (data) => {
    let n;
    if (usingDb) { try { n = (await window.DB.pend.maxN()) + 1; } catch (e) { n = activos.reduce((m, p) => Math.max(m, p.n || 0), 0) + 1; } }
    else { n = activos.reduce((m, p) => Math.max(m, p.n || 0), 0) + 1; }
    let item = { ...data, id: "PEN-" + String(n).padStart(4, "0"), n, ultimaModPor: station, ultimaModFecha: new Date().toISOString(), eliminado: false };
    try { if (usingDb) item = await window.DB.pend.create(item); } catch (e) { console.error(e); flash("Error al guardar"); return; }
    setTareas((p) => [item, ...p]); setModal(null); flash("Pendiente registrado");
  };
  const handleUpdate = async (data) => {
    let updated = { ...data, ultimaModPor: station, ultimaModFecha: new Date().toISOString() };
    try { if (usingDb) updated = await window.DB.pend.update(updated); } catch (e) { console.error(e); flash("Error al actualizar"); return; }
    setTareas((p) => p.map((x) => x.id === data.id ? { ...x, ...updated } : x)); setModal(null); flash("Pendiente actualizado");
  };
  const handleDelete = async (item) => {
    try { if (usingDb) await window.DB.pend.remove(item); } catch (e) { console.error(e); flash("Error al eliminar"); return; }
    setTareas((p) => p.map((x) => x.id === item.id ? { ...x, eliminado: true } : x)); setModal(null); flash("Pendiente eliminado");
  };
  const toggleHecho = (item) => handleUpdate({ ...item, estado: item.estado === "Hecho" ? "Pendiente" : "Hecho" });

  if (loading) return <div className="boot"><div className="boot-inner"><div className="boot-spin" />Cargando pendientes…</div></div>;

  const modals = (
    <>
      {modal?.type === "new" && <PendFormModal mode="new" station={station} usuarios={usuarios} onClose={() => setModal(null)} onSubmit={handleCreate} />}
      {modal?.type === "edit" && <PendFormModal mode="edit" initial={modal.item} station={station} usuarios={usuarios} onClose={() => setModal(null)} onSubmit={handleUpdate} />}
      {modal?.type === "delete" && <PendConfirmDelete item={modal.item} station={station} onClose={() => setModal(null)} onConfirm={handleDelete} />}
      {toast && <div className="toast"><span className="toast-ico"><Ico name="check" size={15} /></span><span>{toast.msg}</span></div>}
    </>
  );

  if (active === "pend-agenda") {
    return (<>
      <PendKpis data={activos} />
      <PendAgenda data={activos} onOpen={(p) => setModal({ type: "edit", item: p })} onToggle={toggleHecho} onNew={() => setModal({ type: "new" })} />
      {modals}
    </>);
  }
  return (<>
    <PendKpis data={activos} />
    <div className="panel">
      <div className="toolbar">
        <div className="toolbar-left"><span className="toolbar-title">Pendientes</span><span className="toolbar-count">{rows.length}</span></div>
        <div className="toolbar-right">
          <div className="seg">
            {["Activas", "Todos", ...ESTADOS_PEND].map((s) => (
              <button key={s} className={"seg-btn" + (estadoF === s ? " is-on" : "")} onClick={() => setEstadoF(s)}>{s}</button>
            ))}
          </div>
          <select className="select" value={prioF} onChange={(e) => setPrioF(e.target.value)}>
            <option value="Todos">Toda prioridad</option>
            {PRIO_PEND.map((p) => <option key={p} value={p}>{p}</option>)}
          </select>
          <select className="select" value={catF} onChange={(e) => setCatF(e.target.value)}>
            <option value="Todos">Toda categoría</option>
            {CATS_PEND.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <div className="toolbar-divider" />
          <button className="btn-primary" onClick={() => setModal({ type: "new" })}><Ico name="plus" size={17} />Nuevo pendiente</button>
        </div>
      </div>
      <PendTable rows={rows} onOpen={(p) => setModal({ type: "edit", item: p })} onToggle={toggleHecho} onDelete={(p) => setModal({ type: "delete", item: p })} />
    </div>
    {modals}
  </>);
}

Object.assign(window, { PendientesModule });
</script>
<script type="text/babel" data-file="objetivos.jsx">
// objetivos.jsx — Saraceni Seguros · Objetivos
// ─────────────────────────────────────────────────────────────────────────────
// Reescrito: antes se cargaba con un modal de campos, igual que un siniestro, y
// se sentía pesado para algo que es una sola frase ("facturar X en agosto").
// Ahora la carga es un CONSTRUCTOR en línea de tres pasos (qué / cuándo /
// cuánto) que arma la frase a la vista, sin modal, y las metas se muestran como
// filas con anillo de avance, edición en el lugar y ritmo del período.
//
// Tipo "facturacion": el avance sale solo de `fact_mensual` (módulo Facturación).
// Tipo "manual": el avance se sube a mano con el stepper de la propia fila.
// ─────────────────────────────────────────────────────────────────────────────

const MES_OBJ = ["", "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const MES_OBJ_CORTO = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const ARS_OBJ = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });

// Atajos de carga: cada uno define qué se mide y con qué unidad.
const OBJ_PRESETS = [
  { k: "fact-mes", label: "Facturación del mes", icon: "doc", tipo: "facturacion", unidad: "$", anual: false },
  { k: "fact-anio", label: "Facturación del año", icon: "target", tipo: "facturacion", unidad: "$", anual: true },
  { k: "polizas", label: "Pólizas nuevas", icon: "folder", tipo: "manual", unidad: "pólizas", anual: false },
  { k: "clientes", label: "Clientes nuevos", icon: "user", tipo: "manual", unidad: "clientes", anual: false },
  { k: "renovaciones", label: "Renovaciones", icon: "refresh", tipo: "manual", unidad: "renovaciones", anual: false },
  { k: "otro", label: "Otro objetivo", icon: "flag", tipo: "manual", unidad: "", anual: false },
];
const presetDe = (k) => OBJ_PRESETS.find((p) => p.k === k) || OBJ_PRESETS[0];

const objNum = (v) => {
  if (v === "" || v == null) return 0;
  const n = Number(String(v).replace(/[$\s.]/g, "").replace(",", "."));
  return isNaN(n) ? 0 : n;
};
function objPeriodo(o) { return o.mes ? `${MES_OBJ[o.mes]} ${o.anio}` : `Año ${o.anio}`; }
function objEsPlata(o) { return !o.unidad || o.unidad === "$"; }
function objFmt(o, v) {
  if (objEsPlata(o)) return ARS_OBJ.format(v || 0);
  return (Math.round((v || 0) * 100) / 100).toLocaleString("es-AR") + (o.unidad ? " " + o.unidad : "");
}
// Avance real: automático desde facturación, o el valor cargado a mano.
function objActual(o, movs) {
  if (o.tipo === "facturacion") {
    return (movs || [])
      .filter((m) => Number(m.anio) === Number(o.anio) && (o.mes ? Number(m.mes) === Number(o.mes) : true))
      .reduce((s, m) => s + (Number(m.total) || 0), 0);
  }
  return Number(o.valorActual) || 0;
}
function objPct(o, movs) {
  const meta = Number(o.meta) || 0;
  if (!meta) return 0;
  return Math.round((objActual(o, movs) / meta) * 1000) / 10;
}
// Cuánto del período ya pasó (para saber si vamos a tiempo). null si no es el período en curso.
function objRitmo(o) {
  const hoy = new Date();
  if (o.mes) {
    if (Number(o.anio) !== hoy.getFullYear() || Number(o.mes) !== hoy.getMonth() + 1) return null;
    return (hoy.getDate() / new Date(o.anio, o.mes, 0).getDate()) * 100;
  }
  if (Number(o.anio) !== hoy.getFullYear()) return null;
  const ini = new Date(hoy.getFullYear(), 0, 1), fin = new Date(hoy.getFullYear() + 1, 0, 1);
  return ((hoy - ini) / (fin - ini)) * 100;
}
// El período ya terminó (sirve para marcar los que quedaron sin cumplir)
function objCerrado(o) {
  const hoy = new Date();
  if (Number(o.anio) < hoy.getFullYear()) return true;
  if (Number(o.anio) > hoy.getFullYear()) return false;
  return !!o.mes && Number(o.mes) < hoy.getMonth() + 1;
}
function objTono(o, movs) {
  const pct = objPct(o, movs);
  if (pct >= 100) return { k: "cumplido", label: "Cumplido", color: "#16A34A", bg: "#E6F4EA", fg: "#15803D" };
  if (objCerrado(o)) return { k: "vencido", label: "Sin cumplir", color: "#DC2626", bg: "#FBE3E3", fg: "#C0241D" };
  const ritmo = objRitmo(o);
  if (ritmo != null && pct < ritmo - 10) return { k: "atrasado", label: "Atrasado", color: "#EA580C", bg: "#FEF3E2", fg: "#B45309" };
  return { k: "curso", label: "En curso", color: "#2563EB", bg: "#E8F0FE", fg: "#1D4ED8" };
}

// ---------- constructor (la carga, en línea y sin modal) ----------
function ObjConstructor({ movs, editando, onCancelar, onGuardar }) {
  const hoy = new Date();
  const inicial = () => {
    if (editando) {
      const pk = editando.tipo === "facturacion" ? (editando.mes ? "fact-mes" : "fact-anio")
        : OBJ_PRESETS.find((p) => p.unidad && p.unidad === editando.unidad && p.tipo === "manual")?.k || "otro";
      return { preset: pk, titulo: editando.titulo || "", mes: editando.mes || "", anio: editando.anio || hoy.getFullYear(), meta: editando.meta || "", unidad: editando.unidad || "", notas: editando.notas || "" };
    }
    return { preset: "fact-mes", titulo: "", mes: hoy.getMonth() + 1, anio: hoy.getFullYear(), meta: "", unidad: "$", notas: "" };
  };
  const [f, setF] = React.useState(inicial);
  React.useEffect(() => { setF(inicial()); }, [editando && editando.id]);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const p = presetDe(f.preset);
  const esPlata = !f.unidad || f.unidad === "$";

  const elegirPreset = (k) => {
    const np = presetDe(k);
    setF((prev) => ({
      ...prev, preset: k, unidad: np.unidad,
      mes: np.anual ? "" : (prev.mes || hoy.getMonth() + 1),
    }));
  };

  // Título automático si no se escribe uno
  const periodoTxt = f.mes ? `${MES_OBJ[f.mes]} ${f.anio}` : `${f.anio}`;
  const tituloAuto = p.k === "fact-mes" ? `Facturación de ${periodoTxt}`
    : p.k === "fact-anio" ? `Facturación ${f.anio}`
    : p.k === "otro" ? "" : `${p.label} · ${periodoTxt}`;
  const titulo = (f.titulo || "").trim() || tituloAuto;

  // Sugerencias de monto: lo que se facturó en el mismo período anterior
  const facturadoDe = (anio, mes) => (movs || [])
    .filter((m) => Number(m.anio) === Number(anio) && (mes ? Number(m.mes) === Number(mes) : true))
    .reduce((s, m) => s + (Number(m.total) || 0), 0);
  const base = React.useMemo(() => {
    if (p.tipo !== "facturacion") return 0;
    if (!f.mes) return facturadoDe(Number(f.anio) - 1, null);
    const ant = Number(f.mes) === 1 ? { a: Number(f.anio) - 1, m: 12 } : { a: Number(f.anio), m: Number(f.mes) - 1 };
    return facturadoDe(ant.a, ant.m);
  }, [movs, f.anio, f.mes, p.tipo]);
  const sugerencias = p.tipo === "facturacion" && base > 0
    ? [{ l: "Igual al período anterior", v: base }, { l: "+10%", v: base * 1.1 }, { l: "+20%", v: base * 1.2 }, { l: "+30%", v: base * 1.3 }]
    : [];
  const sugerenciasManual = p.tipo !== "facturacion" ? [5, 10, 20, 50] : [];

  const metaNum = objNum(f.meta);
  const valido = !!titulo && metaNum > 0 && f.anio;
  const frase = valido
    ? (p.tipo === "facturacion" ? "Facturar " : "Llegar a ") +
      (esPlata ? ARS_OBJ.format(metaNum) : metaNum.toLocaleString("es-AR") + (f.unidad ? " " + f.unidad : "")) +
      (f.mes ? ` en ${MES_OBJ[f.mes]} ${f.anio}` : ` durante ${f.anio}`)
    : "Elegí qué, cuándo y cuánto para armar el objetivo.";

  const anios = [];
  for (let a = hoy.getFullYear() + 1; a >= 2025; a--) anios.push(a);

  return (
    <div className={"obj-const" + (editando ? " editando" : "")}>
      <div className="obj-const-head">
        <span className="obj-const-tag"><Ico name={editando ? "edit" : "plus"} size={15} />{editando ? "Editando objetivo" : "Nuevo objetivo"}</span>
        <button className="btn-ghost sm" onClick={onCancelar}><Ico name="close" size={14} />Cerrar</button>
      </div>

      <div className="obj-paso">
        <span className="obj-paso-n">1</span>
        <div className="obj-paso-body">
          <span className="obj-paso-t">¿Qué querés lograr?</span>
          <div className="obj-chips">
            {OBJ_PRESETS.map((op) => (
              <button key={op.k} className={"obj-chip" + (f.preset === op.k ? " on" : "")} onClick={() => elegirPreset(op.k)}>
                <Ico name={op.icon} size={15} />{op.label}
              </button>
            ))}
          </div>
          <div className="obj-paso-extra">
            <input className="input" value={f.titulo} onChange={(e) => set("titulo", e.target.value)}
              placeholder={tituloAuto ? `Nombre (por defecto: ${tituloAuto})` : "Ponele un nombre al objetivo"} />
            {p.tipo === "manual" && f.preset === "otro" && (
              <input className="input obj-unidad" value={f.unidad} onChange={(e) => set("unidad", e.target.value)}
                placeholder="Unidad: $, pólizas, clientes…" />
            )}
          </div>
        </div>
      </div>

      <div className="obj-paso">
        <span className="obj-paso-n">2</span>
        <div className="obj-paso-body">
          <span className="obj-paso-t">¿Para cuándo?</span>
          <div className="obj-periodo-sel">
            <div className="fact-mes-pills">
              {MES_OBJ_CORTO.map((m, i) => (
                <button key={m} className={"fact-mes-pill" + (Number(f.mes) === i + 1 ? " on" : "")} onClick={() => set("mes", i + 1)}>{m}</button>
              ))}
              <button className={"fact-mes-pill ancho" + (!f.mes ? " on" : "")} onClick={() => set("mes", "")}>Todo el año</button>
            </div>
            <select className="select" value={f.anio} onChange={(e) => set("anio", Number(e.target.value))}>
              {anios.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div className="obj-paso">
        <span className="obj-paso-n">3</span>
        <div className="obj-paso-body">
          <span className="obj-paso-t">¿Cuánto?</span>
          <div className="obj-monto-row">
            <div className="obj-monto">
              {esPlata && <span className="obj-monto-signo">$</span>}
              <input className="input mono obj-monto-input" inputMode="decimal" value={f.meta}
                onChange={(e) => set("meta", e.target.value)} placeholder="0" />
              {!esPlata && f.unidad && <span className="obj-monto-unidad">{f.unidad}</span>}
            </div>
            {sugerencias.map((s) => (
              <button key={s.l} className="obj-sug" onClick={() => set("meta", String(Math.round(s.v)))}>
                <b>{s.l}</b><span className="mono">{ARS_OBJ.format(Math.round(s.v))}</span>
              </button>
            ))}
            {sugerenciasManual.map((n) => (
              <button key={n} className="obj-sug chico" onClick={() => set("meta", String(n))}><b>{n}</b></button>
            ))}
          </div>
          {p.tipo === "facturacion" && (
            <div className="obj-nota-auto"><Ico name="info" size={14} />El avance se calcula solo, sumando lo cargado en Facturación para ese período{base > 0 ? ` (el período anterior cerró en ${ARS_OBJ.format(Math.round(base))})` : ""}.</div>
          )}
        </div>
      </div>

      <div className="obj-const-foot">
        <span className={"obj-frase" + (valido ? " ok" : "")}>{frase}</span>
        <div className="foot-btns">
          <button className="btn-ghost" onClick={onCancelar}>Cancelar</button>
          <button className="btn-primary" disabled={!valido}
            onClick={() => onGuardar({
              ...(editando || {}),
              titulo, tipo: p.tipo, mes: f.mes === "" ? null : Number(f.mes), anio: Number(f.anio),
              meta: metaNum, unidad: f.unidad || "$", notas: f.notas || "",
            })}>
            <Ico name="check" size={16} />{editando ? "Guardar cambios" : "Crear objetivo"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- fila de meta ----------
function ObjFila({ o, movs, onEditar, onGuardarRapido, onEliminar }) {
  const [editMeta, setEditMeta] = React.useState(null);
  const [editAvance, setEditAvance] = React.useState(null);
  const [confirmar, setConfirmar] = React.useState(false);
  const actual = objActual(o, movs);
  const pct = objPct(o, movs);
  const tono = objTono(o, movs);
  const ritmo = objRitmo(o);
  const falta = Math.max(0, (Number(o.meta) || 0) - actual);
  const paso = objEsPlata(o) ? Math.max(1000, Math.round((Number(o.meta) || 0) / 20)) : 1;

  const desvio = ritmo == null ? null : Math.round(pct - ritmo);
  const cuando = o.mes ? `para el día ${new Date().getDate()} del mes` : "para esta altura del año";
  const pie = pct >= 100
    ? "Meta alcanzada" + (actual > (Number(o.meta) || 0) ? ` · ${objFmt(o, actual - (Number(o.meta) || 0))} por encima` : "")
    : ritmo != null
      ? `Falta ${objFmt(o, falta)} · va ${Math.abs(desvio)}% ${desvio >= 0 ? "adelantado" : "atrasado"} ${cuando}`
      : `Falta ${objFmt(o, falta)}`;

  return (
    <div className={"obj-fila " + tono.k}>
      <div className="obj-fila-anillo">
        <ChAnillo pct={pct} color={tono.color} size={74} grosor={9} texto={Math.round(pct) + "%"} />
      </div>
      <div className="obj-fila-body">
        <div className="obj-fila-top">
          <span className="obj-fila-titulo">{o.titulo}</span>
          <span className="obj-fila-chip">{objPeriodo(o)}</span>
          <span className="obj-fila-chip suave">{o.tipo === "facturacion" ? "Automático" : "Manual"}</span>
          <span className="badge" style={{ background: tono.bg, color: tono.fg, fontSize: 11.5 }}>{tono.label}</span>
        </div>

        <div className="obj-fila-nums">
          <span className="obj-fila-actual">{objFmt(o, actual)}</span>
          <span className="obj-fila-de">de</span>
          {editMeta == null ? (
            <button className="obj-fila-meta" title="Clic para cambiar la meta" onClick={() => setEditMeta(String(o.meta || ""))}>
              {objFmt(o, Number(o.meta) || 0)}<Ico name="edit" size={13} />
            </button>
          ) : (
            <span className="obj-inline">
              <input className="input sm mono" autoFocus value={editMeta} inputMode="decimal"
                onChange={(e) => setEditMeta(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { onGuardarRapido({ ...o, meta: objNum(editMeta) }); setEditMeta(null); } if (e.key === "Escape") setEditMeta(null); }} />
              <button className="row-open ok" title="Guardar" onClick={() => { onGuardarRapido({ ...o, meta: objNum(editMeta) }); setEditMeta(null); }}><Ico name="check" size={15} /></button>
              <button className="row-open" title="Cancelar" onClick={() => setEditMeta(null)}><Ico name="close" size={15} /></button>
            </span>
          )}
        </div>

        <div className="obj-fila-barra">
          <span style={{ width: Math.min(100, Math.max(0, pct)) + "%", background: tono.color }} />
          {ritmo != null && pct < 100 && <i className="obj-fila-ritmo" style={{ left: Math.min(100, ritmo) + "%" }} title={`Ritmo esperado: ${Math.round(ritmo)}%`} />}
        </div>

        <div className="obj-fila-pie">
          <span>{pie}</span>
          {o.notas && <span className="obj-fila-nota">· {o.notas}</span>}
        </div>

        {o.tipo === "manual" && (
          <div className="obj-avance">
            <span className="obj-avance-l">Avance</span>
            <button className="obj-step" onClick={() => onGuardarRapido({ ...o, valorActual: Math.max(0, actual - paso) })}>−</button>
            {editAvance == null ? (
              <button className="obj-avance-v mono" title="Clic para escribir el valor" onClick={() => setEditAvance(String(actual))}>{objFmt(o, actual)}</button>
            ) : (
              <span className="obj-inline">
                <input className="input sm mono" autoFocus value={editAvance} inputMode="decimal"
                  onChange={(e) => setEditAvance(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { onGuardarRapido({ ...o, valorActual: objNum(editAvance) }); setEditAvance(null); } if (e.key === "Escape") setEditAvance(null); }} />
                <button className="row-open ok" onClick={() => { onGuardarRapido({ ...o, valorActual: objNum(editAvance) }); setEditAvance(null); }}><Ico name="check" size={15} /></button>
              </span>
            )}
            <button className="obj-step" onClick={() => onGuardarRapido({ ...o, valorActual: actual + paso })}>+</button>
          </div>
        )}
      </div>

      <div className="obj-fila-acciones">
        {confirmar ? (
          <div className="obj-confirm">
            <span>¿Eliminar?</span>
            <button className="btn-danger sm" onClick={() => onEliminar(o)}>Sí</button>
            <button className="btn-ghost sm" onClick={() => setConfirmar(false)}>No</button>
          </div>
        ) : (
          <>
            <button className="row-open" title="Editar el objetivo" onClick={() => onEditar(o)}><Ico name="edit" size={15} /></button>
            <button className="row-open danger" title="Eliminar" onClick={() => setConfirmar(true)}><Ico name="trash" size={15} /></button>
          </>
        )}
      </div>
    </div>
  );
}

// ---------- panel de control ----------
function ObjPanel({ objetivos, movs, anio, onAnio, anios }) {
  const delAnio = objetivos.filter((o) => Number(o.anio) === Number(anio));
  const cumplidos = delAnio.filter((o) => objPct(o, movs) >= 100);
  const atrasados = delAnio.filter((o) => objTono(o, movs).k === "atrasado");
  const vencidos = delAnio.filter((o) => objTono(o, movs).k === "vencido");
  const promedio = delAnio.length
    ? Math.round(delAnio.reduce((s, o) => s + Math.min(100, objPct(o, movs)), 0) / delAnio.length)
    : 0;

  // facturación real del año contra las metas mensuales cargadas
  const metaMes = {};
  delAnio.filter((o) => o.tipo === "facturacion" && o.mes).forEach((o) => {
    metaMes[o.mes] = (metaMes[o.mes] || 0) + (Number(o.meta) || 0);
  });
  const data = MES_OBJ_CORTO.map((m, i) => ({
    label: m,
    valores: [(movs || []).filter((x) => Number(x.anio) === Number(anio) && Number(x.mes) === i + 1).reduce((s, x) => s + (Number(x.total) || 0), 0)],
  }));
  const marcas = MES_OBJ_CORTO.map((_, i) => metaMes[i + 1] || null);
  const hayMetasFact = Object.keys(metaMes).length > 0;

  const orden = [...delAnio].sort((a, b) => objPct(b, movs) - objPct(a, movs));

  return (
    <div className="obj-panel">
      <div className="obj-hero">
        <div className="obj-hero-anillo">
          <ChAnillo pct={promedio} size={132} grosor={14} color={promedio >= 80 ? "#16A34A" : promedio >= 50 ? "#2563EB" : "#EA580C"} />
        </div>
        <div className="obj-hero-txt">
          <span className="obj-hero-k">Avance promedio {anio}</span>
          <h2>{promedio}% de las metas del año</h2>
          <p>{delAnio.length} {delAnio.length === 1 ? "objetivo cargado" : "objetivos cargados"} · {cumplidos.length} cumplidos · {atrasados.length} atrasados · {vencidos.length} sin cumplir</p>
        </div>
        <div className="obj-hero-mini">
          {[
            { l: "Cumplidos", v: cumplidos.length, c: "#16A34A" },
            { l: "En curso", v: Math.max(0, delAnio.length - cumplidos.length - vencidos.length - atrasados.length), c: "#2563EB" },
            { l: "Atrasados", v: atrasados.length, c: "#EA580C" },
            { l: "Sin cumplir", v: vencidos.length, c: "#DC2626" },
          ].map((x) => (
            <div className="obj-hero-mini-item" key={x.l}>
              <span className="obj-hero-mini-v" style={{ color: x.c }}>{x.v}</span>
              <span className="obj-hero-mini-l">{x.l}</span>
            </div>
          ))}
        </div>
        <select className="select obj-hero-anio" value={anio} onChange={(e) => onAnio(Number(e.target.value))}>
          {anios.map((a) => <option key={a} value={a}>{a}</option>)}
        </select>
      </div>

      <section className="est-card">
        <div className="est-card-head">
          <div>
            <h3>Facturación real contra la meta</h3>
            <p>{hayMetasFact ? "la línea punteada es la meta cargada para ese mes" : "todavía no hay metas de facturación por mes en " + anio}</p>
          </div>
        </div>
        <ChBarras data={data} series={[{ nombre: "Facturado", color: CH_COLOR.azul }]}
          marcas={hayMetasFact ? marcas : null} fmtEje={(v) => (v >= 1000000 ? "$" + (v / 1000000).toFixed(1).replace(".", ",") + "M" : v >= 1000 ? "$" + Math.round(v / 1000) + "k" : "$" + v)}
          fmtValor={(v) => ARS_OBJ.format(Math.round(v))} alto={250} />
      </section>

      <section className="est-card">
        <div className="est-card-head"><div><h3>Todas las metas de {anio}</h3><p>ordenadas por avance</p></div></div>
        {orden.length ? (
          <div className="obj-mini-list">
            {orden.map((o) => {
              const t = objTono(o, movs);
              const pct = objPct(o, movs);
              return (
                <div className="obj-mini" key={o.id}>
                  <span className="obj-mini-t">{o.titulo}</span>
                  <span className="obj-mini-p">{objPeriodo(o)}</span>
                  <span className="obj-mini-bar"><span style={{ width: Math.min(100, pct) + "%", background: t.color }} /></span>
                  <span className="obj-mini-pct mono" style={{ color: t.color }}>{Math.round(pct)}%</span>
                  <span className="obj-mini-v mono">{objFmt(o, objActual(o, movs))} / {objFmt(o, Number(o.meta) || 0)}</span>
                </div>
              );
            })}
          </div>
        ) : (
          <div className="ch-vacio">No hay objetivos cargados para {anio}. Creálos en “Metas y seguimiento”.</div>
        )}
      </section>
    </div>
  );
}

// ---------- orquestador ----------
function ObjetivosModule({ active, station, query }) {
  const hoy = new Date();
  const [objetivos, setObjetivos] = React.useState([]);
  const [movs, setMovs] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [usingDb, setUsingDb] = React.useState(false);
  const [anio, setAnio] = React.useState(hoy.getFullYear());
  const [filtro, setFiltro] = React.useState("Todos");
  const [constructor, setConstructor] = React.useState(null); // null | {editando}
  const [toast, setToast] = React.useState(null);
  const tt = React.useRef(null);
  const topRef = React.useRef(null);   // para volver arriba al editar (el scroll lo tiene .content, no window)
  const flash = React.useCallback((msg) => { setToast({ msg, id: Date.now() }); clearTimeout(tt.current); tt.current = setTimeout(() => setToast(null), 2600); }, []);

  React.useEffect(() => {
    let alive = true;
    (async () => {
      if (window.DB && window.DB.configured() && window.DB.obj) {
        try {
          // Los objetivos de facturación se calculan con `fact_mensual`, la misma
          // tabla que usa el módulo de Facturación.
          const [objs, ms] = await Promise.all([
            window.DB.obj.list(),
            window.DB.fact ? window.DB.fact.mensual.list().catch(() => []) : Promise.resolve([]),
          ]);
          if (alive) { setObjetivos(objs); setMovs(ms); setUsingDb(true); }
        } catch (e) { console.error("Objetivos:", e); if (alive) flash("No se pudieron cargar los objetivos"); }
      }
      if (alive) setLoading(false);
    })();
    return () => { alive = false; };
  }, [flash]);

  React.useEffect(() => {
    if (!usingDb || !window.DB.obj.subscribe) return;
    let timer = null, alive = true;
    const refresh = () => { clearTimeout(timer); timer = setTimeout(async () => { try { const items = await window.DB.obj.list(); if (alive) setObjetivos(items); } catch (e) { console.error(e); } }, 400); };
    const unsub = window.DB.obj.subscribe(refresh);
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb]);

  const activos = objetivos.filter((o) => !o.eliminado);
  const anios = React.useMemo(() => {
    const s = new Set(activos.map((o) => Number(o.anio)));
    s.add(hoy.getFullYear());
    return Array.from(s).sort((a, b) => b - a);
  }, [activos]);

  const lista = React.useMemo(() => {
    const q = (query || "").trim().toLowerCase();
    return activos.filter((o) => {
      if (q && !((o.titulo || "") + " " + (o.notas || "")).toLowerCase().includes(q)) return false;
      if (filtro === "Todos") return true;
      const k = objTono(o, movs).k;
      if (filtro === "En curso") return k === "curso" || k === "atrasado";
      if (filtro === "Cumplidos") return k === "cumplido";
      if (filtro === "Atrasados") return k === "atrasado" || k === "vencido";
      return true;
    }).sort((a, b) => (b.anio - a.anio) || ((a.mes || 13) - (b.mes || 13)) || (objPct(b, movs) - objPct(a, movs)));
  }, [activos, query, filtro, movs]);

  const guardar = async (data) => {
    if (data.id) {
      let updated = { ...data, ultimaModPor: station, ultimaModFecha: new Date().toISOString() };
      try { if (usingDb) updated = await window.DB.obj.update(updated); }
      catch (e) { console.error(e); flash("Error al actualizar"); return; }
      setObjetivos((p) => p.map((o) => (o.id === data.id ? { ...o, ...updated } : o)));
      setConstructor(null); flash("Objetivo actualizado");
      return;
    }
    let n;
    if (usingDb) { try { n = (await window.DB.obj.maxN()) + 1; } catch (e) { n = activos.reduce((m, o) => Math.max(m, o.n || 0), 0) + 1; } }
    else { n = activos.reduce((m, o) => Math.max(m, o.n || 0), 0) + 1; }
    let item = { ...data, id: "OBJ-" + String(n).padStart(4, "0"), n, ultimaModPor: station, ultimaModFecha: new Date().toISOString(), eliminado: false };
    try { if (usingDb) item = await window.DB.obj.create(item); }
    catch (e) { console.error(e); flash("Error al guardar"); return; }
    setObjetivos((p) => [item, ...p]); setConstructor(null); flash("Objetivo creado");
  };
  // Guardado rápido desde la propia fila (meta o avance), sin abrir nada
  const guardarRapido = async (data) => {
    let updated = { ...data, ultimaModPor: station, ultimaModFecha: new Date().toISOString() };
    setObjetivos((p) => p.map((o) => (o.id === data.id ? { ...o, ...updated } : o)));
    try { if (usingDb) updated = await window.DB.obj.update(updated); }
    catch (e) { console.error(e); flash("No se pudo guardar el cambio"); return; }
    setObjetivos((p) => p.map((o) => (o.id === data.id ? { ...o, ...updated } : o)));
  };
  const eliminar = async (item) => {
    try { if (usingDb) await window.DB.obj.remove(item); }
    catch (e) { console.error(e); flash("Error al eliminar"); return; }
    setObjetivos((p) => p.map((o) => (o.id === item.id ? { ...o, eliminado: true } : o)));
    flash("Objetivo eliminado");
  };

  if (loading) return <div className="boot"><div className="boot-inner"><div className="boot-spin" />Cargando objetivos…</div></div>;

  if (active === "obj-panel") {
    return (<>
      <ObjPanel objetivos={activos} movs={movs} anio={anio} onAnio={setAnio} anios={anios} />
      {toast && <div className="toast"><span className="toast-ico"><Ico name="check" size={15} /></span><span>{toast.msg}</span></div>}
    </>);
  }

  return (<>
    <div className="obj-metas" ref={topRef}>
      <div className="obj-metas-head">
        <div className="obj-metas-titulo">
          <h2>Metas y seguimiento</h2>
          <span>{lista.length} {lista.length === 1 ? "objetivo" : "objetivos"}</span>
        </div>
        <div className="obj-metas-tools">
          <div className="seg">
            {["Todos", "En curso", "Cumplidos", "Atrasados"].map((s) => (
              <button key={s} className={"seg-btn" + (filtro === s ? " is-on" : "")} onClick={() => setFiltro(s)}>{s}</button>
            ))}
          </div>
          <button className="btn-primary" disabled={!!constructor && !constructor.editando}
            onClick={() => setConstructor({ editando: null })}><Ico name="plus" size={17} />Nuevo objetivo</button>
        </div>
      </div>

      {constructor && (
        <ObjConstructor movs={movs} editando={constructor.editando}
          onCancelar={() => setConstructor(null)} onGuardar={guardar} />
      )}

      {lista.length ? (
        <div className="obj-lista">
          {lista.map((o) => (
            <ObjFila key={o.id} o={o} movs={movs}
              onEditar={(x) => { setConstructor({ editando: x }); if (topRef.current) topRef.current.scrollIntoView({ behavior: "smooth", block: "start" }); }}
              onGuardarRapido={guardarRapido} onEliminar={eliminar} />
          ))}
        </div>
      ) : (
        <div className="empty">
          <div className="empty-ico"><Ico name="target" size={26} /></div>
          <div className="empty-title">{activos.length ? "Ningún objetivo con ese filtro" : "Todavía no hay objetivos"}</div>
          <div className="empty-sub">{activos.length ? "Probá con otro filtro o limpiá la búsqueda." : "Tocá “Nuevo objetivo”: elegís qué, cuándo y cuánto, y listo."}</div>
        </div>
      )}
    </div>
    {toast && <div className="toast"><span className="toast-ico"><Ico name="check" size={15} /></span><span>{toast.msg}</span></div>}
  </>);
}

Object.assign(window, { ObjetivosModule, ObjPanel, ObjConstructor, ObjFila, objActual, objPct, objPeriodo });
</script>
<script type="text/babel" data-file="calendar.jsx">
// calendar.jsx — integración con Google Calendar (sin backend)
// Estrategia: (1) enlaces "Agendar en Google Calendar" (template URL) y
// (2) exportación .ics con recordatorios (VALARM) importable a cualquier calendario.

function _icsDate(iso) { return (iso || "").replaceAll("-", ""); }
function _addDaysISO(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function _escICS(s) {
  return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}

// Texto descriptivo común para el evento
function _eventTitle(item) { return ` ·  — ${item.gestionAR || "Gestión"}`; }
function _eventDetails(item) {
  const lines = [
    `Gestión a realizar: ${item.gestionAR || "—"}`,
    `Cliente: ${item.cliente}`,
    `Compañía: ${ciaLabel(item.cia)}`,
    `Ramo / Hecho: ${RAMO_LABEL[item.ramo] || item.ramo} · ${HECHO_LABEL[item.hecho] || item.hecho}`,
    `N° siniestro: ${item.nroSiniestro}`,
    `N° póliza: ${item.poliza}`,
    item.gestor ? `Gestor: ${item.gestor}${item.gestorEmail ? " <" + item.gestorEmail + ">" : ""}` : "",
    item.gestionReal ? `Última gestión: ${item.gestionReal}` : "",
    item.obs ? `Obs: ${item.obs}` : "",
    item.ticket ? `Ticket: ${item.ticket}` : "",
    "",
    "— Generado por el Portal de gestiones de " + MARCA.nombreCompleto,
  ];
  return lines.filter((l) => l !== "").join("\n");
}

// (1) Google Calendar "quick add" URL — evento de 10 a 11 hs el día de la fecha límite
function gcalUrl(item) {
  if (!item.fechaLimite) return null;
  const d = _icsDate(item.fechaLimite);
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: _eventTitle(item),
    dates: `${d}T100000/${d}T110000`,
    details: _eventDetails(item),
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// (2) Archivo .ics con VALARM (recordatorio leadDays antes)
function buildICS(items, leadDays = 1) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const trigger = leadDays > 0 ? `-P${leadDays}D` : "PT0S";
  const out = [
    "BEGIN:VCALENDAR", "VERSION:2.0",
    "PRODID:-//" + MARCA.nombre + "//Portal Siniestros//ES",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "X-WR-CALNAME:Gestiones " + MARCA.nombre,
  ];
  items.forEach((item) => {
    if (!item.fechaLimite) return;
    const start = _icsDate(item.fechaLimite);
    out.push(
      "BEGIN:VEVENT",
      `UID:${item.id}-${start}@portal`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${start}T100000`,
      `DTEND:${start}T110000`,
      `SUMMARY:${_escICS(_eventTitle(item))}`,
      `DESCRIPTION:${_escICS(_eventDetails(item))}`,
      "BEGIN:VALARM",
      `TRIGGER:${trigger}`,
      "ACTION:DISPLAY",
      `DESCRIPTION:${_escICS("Recordatorio: " + _eventTitle(item))}`,
      "END:VALARM",
      "END:VEVENT",
    );
  });
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}

function downloadICS(filename, text) {
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- Sync modal ----------
const LEAD_OPTS = [
  { key: 2, label: "2 días antes" },
  { key: 1, label: "1 día antes" },
  { key: 0, label: "El mismo día" },
];

function CalendarSync({ data, onClose, onAgendar }) {
  const pendientes = data
    .filter((d) => d.estado === "Abierto" && d.fechaLimite)
    .sort((a, b) => daysUntil(a.fechaLimite) - daysUntil(b.fechaLimite));
  const [lead, setLead] = React.useState(1);

  const exportAll = () => {
    downloadICS("gestiones-" + MARCA.nombre.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".ics", buildICS(pendientes, lead));
    onAgendar && onAgendar(pendientes.map((d) => d.id));
  };
  const exportOne = (item) => {
    downloadICS(`gestion-${item.id}.ics`, buildICS([item], lead));
    onAgendar && onAgendar([item.id]);
  };
  const openGcal = (item) => {
    window.open(gcalUrl(item), "_blank", "noopener");
    onAgendar && onAgendar([item.id]);
  };

  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <div className="modal modal-wide" onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div className="sync-head">
            <span className="sync-gcal"><Ico name="agenda" size={20} /></span>
            <div>
              <h2>Sincronizar con Google Calendar</h2>
              <p>Agendá las gestiones pendientes con recordatorio automático</p>
            </div>
          </div>
          <button className="btn-ghost tb-icon" onClick={onClose}><Ico name="close" size={18} /></button>
        </div>

        <div className="modal-body">
          <div className="sync-bar">
            <div className="sync-reminder">
              <span className="field-label">Recordatorio</span>
              <div className="seg">
                {LEAD_OPTS.map((o) => (
                  <button key={o.key} className={"seg-btn" + (lead === o.key ? " is-on" : "")} onClick={() => setLead(o.key)}>{o.label}</button>
                ))}
              </div>
            </div>
            <button className="btn-primary" onClick={exportAll} disabled={!pendientes.length}>
              <Ico name="download" size={16} />Descargar agenda (.ics) · {pendientes.length}
            </button>
          </div>

          <div className="sync-note">
            <Ico name="info" size={15} />
            <span>El archivo <b>.ics</b> se importa una vez en Google Calendar (Configuración → Importar) y entra cada gestión con su recordatorio. O usá <b>Agendar</b> en cada fila para abrir el evento ya cargado en Google Calendar.</span>
          </div>

          <div className="sync-list">
            {pendientes.map((d) => (
              <div className="sync-row" key={d.id}>
                <span className={"sync-rail ag-rail-" + urgenciaDe(d)} />
                <div className="sync-row-main">
                  <div className="sync-row-top">
                    <span className="sync-client">{d.cliente}</span>
                    <UrgBadge item={d} />
                    {d.enCalendario && <span className="sync-done"><Ico name="check" size={12} />Agendado</span>}
                  </div>
                  <div className="sync-gestion">{d.gestionAR || "—"}</div>
                </div>
                <div className="sync-row-date mono">{fmtDateShort(d.fechaLimite)}</div>
                <div className="sync-row-actions">
                  <button className="btn-ghost sm" onClick={() => exportOne(d)} title="Descargar .ics"><Ico name="download" size={14} /></button>
                  <button className="btn-gcal" onClick={() => openGcal(d)}><Ico name="agenda" size={14} />Agendar</button>
                </div>
              </div>
            ))}
            {!pendientes.length && (
              <div className="empty"><div className="empty-ico"><Ico name="check" size={26} /></div>
                <div className="empty-title">No hay gestiones con fecha límite</div>
                <div className="empty-sub">Cargá una fecha límite de respuesta para poder agendarla.</div></div>
            )}
          </div>
        </div>

        <div className="modal-foot">
          <span className="foot-note"><Ico name="shield" size={14} /> No requiere conexión ni contraseñas de Google</span>
          <button className="btn-ghost" onClick={onClose}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { gcalUrl, buildICS, downloadICS, CalendarSync });
</script>
<script type="text/babel" data-file="app.jsx">
// app.jsx — Saraceni Seguros · Portal de Siniestros (modelo real + Supabase)

function App() {
  const [station, setStation] = React.useState(STATIONS[0]);
  const [siniestros, setSiniestros] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [usingDb, setUsingDb] = React.useState(false);
  const [session, setSession] = React.useState(null);
  const [authChecked, setAuthChecked] = React.useState(false);
  const [query, setQuery] = React.useState("");
  const [estadoFilter, setEstadoFilter] = React.useState("Todos");
  const [ramoFilter, setRamoFilter] = React.useState("Todos");
  const [ciaFilter, setCiaFilter] = React.useState("Todos");
  const [selectedId, setSelectedId] = React.useState(null);
  const [detailId, setDetailId] = React.useState(null);
  const [solicitudes, setSolicitudes] = React.useState([]);
  const [perfil, setPerfil] = React.useState(null);           // rol y estado del usuario logueado
  const [perfilChecked, setPerfilChecked] = React.useState(false);
  const [perfiles, setPerfiles] = React.useState([]);         // usuarios del portal (para asignar / administrar)
  const [cotNuevas, setCotNuevas] = React.useState(0);        // cotizaciones sin responder (badge del menú)
  const [notifs, setNotifs] = React.useState([]);
  const [modal, setModal] = React.useState(null);
  const [active, setActive] = React.useState("dashboard");
  const [navOpen, setNavOpen] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const toastTimer = React.useRef(null);

  const flash = React.useCallback((msg, err) => {
    setToast({ msg, err: !!err, id: Date.now() });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), err ? 4000 : 2600);
  }, []);

  // ---- sesión: ¿hay alguien logueado? ----
  React.useEffect(() => {
    if (!window.DB || !window.DB.configured()) { setAuthChecked(true); return; }
    let alive = true;
    // Solo cambia la sesión si cambia el usuario (login/logout).
    // El refresco de token (mismo usuario, p.ej. al volver de otra pestaña) se ignora
    // para no recargar y no desmontar un formulario abierto.
    const uid = (s) => (s && s.user ? s.user.id : null);
    (async () => {
      try { const s = await window.DB.auth.session(); if (alive) setSession((prev) => (uid(prev) === uid(s) ? prev : s)); }
      catch (e) { console.error("Auth:", e); }
      if (alive) setAuthChecked(true);
    })();
    const unsub = window.DB.auth.onChange((s) => { if (alive) setSession((prev) => (uid(prev) === uid(s) ? prev : s)); });
    return () => { alive = false; if (unsub) unsub(); };
  }, []);

  // ---- perfil (rol organizador/empleado + estado de aprobación) ----
  React.useEffect(() => {
    const configured = window.DB && window.DB.configured();
    if (!configured || !session) { setPerfil(null); setPerfilChecked(true); return; }
    let alive = true;
    setPerfilChecked(false);
    (async () => {
      try { const p = await window.DB.perfiles.me(); if (alive) setPerfil(p); }
      catch (e) { console.error("Perfil:", e); }
      if (alive) setPerfilChecked(true);
    })();
    return () => { alive = false; };
  }, [session]);

  // ---- carga de datos: solo con sesión (o modo demo sin Supabase) ----
  React.useEffect(() => {
    const configured = window.DB && window.DB.configured();
    if (configured && (!session || !perfil || perfil.estado !== "activo")) {
      // sin login o cuenta sin aprobar: limpiamos y esperamos
      setSiniestros([]); setUsingDb(false); setLoading(false);
      return;
    }
    let alive = true;
    (async () => {
      setLoading(true);
      if (configured) {
        try {
          const items = await window.DB.list();
          if (!alive) return;
          setSiniestros(items.length ? items : buildSeed());
          setUsingDb(true);
        } catch (e) {
          console.error("Supabase:", e);
          if (!alive) return;
          setSiniestros(buildSeed());
          setUsingDb(false);
          flash("No se pudo conectar a Supabase — modo demo", true);
        }
      } else {
        setSiniestros(buildSeed());
        setUsingDb(false);
        flash("Modo demo · cargá tus claves de Supabase para guardar cambios");
      }
      if (alive) setLoading(false);
    })();
    return () => { alive = false; };
  }, [session, perfil, flash]);

  // ---- tiempo real: refresca cuando otro puesto carga/edita/elimina ----
  React.useEffect(() => {
    if (!usingDb || !window.DB || !window.DB.subscribe) return;
    let timer = null;
    let alive = true;
    const refresh = () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        try {
          const items = await window.DB.list();
          if (alive && items.length) setSiniestros(items);
        } catch (e) { console.error("Realtime refresh:", e); }
      }, 400);
    };
    const unsub = window.DB.subscribe(refresh);
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb]);

  // ---- solicitudes públicas (denuncias online de asegurados) ----
  React.useEffect(() => {
    if (!usingDb || !window.DB.sol) return;
    let alive = true, timer = null;
    const load = async () => {
      try { const items = await window.DB.sol.list(); if (alive) setSolicitudes(items); }
      catch (e) { console.error("Solicitudes:", e); }
    };
    load();
    const unsub = window.DB.sol.subscribe((payload) => {
      if (payload && payload.eventType === "INSERT") flash("Nueva solicitud de siniestro recibida — mirá Solicitudes recibidas");
      clearTimeout(timer); timer = setTimeout(load, 400);
    });
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb, flash]);

  // ---- cotizaciones sin responder (solo el contador del menú Comercial) ----
  React.useEffect(() => {
    if (!usingDb || !window.DB.cot) return;
    let alive = true, timer = null;
    const load = async () => {
      try {
        const items = await window.DB.cot.list();
        if (alive) setCotNuevas(items.filter((c) => c.estado === "nueva").length);
      } catch (e) { console.error("Cotizaciones:", e); }
    };
    load();
    const unsub = window.DB.cot.subscribe((payload) => {
      if (payload && payload.eventType === "INSERT") flash("Nuevo pedido de cotización — mirá Comercial");
      clearTimeout(timer); timer = setTimeout(load, 400);
    });
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb, flash]);

  // ---- usuarios del portal (lista para asignar + administración) ----
  React.useEffect(() => {
    if (!usingDb || !window.DB.perfiles) return;
    let alive = true, timer = null;
    const load = async () => {
      try { const ps = await window.DB.perfiles.list(); if (alive) setPerfiles(ps); }
      catch (e) { console.error("Perfiles:", e); }
    };
    load();
    const unsub = window.DB.perfiles.subscribe(() => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        load();
        // si me cambiaron el rol o el estado, reflejarlo sin recargar la página
        try {
          const p = await window.DB.perfiles.me();
          if (alive) setPerfil((prev) => (prev && p && prev.rol === p.rol && prev.estado === p.estado && prev.nombre === p.nombre ? prev : p));
        } catch (e) { /* noop */ }
      }, 300);
    });
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb]);

  // ---- notificaciones in-app (campana) ----
  React.useEffect(() => {
    if (!usingDb || !window.DB.notif || !session) return;
    let alive = true, timer = null;
    const load = async () => {
      try { const ns = await window.DB.notif.list(); if (alive) setNotifs(ns); }
      catch (e) { console.error("Notif:", e); }
    };
    load();
    const unsub = window.DB.notif.subscribe(session.user.id, (p) => {
      if (p && p.new && p.new.titulo) flash("🔔 " + p.new.titulo);
      clearTimeout(timer); timer = setTimeout(load, 300);
    });
    return () => { alive = false; clearTimeout(timer); if (unsub) unsub(); };
  }, [usingDb, session, flash]);

  const activos = siniestros.filter((s) => !s.eliminado);
  const abiertos = activos.filter((s) => s.estado === "Abierto");
  const porVencer = abiertos.filter((s) => ["vencido", "hoy", "proximo"].includes(urgenciaDe(s))).length;

  const rows = React.useMemo(() => {
    const q = query.trim().toLowerCase();
    return activos.filter((s) => {
      if (estadoFilter !== "Todos" && s.estado !== estadoFilter) return false;
      if (ramoFilter !== "Todos" && s.ramo !== ramoFilter) return false;
      if (ciaFilter !== "Todos" && s.cia !== ciaFilter) return false;
      if (q) {
        const hay = [s.cliente, s.poliza, s.nroSiniestro, s.id, s.cia, s.gestor, s.gestionAR, s.dominio, s.referencia].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;

    }).sort((a, b) => {
      // abiertos primero, por fecha límite; terminados al final por última mod
      if (a.estado !== b.estado) return a.estado === "Abierto" ? -1 : 1;
      if (a.estado === "Abierto") {
        const da = daysUntil(a.fechaLimite), db = daysUntil(b.fechaLimite);

  }, [activos, query, estadoFilter, ramoFilter, ciaFilter]);

  const agendaData = React.useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return activos;
    return activos.filter((s) => [s.cliente, s.gestor, s.gestionAR, s.cia, s.dominio, s.referencia].join(" ").toLowerCase().includes(q));
  }, [activos, query]);

  const solNuevas = solicitudes.filter((s) => s.estado === "nueva").length;

  // Cantidad de siniestros abiertos por cliente (para el chip ×N)
  const clientesMulti = React.useMemo(() => {
    const m = {};
    abiertos.forEach((s) => { m[s.cliente] = (m[s.cliente] || 0) + 1; });
    return m;
  }, [abiertos]);

  const selected = activos.find((s) => s.id === selectedId) || null;
  const userEmail = session && session.user ? session.user.email : null;
  const nombreDe = (email) => {
    const p = (email || "").split("@")[0].replace(/[._-]+/g, " ").trim();
    return p ? p.replace(/\b\w/g, (c) => c.toUpperCase()) : email;
  };
  const quien = (perfil && perfil.nombre) || (userEmail ? nombreDe(userEmail) : station);
  const rol = window.DB && window.DB.configured() ? (perfil ? perfil.rol : "empleado") : "organizador";
  const usuariosActivos = perfiles.filter((p) => p.estado === "activo");
  const usuariosPend = perfiles.filter((p) => p.estado === "pendiente").length;

  const handleCreate = async (data) => {
  // Aviso si ya existe un siniestro activo con el mismo número
  const nro = (data.nroSiniestro || "").trim();
  const dup = nro && activos.find((s) => (s.nroSiniestro || "").trim() === nro);
  if (dup && !window.confirm(`Ya existe un siniestro con el N° ${nro} (${dup.cliente}). ¿Registrarlo igual?`)) return;
  let n;
  if (usingDb) {
    try { n = (await window.DB.maxN()) + 1; }
    catch (e) { console.error(e); n = siniestros.reduce((m, s) => Math.max(m, s.n || 0), 0) + 1; }
  } else {
    n = siniestros.reduce((m, s) => Math.max(m, s.n || 0), 0) + 1;
  }
  let item = { ...data, id: sinId(n), n, ultimaModPor: quien, ultimaModFecha: nowIso(), eliminado: false };
  if (usingDb) {
    try { item = await window.DB.create(item); }
    catch (e) { console.error(e); flash("Error al guardar en Supabase", true); return; }
  }
  // Si vino de una solicitud pública, marcarla como procesada
  if (modal && modal.solicitudId && usingDb && window.DB.sol) {
    try {
      await window.DB.sol.update({ _dbId: modal.solicitudId, estado: "procesada", siniestroCodigo: item.id, procesadaPor: quien });
      setSolicitudes((p) => p.map((x) => x._dbId === modal.solicitudId ? { ...x, estado: "procesada", siniestroCodigo: item.id } : x));
    } catch (e) { console.error(e); }
  }
  setSiniestros((p) => [item, ...p]);
  setModal(null);
  flash(`Siniestro ${data.nroSiniestro} registrado`);
};
  // ---- convertir / gestionar solicitudes públicas ----
  const convertirSolicitud = (s) => {
    const up = (t) => (t || "").toUpperCase();
    const ciaMap = [["MERCANTIL", "LMA"], ["PROVINCIA", "PROVINCIA"], ["ALLIANZ", "ALLIANZ"], ["SANCOR", "SANCOR"], ["FEDERA", "FEDERACION"], ["CRISTOBAL", "SAN CRISTOBAL"], ["CRISTÓBAL", "SAN CRISTOBAL"], ["ZURICH", "ZURICH"]];
    let cia = null; const cs = up(s.cia);
    for (const [k, v] of ciaMap) { if (cs.includes(k)) { cia = v; break; } }
    const lineas = [];
    if (s.relato) { lineas.push(s.relato); lineas.push(""); }
    lineas.push(`— Denuncia web ${s.id} (ref ${s.ref})`);
    const lugar = [s.ubicacion, s.localidad].filter(Boolean).join(", ");
    if (s.horaHecho) lineas.push("Hora del hecho: " + s.horaHecho);
    if (lugar) lineas.push("Lugar: " + lugar);
    if (s.lesionados) lineas.push(s.lesionados === "SI" ? "⚠ HAY LESIONADOS" : "Sin lesionados");
    const contactoAseg = [
      s.telefono ? "Tel: " + s.telefono : null,
      s.email ? "Email: " + s.email : null,
      s.dniCuit ? "DNI/CUIT: " + s.dniCuit : null,
      !cia && s.cia ? "Cía declarada: " + s.cia : null,
    ].filter(Boolean).join(" · ");
    if (contactoAseg) lineas.push("Asegurado: " + contactoAseg);
    const terc = [
      s.terceroNombre || null,
      s.terceroCelular ? "Cel " + s.terceroCelular : null,
      s.terceroDominio ? "Dominio " + s.terceroDominio : null,
      s.terceroCia ? "Cía " + s.terceroCia : null,
      s.terceroPoliza ? "Póliza " + s.terceroPoliza : null,
      s.terceroDni ? "DNI/CUIT " + s.terceroDni : null,
    ].filter(Boolean).join(" · ");
    if (terc) { lineas.push(""); lineas.push("TERCERO: " + terc); }
    const prefill = {
      cliente: up(s.nombre), dominio: up(s.dominio), poliza: s.poliza || "",
      fechaOcurrido: s.fechaHecho || "", fechaDenuncia: new Date().toISOString().slice(0, 10),
      obs: lineas.join("\n"),
      adjuntos: (s.adjuntos || []).map((a) => ({ ...a, bucket: "solicitudes" })),
      referencia: "Denuncia web",
      ...(cia ? { cia } : {}),
      ...(s.ramo ? { ramo: s.ramo } : {}),
      // "qué pasó" del formulario público se traduce al hecho que usa el portal
      ...(s.tipoSiniestro && TIPO_SOL_HECHO[s.tipoSiniestro] ? { hecho: TIPO_SOL_HECHO[s.tipoSiniestro] } : {}),
    };
    setModal({ type: "new", prefill, solicitudId: s._dbId });
  };
  const descartarSolicitud = async (s) => {
    if (!window.confirm(`¿Descartar la solicitud de ${s.nombre}?`)) return;
    try {
      await window.DB.sol.update({ _dbId: s._dbId, estado: "descartada", procesadaPor: quien });
      setSolicitudes((p) => p.map((x) => x._dbId === s._dbId ? { ...x, estado: "descartada" } : x));
      flash("Solicitud descartada");
    } catch (e) { console.error(e); flash("Error al descartar", true); }
  };
  const reabrirSolicitud = async (s) => {
    try {
      await window.DB.sol.update({ _dbId: s._dbId, estado: "nueva", procesadaPor: quien });
      setSolicitudes((p) => p.map((x) => x._dbId === s._dbId ? { ...x, estado: "nueva" } : x));
      flash("Solicitud reabierta");
    } catch (e) { console.error(e); flash("Error al reabrir", true); }
  };
  const handleUpdate = async (data) => {
    let updated = { ...data, ultimaModPor: quien, ultimaModFecha: nowIso() };
    if (usingDb) {
      try { updated = await window.DB.update(updated); }
      catch (e) { console.error(e); flash("Error al actualizar en Supabase", true); return; }
    }
    setSiniestros((p) => p.map((s) => s.id === data.id ? { ...s, ...updated } : s));
    setModal(null);
    flash(`Siniestro ${data.nroSiniestro} actualizado`);
  };
  // Acciones rápidas desde la pantalla de detalle
  const terminarSiniestro = (item) => handleUpdate({ ...item, estado: "Terminado" });
  const agregarGestionRapida = (item, entry) => {
    const gs = [...(item.gestiones || []), { ...entry, pc: quien }]
      .sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
    handleUpdate({ ...item, gestiones: gs, gestionReal: gs[gs.length - 1].texto });
  };
  const handleDelete = async (item) => {
    if (usingDb) {
      try { await window.DB.remove(item); }
      catch (e) { console.error(e); flash("Error al eliminar en Supabase", true); return; }
    }
    setSiniestros((p) => p.map((s) => s.id === item.id ? { ...s, eliminado: true } : s));
    if (selectedId === item.id) setSelectedId(null);
    if (detailId === item.id) setDetailId(null);
    setModal(null);
    flash(`Siniestro ${item.nroSiniestro} dado de baja`);
  };

  const openEdit = (item) => setModal({ type: "edit", item });
  const openDetail = (id) => { const it = activos.find((s) => s.id === id); if (it) setDetailId(id); };
  const askDelete = (item) => setModal({ type: "delete", item });
  const detailItem = activos.find((s) => s.id === detailId) || null;

  // ---- Google Calendar ----
  const marcarAgendado = (ids) => {
    const set = new Set(ids);
    setSiniestros((p) => p.map((s) => set.has(s.id) ? { ...s, enCalendario: true } : s));
    if (usingDb) {
      siniestros.filter((s) => set.has(s.id) && !s.enCalendario).forEach((s) => {
        window.DB.update({ ...s, enCalendario: true }).catch((e) => console.error(e));
      });
    }
  };
  const agendarGcal = (item) => {
    const url = gcalUrl(item);
    if (url) window.open(url, "_blank", "noopener");
    marcarAgendado([item.id]);
    flash(`Evento de ${item.cliente} abierto en Google Calendar`);
  };
  const descargarIcs = (item) => {
    downloadICS(`gestion-${item.id}.ics`, buildICS([item], 1));
    marcarAgendado([item.id]);
    flash(`Archivo .ics de ${item.cliente} descargado`);
  };

  const switchStation = () => {
    const next = station === STATIONS[0] ? STATIONS[1] : STATIONS[0];
    setStation(next);
    flash(`Puesto activo: ${next}`);
  };

  const configured = !!(window.DB && window.DB.configured());
  const isSiniestros = SINIESTROS_KEYS.includes(active);

  // Control de acceso por rol: un empleado nunca entra a los módulos de organizador
  React.useEffect(() => {
    if (rol !== "organizador" && ORG_ONLY_KEYS.includes(active)) setActive("dashboard");
  }, [rol, active]);

  // ---- notificaciones: abrir / marcar leídas ----
  const abrirNotif = (n) => {
    if (!n.leida) {
      window.DB.notif.markRead(n._dbId);
      setNotifs((p) => p.map((x) => (x._dbId === n._dbId ? { ...x, leida: true } : x)));
    }
    if (n.modulo && (rol === "organizador" || !ORG_ONLY_KEYS.includes(n.modulo))) {
      setActive(n.modulo); setDetailId(null);
    }
  };
  const marcarTodasNotifs = () => {
    window.DB.notif.markAll();
    setNotifs((p) => p.map((x) => ({ ...x, leida: true })));
  };
  // ---- administración de usuarios (solo organizador) ----
  const actualizarUsuario = async (id, patch) => {
    try {
      const u = await window.DB.perfiles.update(id, patch);
      setPerfiles((p) => p.map((x) => (x.id === id ? u : x)));
      flash(patch.estado === "activo" ? `Acceso habilitado para ${u.nombre || u.email}` : `Usuario ${u.nombre || u.email} actualizado`);
    } catch (e) { console.error(e); flash("No se pudo actualizar el usuario", true); }
  };
  const logout = async () => {
    setModal(null); setDetailId(null); setSelectedId(null);
    try { await window.DB.auth.signOut(); } catch (e) { console.error(e); }
    setSession(null); setPerfil(null); setPerfiles([]); setNotifs([]);
  };

  // verificando sesión / perfil
  if (configured && (!authChecked || (session && !perfilChecked))) {
    return (
      <div className="boot"><div className="boot-inner"><div className="boot-spin" /></div></div>
    );
  }
  // sin login → pantalla de acceso
  if (configured && !session) {
    return <LoginScreen onSignIn={(email, password) => window.DB.auth.signIn(email, password)} />;
  }
  // logueado pero sin aprobar (o suspendido) → sala de espera
  if (configured && session && (!perfil || perfil.estado !== "activo")) {
    return <PendingScreen perfil={perfil} email={userEmail} onLogout={logout}
      onRefresh={async () => { try { const p = await window.DB.perfiles.me(); setPerfil(p); } catch (e) { console.error(e); } }} />;
  }
  // cargando datos
  if (loading) {
    return (
      <div className="boot"><div className="boot-inner"><div className="boot-spin" />Cargando portal…</div></div>
    );
  }

  return (
    <div className="app">
      <Sidebar active={active} onNav={(k) => { setActive(k); setDetailId(null); setNavOpen(false); }} station={quien} rol={rol}
        counts={{ abiertos: abiertos.length, porVencer, solicitudes: solNuevas, usuariosPend, cotNuevas }} open={navOpen} />
      {navOpen && <div className="sb-scrim" onClick={() => setNavOpen(false)} />}

      <main className="main">
        <Topbar active={active} query={query} onQuery={setQuery} station={quien}
          onSwitchStation={switchStation} onNew={() => setModal({ type: "new" })}
          onOpenSync={() => setModal({ type: "sync" })} onLogout={configured ? logout : undefined}
          onChangePass={configured && session ? () => setModal({ type: "pass" }) : undefined}
          onMenu={() => setNavOpen(true)} isSiniestros={isSiniestros}
          notifs={configured && session ? notifs : null} onOpenNotif={abrirNotif} onMarkAllNotifs={marcarTodasNotifs} />

        {!isSiniestros ? (
          <div className="content">
            {ADMIN_KEYS.includes(active) && rol === "organizador"
              ? <UsuariosView perfiles={perfiles} me={perfil} onUpdate={actualizarUsuario} />
              : FACTURACION_KEYS.includes(active)
              ? <FacturacionModule active={active} station={quien} query={query} onNav={(k) => { setActive(k); setDetailId(null); }} />
              : COMERCIAL_KEYS.includes(active)
              ? <ComercialModule active={active} station={quien} query={query} />
              : RENOVACION_KEYS.includes(active)
              ? <RenovacionesModule active={active} station={quien} query={query} />
              : PENDIENTES_KEYS.includes(active)
              ? <PendientesModule active={active} station={quien} query={query} usuarios={usuariosActivos} />
              : OBJETIVOS_KEYS.includes(active)
              ? <ObjetivosModule active={active} station={quien} query={query} />
              : <ModuleScreen info={NAV_LOOKUP[active]} />}
          </div>
        ) : detailItem ? (
          <div className="content">
            <DetailScreen item={detailItem} onBack={() => setDetailId(null)}
              onEdit={openEdit} onDelete={askDelete} onGcal={agendarGcal} onIcs={descargarIcs}
              onTerminar={terminarSiniestro} onQuickGestion={agregarGestionRapida} />
          </div>
        ) : active === "solicitudes" ? (
          <div className="content">
            <SolicitudesView solicitudes={solicitudes} onConvertir={convertirSolicitud}
              onDescartar={descartarSolicitud} onReabrir={reabrirSolicitud} />
          </div>
        ) : active === "sin-estadisticas" ? (
          <div className="content">
            <EstadisticasSiniestros data={activos} />
          </div>
        ) : active === "agenda" ? (
          <div className="content">
            <Agenda data={agendaData} onOpen={openDetail} onSync={() => setModal({ type: "sync" })} onGcal={agendarGcal} />
          </div>
        ) : (
          <div className="content">
            {active === "dashboard" && <Kpis data={activos} />}
            <div className="panel">
              <Toolbar
                title={active === "siniestros" ? "Todos los siniestros" : "Siniestros"}
                count={rows.length}
                estadoFilter={estadoFilter} onEstado={setEstadoFilter}
                ramoFilter={ramoFilter} onRamo={setRamoFilter}
                ciaFilter={ciaFilter} onCia={setCiaFilter}
                selected={selected}
                onEdit={() => selected && openEdit(selected)}
                onDelete={() => selected && askDelete(selected)} />
              <ClaimsTable rows={rows} selectedId={selectedId} onSelect={setSelectedId} onOpen={openDetail}
                multi={clientesMulti} onClientFilter={(cliente) => { setQuery(cliente); setEstadoFilter("Todos"); }} />
            </div>
          </div>
        )}
      </main>

      {modal?.type === "new" && <ClaimFormModal mode="new" initial={modal.prefill} station={quien} usuarios={usuariosActivos} onClose={() => setModal(null)} onSubmit={handleCreate} />}
      {modal?.type === "edit" && <ClaimFormModal mode="edit" initial={modal.item} station={quien} usuarios={usuariosActivos} onClose={() => setModal(null)} onSubmit={handleUpdate} />}
      {modal?.type === "delete" && <ConfirmDelete item={modal.item} station={quien} onClose={() => setModal(null)} onConfirm={handleDelete} />}
      {modal?.type === "sync" && <CalendarSync data={activos} onClose={() => setModal(null)} onAgendar={marcarAgendado} />}
      {modal?.type === "pass" && <ChangePassModal onClose={() => setModal(null)} onDone={() => { setModal(null); flash("Contraseña actualizada"); }} />}

      <Toast toast={toast} />
      <DemoCinta />
    </div>
  );
}

// Cartel fijo de la demo: que quede claro que nada de esto se guarda.
function DemoCinta() {
  const [oculta, setOculta] = React.useState(false);
  if (!window.DEMO || oculta) return null;
  return (
    <div className="demo-cinta">
      <b>MODO DEMOSTRACIÓN</b>
      <span>Datos de ejemplo. Podés cargar, editar y borrar libremente: nada se guarda y todo vuelve a empezar al recargar la página.</span>
      <button className="demo-cinta-x" title="Ocultar" onClick={() => setOculta(true)}>×</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
