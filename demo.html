<!DOCTYPE html>
<html lang="es" data-density="regular" data-sidebar="charcoal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de gestiones · Demostración</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --brand:#DD0909; --brand-d:#bb0707;
  /* Roles derivados de la marca (los define marca.js segun el color):
     -ink  = texto ARRIBA del color de marca · -txt = texto del color de marca
     -soft = fondo tenue · -line = borde tenue · -ring = aro de foco */
  --brand-ink:#fff; --brand-txt:#DD0909; --brand-soft:var(--brand-soft);
  --brand-line:var(--brand-line); --brand-ring:var(--brand-ring);
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FBFBFC;
  --ink:#191C22; --ink-2:#5A6271; --muted:#8B93A1;
  --line:#E7E9ED; --line-2:#EFF1F4;
  --sb-bg:#1C1313; --sb-ink:#C9CFD9; --sb-ink-dim:#A18A8A; --sb-active:#2A1E1E;
  --font-scale:1;
  --radius:12px; --radius-sm:9px;
  --row-pad:13px;
  --shadow-sm:0 1px 2px rgba(16,20,28,.05),0 1px 3px rgba(16,20,28,.04);
  --shadow-md:0 4px 16px rgba(16,20,28,.08),0 2px 6px rgba(16,20,28,.05);
  --shadow-lg:0 18px 50px rgba(16,20,28,.22),0 6px 18px rgba(16,20,28,.12);
}
html[data-sidebar="rojo"]{ --sb-bg:#9c0808; --sb-ink:#ffd9d9; --sb-ink-dim:#f0a3a3; --sb-active:#7d0606; }
html[data-sidebar="claro"]{ --sb-bg:#FFFFFF; --sb-ink:#3A414D; --sb-ink-dim:#8B93A1; --sb-active:#F4F1F1; }
html[data-density="compact"]{ --row-pad:9px; }
html[data-density="comfy"]{ --row-pad:18px; }

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  font-family:"Public Sans",system-ui,sans-serif;
  font-size:calc(17px * var(--font-scale));
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#root,.app{ height:100vh; }
.app{ display:grid; grid-template-columns:248px 1fr; overflow:hidden; }
.mono{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; cursor:pointer; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:#d3d7dd; border-radius:99px; border:3px solid var(--bg); }

/* ---------- loader ---------- */
.boot{ height:100vh; display:grid; place-items:center; background:var(--bg); }
.boot-inner{ text-align:center; color:var(--muted); font-size:14px; }
.boot-spin{ width:34px; height:34px; border-radius:99px; border:3px solid var(--line);
  border-top-color:var(--brand-txt); margin:0 auto 14px; animation:boot-rot .8s linear infinite; }
@keyframes boot-rot{ to{ transform:rotate(360deg); } }

/* ---------- login ---------- */
.login{ height:100vh; display:grid; place-items:center; background:var(--bg); padding:24px; }
.login-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--shadow-md); padding:30px 28px 24px; display:flex; flex-direction:column;
  gap:13px; position:relative; overflow:hidden; animation:pop .2s cubic-bezier(.2,.9,.3,1.3); }
.login-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--brand); }
.login-logo{ background:#fff; border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-sm);
  border:1px solid var(--line); margin-bottom:4px; }
.login-logo{ display:grid; place-items:center; }
.login-logo img{ display:block; width:auto; max-width:100%; height:auto; max-height:96px; }
.login-title{ margin:4px 0 0; font-size:19px; font-weight:800; letter-spacing:-.01em; }
.login-sub{ margin:0 0 6px; font-size:13px; color:var(--muted); }
.login-field{ display:flex; flex-direction:column; gap:6px; }
.login-field span{ font-size:12px; font-weight:600; color:var(--ink-2); }
.login-err{ font-size:12.5px; color:var(--brand-txt); background:var(--brand-soft); border:1px solid var(--brand-line);
  border-radius:8px; padding:8px 11px; }
.login-btn{ justify-content:center; margin-top:4px; padding:11px; font-size:14px; }
.login-foot{ text-align:center; font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--muted); margin-top:6px; }
.login-info{ font-size:12.5px; color:#15803D; background:#E6F4EA; border:1px solid #b7e0c3;
  border-radius:8px; padding:8px 11px; }
.login-tabs{ display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.login-tab{ flex:1; padding:9px 10px; font-size:13px; font-weight:700; background:#fff; color:var(--muted); transition:.15s; }
.login-tab.is-on{ background:var(--brand); color:var(--brand-ink); }
.login-magic{ font-size:12.5px; color:var(--brand-txt); font-weight:600; text-decoration:underline;
  background:none; border:none; padding:2px 0; align-self:center; }

/* ---------- notificaciones (campana del topbar) ---------- */
.notif-wrap{ position:relative; }
.notif-btn{ position:relative; }
.notif-badge{ position:absolute; top:-4px; right:-5px; min-width:17px; height:17px; padding:0 4px;
  border-radius:99px; background:var(--brand); color:var(--brand-ink); font-size:10.5px; font-weight:800;
  display:grid; place-items:center; border:2px solid #fff; }
.notif-panel{ position:absolute; top:calc(100% + 10px); right:0; width:360px; max-width:calc(100vw - 24px);
  background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-md);
  z-index:80; overflow:hidden; animation:pop .15s ease; }
.notif-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
  border-bottom:1px solid var(--line); font-size:13.5px; font-weight:800; }
.notif-clear{ font-size:12px; font-weight:600; color:var(--brand-txt); background:none; border:none; text-decoration:underline; }
.notif-list{ max-height:380px; overflow-y:auto; }
.notif-empty{ padding:26px 16px; text-align:center; font-size:13px; color:var(--muted); }
.notif-item{ display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  padding:11px 14px; border-bottom:1px solid var(--surface-2); background:#fff; transition:.12s; }
.notif-item:hover{ background:var(--surface-2); }
.notif-item.unread{ background:#fdf6f6; }
.notif-item.unread:hover{ background:#fbeeee; }
.notif-ico{ flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  background:var(--surface-2); color:var(--ink-2); margin-top:1px; }
.notif-ico.notif-vencimiento{ background:#FBE3E3; color:#C0241D; }
.notif-ico.notif-asignacion{ background:#E8F0FE; color:#1D4ED8; }
.notif-ico.notif-solicitud{ background:#FDF1DC; color:#B45309; }
.notif-ico.notif-cotizacion{ background:#E6F4EA; color:#15803D; }
.notif-txt{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
.notif-title{ font-size:13px; font-weight:700; color:var(--ink); }
.notif-body{ font-size:12.5px; color:var(--ink-2); overflow:hidden; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.notif-meta{ font-size:11.5px; color:var(--muted); }
.notif-dot{ flex:none; width:8px; height:8px; border-radius:99px; background:var(--brand); margin-top:6px; }
@media (max-width: 460px){ .notif-panel{ position:fixed; top:64px; right:8px; left:8px; width:auto; } }

/* ---------- botones chicos (usuarios) ---------- */
.btn-primary.sm,.btn-ghost.sm{ padding:6px 10px; font-size:12.5px; }

/* ---------- buttons ---------- */
.btn-primary,.btn-ghost,.btn-danger{
  display:inline-flex; align-items:center; gap:7px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; border:1px solid transparent; padding:9px 14px;
  transition:.15s; white-space:nowrap;
}
.btn-primary{ background:var(--brand); color:var(--brand-ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.btn-primary:hover{ background:var(--brand-d); }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.btn-ghost{ background:#fff; color:var(--ink-2); border-color:var(--line); }
.btn-ghost:hover:not(:disabled){ background:var(--surface-2); color:var(--ink); border-color:#dcdfe5; }
.btn-ghost:disabled{ opacity:.4; cursor:not-allowed; }
.btn-ghost.danger:hover:not(:disabled){ color:var(--brand-txt); border-color:var(--brand-line); background:var(--brand-soft); }
.btn-danger{ background:var(--brand); color:var(--brand-ink); }
.btn-danger:hover{ background:var(--brand-d); }
.tb-icon{ padding:9px; }

/* ---------- sidebar ---------- */
.sb{ background:var(--sb-bg); display:flex; flex-direction:column; padding:18px 14px 14px; gap:4px;
  border-right:1px solid rgba(255,255,255,.04); position:relative; overflow-y:auto; scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent; }
.sb::-webkit-scrollbar{ width:8px; }
.sb::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border:2px solid transparent; background-clip:content-box; }
html[data-sidebar="claro"] .sb{ scrollbar-color:#d3d7dd transparent; }
html[data-sidebar="claro"] .sb::-webkit-scrollbar-thumb{ background:#d3d7dd; background-clip:content-box; }
.sb::after{ content:""; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--brand); opacity:.9; }
html[data-sidebar="claro"] .sb{ border-right:1px solid var(--line); }
html[data-sidebar="rojo"] .sb::after{ display:none; }
.sb-brand{ padding:4px 6px 14px; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,.07); }
html[data-sidebar="claro"] .sb-brand{ border-bottom-color:var(--line); }
/* El logo se centra y se limita por altura: así entra igual de bien uno
   apaisado que uno cuadrado, sin comerse media barra lateral. */
.sb-logo{ background:#fff; border-radius:10px; padding:11px 13px; box-shadow:var(--shadow-sm);
  display:grid; place-items:center; }
.sb-logo img{ display:block; width:auto; max-width:100%; height:auto; max-height:74px; }
.sb-sub{ display:flex; align-items:center; gap:7px; color:var(--sb-ink-dim); font-size:11px; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; margin-top:13px; padding-left:4px; }
.sb-sub-dot{ width:6px; height:6px; border-radius:99px; background:var(--brand); }
.sb-nav{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
.sb-group{ display:flex; flex-direction:column; gap:2px; }
.sb-group-label{ font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--sb-ink-dim); padding:2px 10px 6px; opacity:.7; }
.sb-item{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px;
  background:transparent; border:none; color:var(--sb-ink); font-size:13.5px; font-weight:500; text-align:left;
  transition:.14s; position:relative; }
.sb-item:hover{ background:var(--sb-active); color:#fff; }
html[data-sidebar="claro"] .sb-item:hover{ color:var(--ink); }
.sb-item.is-active{ background:var(--sb-active); color:#fff; font-weight:600; }
.sb-item.is-active .sb-item-ico{ color:var(--brand-txt); }
html[data-sidebar="claro"] .sb-item.is-active{ color:var(--ink); }
html[data-sidebar="rojo"] .sb-item.is-active .sb-item-ico{ color:#fff; }
.sb-item-ico{ display:grid; place-items:center; flex-shrink:0; transition:.14s; }
.sb-item-label{ flex:1; }
.sb-count{ margin-left:auto; background:var(--brand); color:var(--brand-ink); font-size:11px; font-weight:700;
  min-width:20px; height:20px; display:grid; place-items:center; border-radius:99px; padding:0 6px; }
.sb-station{ margin-top:auto; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.07);
  border-radius:11px; padding:12px; }
html[data-sidebar="claro"] .sb-station{ background:var(--surface-2); border-color:var(--line); }
.sb-station-row{ display:flex; align-items:center; gap:7px; color:var(--sb-ink-dim); font-size:10.5px;
  font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.sb-station-row svg{ margin-left:auto; }
.sb-station-led{ width:8px; height:8px; border-radius:99px; background:#2ec27a; box-shadow:0 0 0 3px rgba(46,194,122,.18);
  animation:pulse 2.4s infinite; flex-shrink:0; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
.sb-station-name{ font-family:"JetBrains Mono",monospace; color:#fff; font-size:13.5px; font-weight:500; margin-top:9px; }
html[data-sidebar="claro"] .sb-station-name{ color:var(--ink); }
.sb-station-note{ color:var(--sb-ink-dim); font-size:10.5px; margin-top:3px; }
.sb-foot{ display:flex; flex-direction:column; gap:1px; padding:12px 8px 4px; margin-top:10px;
  border-top:1px solid rgba(255,255,255,.07); }
html[data-sidebar="claro"] .sb-foot{ border-top-color:var(--line); }
.sb-foot-mark{ font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--sb-ink); }
html[data-sidebar="claro"] .sb-foot-mark{ color:var(--ink); }
.sb-foot-meta{ font-size:10px; color:var(--sb-ink-dim); }

/* ---------- sidebar · carpetas (accordion) ---------- */
.sb-folder{ display:flex; flex-direction:column; }
.sb-folder-head{ display:flex; align-items:center; gap:11px; width:100%; padding:9px 11px; border-radius:9px;
  background:transparent; border:none; color:var(--sb-ink); font-size:12px; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; text-align:left; transition:.14s; }
.sb-folder-head:hover{ background:var(--sb-active); color:#fff; }
html[data-sidebar="claro"] .sb-folder-head:hover{ color:var(--ink); }
.sb-folder-head .sb-item-ico{ color:var(--sb-ink-dim); transition:.14s; }
.sb-folder.is-open .sb-folder-head{ color:#fff; }
html[data-sidebar="claro"] .sb-folder.is-open .sb-folder-head{ color:var(--ink); }
.sb-folder.is-open .sb-folder-head .sb-item-ico,
.sb-folder-head.has-active .sb-item-ico{ color:var(--brand-txt); }
.sb-folder-label{ flex:1; }
.sb-folder-chev{ display:grid; place-items:center; color:var(--sb-ink-dim); transition:transform .22s ease; }
.sb-folder.is-open .sb-folder-chev{ transform:rotate(90deg); color:var(--sb-ink); }
.sb-folder-kids{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .24s ease; }
.sb-folder.is-open .sb-folder-kids{ grid-template-rows:1fr; }
.sb-folder-kids-inner{ overflow:hidden; display:flex; flex-direction:column; gap:1px;
  margin:2px 0 4px 20px; padding-left:11px; border-left:1px solid rgba(255,255,255,.09); }
html[data-sidebar="claro"] .sb-folder-kids-inner{ border-left-color:var(--line); }
.sb-subitem{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--sb-ink-dim); font-size:13px; font-weight:500; text-align:left; transition:.14s; }
.sb-subitem:hover{ background:var(--sb-active); color:#fff; }
html[data-sidebar="claro"] .sb-subitem:hover{ color:var(--ink); }
.sb-subitem.is-active{ background:var(--sb-active); color:#fff; font-weight:600; }
html[data-sidebar="claro"] .sb-subitem.is-active{ color:var(--ink); }
.sb-subitem.is-active .sb-subitem-ico{ color:var(--brand-txt); }
.sb-subitem-ico{ display:grid; place-items:center; flex-shrink:0; opacity:.9; }
.sb-subitem-label{ flex:1; }
.sb-subitem .sb-count{ min-width:18px; height:18px; font-size:10.5px; }

/* módulo en preparación */
.module-ph{ max-width:430px; margin:36px auto 0; }
.module-ph-tag{ display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--brand-txt); background:var(--brand-soft); border:1px solid var(--brand-line); border-radius:99px;
  padding:5px 11px; margin-bottom:13px; }
.module-ph-dot{ width:7px; height:7px; border-radius:99px; background:var(--brand); }

/* ---------- topbar ---------- */
.main{ display:flex; flex-direction:column; overflow:hidden; }
.tb{ display:flex; align-items:center; gap:20px; padding:14px 28px; background:var(--surface);
  border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(16,20,28,.02); }
.tb-titles h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:-.015em; }
.tb-crumb{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); margin-bottom:3px; }
.tb-crumb b{ color:var(--ink-2); font-weight:600; }
.tb-crumb svg{ opacity:.6; }
.tb-search{ flex:1; max-width:440px; margin-left:8px; display:flex; align-items:center; gap:9px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; transition:.15s; }
.tb-search:focus-within{ border-color:var(--brand-txt); background:#fff; box-shadow:0 0 0 3px var(--brand-ring); }
.tb-search input{ border:none; outline:none; background:none; flex:1; font-size:13.5px; color:var(--ink); }
.tb-search-clear{ border:none; background:none; color:var(--muted); display:grid; place-items:center; padding:2px; }
.tb-actions{ display:flex; align-items:center; gap:10px; margin-left:auto; }
.tb-menu{ display:none; }
.tb-date{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2); font-weight:500; }
.tb-date svg{ color:var(--muted); }
.tb-sep{ width:1px; height:26px; background:var(--line); }
.tb-station-chip{ display:inline-flex; align-items:center; gap:7px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:99px; padding:7px 13px; font-family:"JetBrains Mono",monospace;
  font-size:12px; font-weight:500; color:var(--ink-2); transition:.15s; }
.tb-station-chip:hover{ border-color:#dcdfe5; color:var(--ink); }

/* ---------- content ---------- */
.content{ flex:1; overflow:auto; padding:24px 28px 40px; }
.kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px; }
.kpi{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px 15px; box-shadow:var(--shadow-sm); overflow:hidden; transition:.16s; }
.kpi:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
.kpi-stripe{ position:absolute; top:0; left:0; width:100%; height:3px; opacity:.85; }
.kpi-top{ display:flex; align-items:center; gap:10px; }
.kpi-label{ font-size:12.5px; color:var(--ink-2); font-weight:600; }
.kpi-ico{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; }
.kpi-mid{ display:flex; align-items:baseline; gap:10px; margin-top:11px; }
.kpi-value{ font-size:30px; font-weight:800; letter-spacing:-.025em; line-height:1; font-variant-numeric:tabular-nums; }
.kpi-delta{ font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:99px; font-variant-numeric:tabular-nums; }
.kpi-delta.up{ color:#15803D; background:#E6F4EA; }
.kpi-delta.down{ color:#C0241D; background:#FBE3E3; }
.kpi-delta.flat{ color:var(--muted); background:var(--surface-2); }
.kpi-foot{ margin-top:13px; }
.kpi-bar{ height:5px; border-radius:99px; background:var(--line-2); overflow:hidden; }
.kpi-bar span{ display:block; height:100%; border-radius:99px; opacity:.85; transition:width .4s ease; }
.kpi-hint{ font-size:11.5px; color:var(--muted); margin-top:7px; display:block; }

/* ---------- badges & cell helpers ---------- */
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-weight:600; white-space:nowrap; line-height:1.2; }
.badge-dot{ width:6px; height:6px; border-radius:99px; }
.cia-pill{ display:inline-block; font-size:12px; font-weight:600; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:7px; padding:3px 9px; white-space:nowrap; }
.cia-pill.sm{ font-size:11px; padding:2px 7px; }
.ramo{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink); font-weight:600; }
.ramo svg{ color:var(--brand-txt); opacity:.85; flex-shrink:0; }
.ramo-sub{ display:block; font-size:11px; color:var(--muted); font-weight:500; font-style:normal; margin-top:1px; }
.ramo-body{ display:inline-flex; flex-direction:column; align-items:flex-start; }
.ramo-name{ line-height:1.15; }
.hecho-badge{ display:inline-flex; align-items:center; padding:1px 8px; border-radius:6px; font-size:11px;
  font-weight:800; letter-spacing:.02em; margin-top:3px; white-space:nowrap; text-transform:uppercase;
  color:var(--ink); background:var(--surface-2); border:1px solid var(--line); }
.urg-none{ color:var(--muted); }
.vence{ display:flex; flex-direction:column; gap:3px; align-items:flex-start; }
.vence-date{ font-size:12px; color:var(--ink-2); font-weight:600; }
.cell-id{ font-size:12px; font-weight:600; color:var(--ink); }
.cell-gestion{ max-width:230px; }
.gestion-text{ font-size:12.5px; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; line-height:1.35; }
.gestion-done{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:#15803D; font-weight:600; }

/* ---------- panel + toolbar ---------- */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); overflow:hidden; }
.toolbar{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line-2);
  flex-wrap:wrap; }
.toolbar-left{ display:flex; align-items:center; gap:9px; }
.toolbar-title{ font-size:14.5px; font-weight:700; }
.toolbar-count{ background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); font-size:12px;
  font-weight:700; border-radius:99px; padding:1px 9px; font-variant-numeric:tabular-nums; }
.toolbar-right{ display:flex; align-items:center; gap:9px; margin-left:auto; flex-wrap:wrap; }
.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:3px; }
.seg-btn{ border:none; background:none; padding:6px 11px; border-radius:6px; font-size:12.5px; font-weight:600;
  color:var(--ink-2); transition:.13s; }
.seg-btn:hover{ color:var(--ink); }
.seg-btn.is-on{ background:#fff; color:var(--brand-txt); box-shadow:var(--shadow-sm); }
.select{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:8px 11px; font-size:12.5px;
  font-weight:600; color:var(--ink-2); font-family:inherit; }
.toolbar-divider{ width:1px; height:24px; background:var(--line); }

/* ---------- table ---------- */
.table-wrap{ overflow-x:auto; }
.table{ width:100%; border-collapse:collapse; }
.table th{ text-align:left; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2); }
.table th.th-sort{ cursor:pointer; user-select:none; transition:color .13s; }
.table th.th-sort:hover{ color:var(--ink); }
.table td{ padding:var(--row-pad) 14px; border-bottom:1px solid var(--line-2); font-size:13px; vertical-align:middle; }
.table tbody tr{ cursor:pointer; transition:background .12s; }
.table tbody tr:hover{ background:#fbfafa; }
.table tbody tr.is-selected{ background:var(--brand-soft); box-shadow:inset 3px 0 0 var(--brand); }
.table tbody tr:last-child td{ border-bottom:none; }
.cell-strong{ font-weight:600; color:var(--ink); }
.cell-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
.multi-chip{ display:inline-grid; place-items:center; margin-left:7px; min-width:22px; height:17px; padding:0 5px;
  border:none; border-radius:99px; background:var(--brand); color:var(--brand-ink); font-size:10.5px; font-weight:800;
  vertical-align:middle; transition:.13s; }
.multi-chip:hover{ transform:scale(1.12); }
.ds-ref{ font-weight:600; font-size:17px; color:var(--ink-2); }
.dim{ color:var(--ink-2); }
.radio{ width:16px; height:16px; border-radius:99px; border:2px solid #cfd4dc; display:inline-block; transition:.13s; }
.radio.on{ border-color:var(--brand-txt); background:radial-gradient(circle at center,var(--brand) 0 4px,transparent 5px); }
.tipo{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); font-weight:500; }
.tipo svg{ color:var(--muted); }
.pc-tag{ display:inline-block; font-size:10.5px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:5px; padding:1px 6px; margin-top:3px; }
.row-open{ border:none; background:none; color:var(--muted); display:grid; place-items:center; padding:5px;
  border-radius:7px; transition:.13s; }
.row-open:hover{ background:var(--surface-2); color:var(--brand-txt); }

/* empty + placeholder */
.empty,.placeholder{ text-align:center; padding:60px 24px; color:var(--muted); }
.empty-ico,.ph-ico{ width:54px; height:54px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line);
  display:grid; place-items:center; margin:0 auto 14px; color:var(--ink-2); }
.empty-title{ font-size:15px; font-weight:700; color:var(--ink); }
.empty-sub{ font-size:13px; margin-top:4px; max-width:340px; margin-inline:auto; }
.placeholder h2{ margin:0 0 6px; color:var(--ink); font-size:20px; }
.placeholder p{ max-width:380px; margin:0 auto 18px; font-size:13.5px; }

/* ---------- modal ---------- */
.modal-scrim{ position:fixed; inset:0; background:rgba(16,20,28,.45); backdrop-filter:blur(2px);
  display:grid; place-items:center; padding:24px; z-index:60; animation:fade .15s ease; }
@keyframes fade{ from{ opacity:0; } }
.modal{ background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); width:100%; max-width:480px;
  display:flex; flex-direction:column; max-height:90vh; overflow:hidden; animation:pop .18s cubic-bezier(.2,.9,.3,1.3); }
.modal-wide{ max-width:640px; }
.modal-sm{ max-width:420px; }
@keyframes pop{ from{ transform:translateY(10px) scale(.98); opacity:0; } }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:20px 22px 14px; }
.modal-head h2{ margin:0; font-size:17.5px; font-weight:700; letter-spacing:-.01em; }
.modal-head p{ margin:3px 0 0; font-size:12.5px; color:var(--muted); }
.modal-body{ padding:4px 22px 20px; overflow:auto; }
.modal-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 22px;
  border-top:1px solid var(--line-2); background:var(--surface-2); }
.foot-note{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
.foot-btns{ display:flex; gap:9px; }

/* form */
.form-section{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--brand-txt);
  margin:18px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line-2); }
.form-section:first-child{ margin-top:2px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field-full{ grid-column:1/-1; }
.field-label{ font-size:12px; font-weight:600; color:var(--ink-2); }
.field-label i{ color:var(--brand-txt); font-style:normal; }
.input{ border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13.5px; font-family:inherit;
  color:var(--ink); background:#fff; outline:none; transition:.15s; width:100%; resize:vertical; }
.input:focus{ border-color:var(--brand-txt); box-shadow:0 0 0 3px var(--brand-ring); }
.input:disabled{ background:var(--surface-2); color:var(--muted); }
.input.err{ border-color:var(--brand-txt); box-shadow:0 0 0 3px var(--brand-ring); }
.estado-pills{ display:flex; flex-wrap:wrap; gap:7px; }
.epill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff;
  border-radius:99px; padding:6px 11px; font-size:12px; font-weight:600; color:var(--ink-2); transition:.13s; }
.epill:hover{ border-color:#d3d7dd; }
.epill.on{ border-color:var(--brand-txt); color:var(--brand-txt); background:var(--brand-soft); }
.epill-dot{ width:7px; height:7px; border-radius:99px; }
.check-row{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-2); cursor:pointer; }
.check-row input{ width:16px; height:16px; accent-color:var(--brand-txt); }

/* historial de gestiones (formulario) */
.hist-head{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.hist-count{ background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); font-size:11px;
  font-weight:700; border-radius:99px; padding:1px 8px; min-width:20px; text-align:center; }
.hist-list{ list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:6px; }
.hist-item{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line);
  border-radius:9px; padding:7px 10px; }
.hist-date{ font-size:12px; color:var(--ink-2); font-weight:600; flex-shrink:0; min-width:42px; }
.hist-text{ flex:1; font-size:12.5px; color:var(--ink); line-height:1.35; }
.hist-del{ border:none; background:none; color:var(--muted); display:grid; place-items:center; padding:3px;
  border-radius:6px; flex-shrink:0; }
.hist-del:hover{ color:var(--brand-txt); background:var(--brand-soft); }
.hist-empty{ font-size:12.5px; color:var(--muted); padding:6px 2px 10px; }
.hist-add{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hist-add-date{ width:150px; flex:0 0 auto; }
.hist-add-text{ flex:1; min-width:160px; }
.hist-add-btn{ flex:0 0 auto; }

/* historial de gestiones (línea de tiempo · detalle) */
.hist-tl{ list-style:none; margin:2px 0 0; padding:0; display:flex; flex-direction:column; }
.hist-tl-item{ display:flex; gap:13px; padding:0 0 14px; position:relative; }
.hist-tl-item:last-child{ padding-bottom:0; }
.hist-tl-dot{ width:11px; height:11px; border-radius:99px; background:var(--brand); flex-shrink:0; margin-top:3px;
  box-shadow:0 0 0 3px #fdecec; position:relative; z-index:1; }
.hist-tl-item:not(:last-child)::before{ content:""; position:absolute; left:5px; top:14px; bottom:0;
  width:2px; background:var(--line); }
.hist-tl-body{ flex:1; }
.hist-tl-date{ font-size:12px; font-weight:700; color:var(--ink-2); }
.hist-tl-text{ margin:3px 0 0; font-size:13.5px; color:var(--ink); line-height:1.5; }

/* denuncia · autocompletar */
.denuncia-box{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  background:linear-gradient(180deg,#fff,#fdf5f5); border:1px solid var(--brand-line); border-radius:11px;
  padding:12px 14px; margin:2px 0 6px; }
.denuncia-txt{ display:flex; align-items:center; gap:10px; }
.denuncia-txt > svg{ color:var(--brand-txt); flex-shrink:0; }
.denuncia-txt b{ display:block; font-size:13px; color:var(--ink); }
.denuncia-txt span{ display:block; font-size:11.5px; color:var(--ink-2); }
.denuncia-msg{ font-size:12px; color:#15803D; background:#E6F4EA; border:1px solid #bfe5cc;
  border-radius:8px; padding:7px 11px; margin:0 0 8px; }
.btn-ghost.is-disabled{ opacity:.5; cursor:not-allowed; }

/* adjuntos (formulario) */
.adj-box{ display:flex; flex-direction:column; gap:9px; margin-top:2px; }
.adj-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.adj-item{ display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
.adj-item > svg{ color:var(--brand-txt); flex-shrink:0; }
.adj-name{ flex:1; font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.adj-size{ font-size:11px; color:var(--muted); flex-shrink:0; }
.adj-add{ align-self:flex-start; cursor:pointer; }
.adj-add.is-disabled{ opacity:.5; cursor:not-allowed; }
.adj-note{ font-size:11.5px; color:var(--muted); }

/* adjuntos (detalle) */
.ds-adj-count{ margin-left:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); font-size:11px; font-weight:700; border-radius:99px; padding:0 8px; }
.adj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; margin-top:4px; }
.adj-card{ display:flex; flex-direction:column; gap:7px; text-decoration:none; color:var(--ink-2); }
.adj-thumb{ width:100%; height:96px; object-fit:cover; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); display:block; }
.adj-thumb-file{ display:grid; place-items:center; color:var(--brand-txt); }
.adj-card:hover .adj-thumb{ border-color:var(--brand-txt); }
.adj-card-name{ font-size:11.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* detail */
.dt-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:2px 0 15px; border-bottom:1px solid var(--line-2); }
.dt-cal{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:3px 9px; }
.dt-action{ margin:15px 0; padding:14px 16px; border:1px solid var(--brand-line); background:#fdf5f5; border-radius:11px; }
.dt-action-k{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--brand-txt); }
.dt-action-v{ font-size:14.5px; font-weight:600; color:var(--ink); margin-top:7px; line-height:1.4; }
.dt-action-deadline{ font-size:12px; color:var(--ink-2); margin-top:8px; }
.dt-cols{ display:grid; grid-template-columns:1fr 1fr; gap:0 26px; }
.dt-block{ padding:16px 0 4px; border-top:1px solid var(--line-2); }
.dt-cols .dt-block{ border-top:none; padding-top:14px; }
.dt-block-title{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); margin-bottom:8px; }
.dt-row{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line-2); }
.dt-row:last-child{ border-bottom:none; }
.dt-k{ font-size:12px; color:var(--muted); font-weight:600; }
.dt-v{ font-size:13px; font-weight:500; text-align:right; }
.dt-gestor{ margin-top:10px; }
.dt-gestor-card{ display:flex; align-items:center; gap:11px; margin-top:8px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.dt-gestor-av{ width:34px; height:34px; border-radius:99px; background:#fff; border:1px solid var(--line);
  display:grid; place-items:center; color:var(--ink-2); flex-shrink:0; }
.dt-gestor-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
.dt-gestor-mail{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--brand-txt);
  text-decoration:none; margin-top:2px; }
.dt-gestor-mail:hover{ text-decoration:underline; }
.dt-obs{ margin:0; font-size:13px; color:var(--ink-2); line-height:1.55; }
.dt-ticket{ display:inline-flex; align-items:center; gap:7px; margin-top:11px; font-size:12.5px; font-weight:600;
  color:var(--ink); text-decoration:none; background:var(--surface-2); border:1px solid var(--line);
  border-radius:9px; padding:8px 13px; transition:.14s; }
.dt-ticket:hover{ border-color:var(--brand-txt); color:var(--brand-txt); }
.dt-ticket svg{ color:var(--brand-txt); }
.dt-stamp{ margin-top:16px; padding-top:12px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--muted); }

/* ---------- detail screen (pantalla completa) ---------- */
.ds{ max-width:1040px; margin:0 auto; animation:dsIn .22s ease; }
@keyframes dsIn{ from{ opacity:0; transform:translateY(6px); } }
.ds-topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
.ds-back{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff;
  color:var(--ink-2); border-radius:9px; padding:8px 13px; font-size:13px; font-weight:600; transition:.14s; }
.ds-back:hover{ color:var(--brand-txt); border-color:var(--brand-line); background:var(--brand-soft); }
.ds-top-actions{ display:flex; gap:9px; }
.ds-hero{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); padding:22px 24px; position:relative; overflow:hidden; }
.ds-hero::before{ content:""; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--brand); }
.ds-crumb{ font-size:12px; color:var(--muted); font-weight:600; }
.ds-client{ margin:7px 0 12px; font-size:25px; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
.ds-badges{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.ds-hero-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
.cia-pill.lg{ font-size:13px; padding:6px 13px; }
.ds-cobertura{ font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.ds-action{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  margin-top:16px; padding:18px 22px; border:1px solid var(--brand-line); background:#fdf5f5; border-radius:var(--radius); }
.ds-action-k{ display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--brand-txt); }
.ds-action-v{ font-size:17px; font-weight:700; color:var(--ink); margin-top:8px; line-height:1.35; }
.ds-action-deadline{ display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); margin-top:10px; }
.ds-action-deadline svg{ color:var(--brand-txt); }
.ds-action-cal{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.ds-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.ds-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); padding:18px 20px; }
.ds-card-wide{ grid-column:1/-1; }
.ds-card-title{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink);
  padding-bottom:11px; margin-bottom:6px; border-bottom:1px solid var(--line-2); }
.ds-card-title svg{ color:var(--brand-txt); opacity:.8; }
.ds-row{ display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--line-2); }
.ds-row:last-child{ border-bottom:none; }
.ds-k{ font-size:12.5px; color:var(--muted); font-weight:600; }
.ds-v{ font-size:13.5px; font-weight:500; color:var(--ink); text-align:right; }
.ds-gestion-block .ds-k{ display:block; margin-bottom:4px; }
.ds-gestion-text{ margin:0; font-size:14px; color:var(--ink); line-height:1.5; font-weight:500; }
.ds-gestor{ display:flex; align-items:center; gap:13px; padding-top:4px; }
.ds-gestor-av{ width:42px; height:42px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line);
  display:grid; place-items:center; color:var(--ink-2); flex-shrink:0; }
.ds-gestor-name{ font-size:15px; font-weight:700; color:var(--ink); }
.ds-gestor-mail{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--brand-txt);
  text-decoration:none; margin-top:3px; }
.ds-gestor-mail:hover{ text-decoration:underline; }
.ds-gestor-nomail{ font-size:12.5px; color:var(--muted); margin-top:3px; display:block; }
.ds-obs{ margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.6; }
.ds-stamp{ margin-top:18px; font-size:12px; color:var(--muted); text-align:center; }
@media (max-width:820px){ .ds-grid{ grid-template-columns:1fr; } .ds-hero{ flex-direction:column; } .ds-hero-right{ align-items:flex-start; } }

/* confirm */
.confirm{ padding:26px 24px 20px; text-align:center; }
.confirm-ico{ width:52px; height:52px; border-radius:14px; background:var(--brand-soft); color:var(--brand-txt);
  display:grid; place-items:center; margin:0 auto 14px; }
.confirm h2{ margin:0 0 8px; font-size:18px; }
.confirm p{ margin:0 auto; font-size:13.5px; color:var(--ink-2); line-height:1.55; max-width:340px; }
.confirm-note{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 12px; margin:16px 0 4px; }
.confirm-btns{ display:flex; gap:10px; justify-content:center; margin-top:16px; }

/* ---------- agenda ---------- */
.agenda{ display:flex; flex-direction:column; gap:22px; max-width:920px; }
.ag-group{ display:flex; flex-direction:column; gap:10px; }
.ag-head{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; color:var(--ink);
  padding-left:2px; }
.ag-head svg{ flex-shrink:0; }
.ag-count{ background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); font-size:11.5px;
  font-weight:700; border-radius:99px; padding:0 8px; min-width:20px; text-align:center; }
.ag-vencido{ color:#B91C1C; } .ag-vencido svg{ color:#DC2626; }
.ag-hoy{ color:#B45309; } .ag-hoy svg{ color:#D97706; }
.ag-proximo{ color:#1D4ED8; } .ag-proximo svg{ color:#2563EB; }
.ag-normal{ color:var(--ink-2); } .ag-normal svg{ color:var(--muted); }
.ag-list{ display:flex; flex-direction:column; gap:9px; }
.ag-card{ display:flex; align-items:stretch; gap:0; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden;
  transition:.15s; padding:0; }
.ag-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); border-color:#dcdfe5; }

/* historial: orden y edición inline */

.hist-item-edit .hist-add-text{ flex:1; min-width:120px; }

/* ---------- solicitudes públicas ---------- */
.sol-wrap{ max-width:960px; }
.sol-grid{ display:flex; flex-direction:column; gap:14px; margin-top:16px; }
.sol-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); padding:18px 20px; }
.sol-card.nueva{ border-left:4px solid var(--brand); }
.sol-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; }

/* ---------- toast ---------- */
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:80;
  background:var(--ink); color:#fff; border-radius:11px; padding:12px 18px; font-size:13.5px; font-weight:500;
  display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); animation:toastIn .25s cubic-bezier(.2,.9,.3,1.3); }
@keyframes toastIn{ from{ transform:translate(-50%,12px); opacity:0; } }
.toast-ico{ width:22px; height:22px; border-radius:99px; background:#2ec27a; color:#fff; display:grid; place-items:center; }

/* ===================== RESPONSIVE ===================== */
/* Pantallas medianas / tablet */
@media (max-width:1000px){
  .kpis{ grid-template-columns:repeat(2,1fr); }
  .content{ padding:20px 18px 40px; }
  .tb-date,.tb-sep{ display:none; }
  .tb-search{ max-width:none; }
}

/* Celular y tablet chico: sidebar como cajón deslizable (hamburguesa) */
@media (max-width:820px){
  .app{ grid-template-columns:1fr; }
  .sb{ position:fixed; top:0; left:0; bottom:0; width:250px; z-index:70;
    transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow-lg); }
  .sb.is-open{ transform:translateX(0); }
  .sb-scrim{ position:fixed; inset:0; background:rgba(16,20,28,.5); z-index:65; animation:fade .15s ease; }
  .tb-menu{ display:inline-grid; }
  .tb{ padding:11px 14px; gap:10px; }
  .tb-titles{ display:none; }
  .tb-search{ margin-left:0; }
  .tb-station-chip{ display:none; }
  .content{ padding:15px 13px 46px; }
  .kpis{ grid-template-columns:repeat(2,1fr); gap:11px; margin-bottom:14px; }
  .kpi{ padding:13px 15px 12px; }
  .kpi-value{ font-size:25px !important; }
  .form-grid{ grid-template-columns:1fr; }
  .modal-scrim{ padding:10px; align-items:flex-start; }
  .modal{ max-height:94vh; }
  .toolbar{ gap:10px; }
  .toolbar-right{ width:100%; }
  .toolbar-right .select{ flex:1 1 auto; }
  .agenda,.sol-wrap,.ds{ max-width:none; }
  .ag-card-right{ min-width:82px; padding:12px 10px; }
  .obj-grid{ grid-template-columns:1fr; }
  .ds-hero{ flex-direction:column; }
  .ds-hero-right{ align-items:flex-start; flex-direction:row; gap:12px; }
  .ds-top-actions{ flex-wrap:wrap; }
  .ds-action{ flex-direction:column; align-items:flex-start; }
  .ds-client{ font-size:23px !important; }
}

/* Celular chico */
@media (max-width:460px){
  .kpis{ grid-template-columns:1fr; }
  .kpi-value{ font-size:28px !important; }
  .btn-label{ display:none; }
  .tb-actions{ gap:6px; }
  .sol-grid-datos{ grid-template-columns:1fr; }
  .seg{ flex-wrap:wrap; }
  .ag-card{ flex-direction:column; }
  .ag-rail{ width:100%; height:4px; }
  .ag-card-right{ flex-direction:row; justify-content:space-between; min-width:0; width:100%;
    border-left:none; border-top:1px solid var(--line-2); gap:10px; }
  .modal-head h2{ font-size:17px; }
  .content{ padding:13px 11px 46px; }
}
/* ---------- facturación: carga mensual ---------- */
.fact-periodo{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; background:var(--surface);

.fact-periodo-sel{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex:1; }
.fact-periodo-label{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }

.fact-mes-pill{ padding:6px 10px; border:none; background:transparent; border-radius:7px; font-size:12.5px;

.input.sm.strong{ font-weight:700; }
.fact-tag{ display:inline-block; background:var(--surface-2); border:1px solid var(--line); border-radius:5px;

  padding:0 5px; font-size:10.5px; font-weight:700; margin-left:5px; }

@media (max-width: 820px){

/* ---------- tarjeta de estadísticas (compartida) ---------- */

.select.sm{ padding:6px 9px; font-size:12px; }

/* ---------- estadísticas de siniestros ---------- */
.est-wrap{ display:flex; flex-direction:column; gap:16px; }
.est-bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:11px 16px; box-shadow:var(--shadow-sm); }

/* ---------- facturación: tablero de estadísticas ---------- */
.fact-dash{ display:flex; flex-direction:column; gap:16px; }
.fact-kpis{ grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:0; }

.fact-dash-main,.fact-dash-side{ display:flex; flex-direction:column; gap:16px; min-width:0; }

  function alta(arr, item) { const it = { ...clonar(item), _dbId: nuevoId(arr) }; arr.push(it); return espera(clonar(it)); }

      markRead: (id) => { const n = notificaciones.find((x) => x._dbId === id); if (n) n.leida = true; return espera(true); },

        remove: (it) => { companias = companias.filter((c) => c.id !== it.id); mensual = mensual.filter((m) => m.companiaId !== it.id); return espera(true); },
      },
      mensual: {
        list: (anio) => espera(clonar(anio ? mensual.filter((m) => m.anio === anio) : mensual)),
        save: (it) => {
          const i = mensual.findIndex((m) => m.companiaId === it.companiaId && m.anio === it.anio && m.mes === it.mes);
          if (i >= 0) { mensual[i] = { ...mensual[i], ...clonar(it) }; return espera(clonar(mensual[i])); }
          const nu = { ...clonar(it), _dbId: nuevoId(mensual) };
          mensual.push(nu);
          return espera(clonar(nu));
        },
        remove: (it) => { mensual = mensual.filter((m) => m._dbId !== it._dbId); return espera(true); },
      },
      subscribe: nada,
    },
    renov: {
      list: () => vivos(renovaciones), create: (it) => alta(renovaciones, it), update: (it) => edita(renovaciones, it),
      remove: (it) => baja(renovaciones, it), maxN: () => espera(maxN(renovaciones)), subscribe: nada,
    },
    pend: {
      list: () => vivos(pendientes), create: (it) => alta(pendientes, it), update: (it) => edita(pendientes, it),
      remove: (it) => baja(pendientes, it), maxN: () => espera(maxN(pendientes)), subscribe: nada,
    },
    obj: {
      list: () => vivos(objetivos), create: (it) => alta(objetivos, it), update: (it) => edita(objetivos, it),
      remove: (it) => baja(objetivos, it), maxN: () => espera(maxN(objetivos)), subscribe: nada,
    },
    sol: { list: () => espera(clonar(solicitudes)), update: (it) => edita(solicitudes, it), subscribe: nada },
    cot: { list: () => espera(clonar(cotizaciones)), update: (it) => edita(cotizaciones, it), subscribe: nada },
    // Sin `files`: en la demo no se suben adjuntos (el formulario esconde esa parte solo).
  };
})();

<script type="text/babel" data-file="data.jsx">
// data.jsx — Saraceni Seguros · seguimiento de siniestros (modelo real del Excel)

// ---- compañías ----
const CIA_FULL = {
  "LMA": "La Mercantil Andina",
  "PROVINCIA": "Provincia Seguros",
  "ALLIANZ": "Allianz",
  "SANCOR": "Sancor Seguros",
  "FEDERACION": "Federación Patronal",
  "SAN CRISTOBAL": "San Cristóbal",
  "ZURICH": "Zurich",
};
const CIAS = Object.keys(CIA_FULL);
const ciaLabel = (k) => CIA_FULL[k] || k;

// COMERCIO se quita del selector; INT_CONSORCIO se agrega.
// (Se mantiene COMERCIO en los labels para que registros viejos se muestren bien.)
const RAMOS = ["AUTO", "HOGAR", "ICO", "INT_CONSORCIO", "VIDA"];
const RAMO_LABEL = { AUTO: "Auto", HOGAR: "Hogar", ICO: "Int. Comercio", INT_CONSORCIO: "Int. Consorcio", COMERCIO: "Comercio", VIDA: "Vida" };
const RAMO_ICON = { AUTO: "car", HOGAR: "home", ICO: "store", INT_CONSORCIO: "store", COMERCIO: "store", VIDA: "shield" };

const HECHOS = ["DAÑO PARCIAL", "ROBO TOTAL", "CRISTAL", "INCENDIO", "GRANIZO", "RC"];
const HECHO_LABEL = { "DAÑO PARCIAL": "Daño parcial", "ROBO TOTAL": "Robo total", "CRISTAL": "Cristal", "INCENDIO": "Incendio", "GRANIZO": "Granizo", "RC": "Resp. civil" };
// Color del motivo (para que se note de un vistazo, ej. Robo total en rojo)
const HECHO_COLOR = {
  "ROBO TOTAL":   { fg: "#C0241D", bg: "#FBE3E3" },
  "DAÑO PARCIAL": { fg: "#B45309", bg: "#FEF3E2" },
  "CRISTAL":      { fg: "#1D4ED8", bg: "#E8F0FE" },
  "INCENDIO":     { fg: "#C2410C", bg: "#FEECDC" },
  "GRANIZO":      { fg: "#0E7490", bg: "#E0F2FE" },
  "RC":           { fg: "#475569", bg: "#EEF1F4" },
};
const hechoColor = (h) => HECHO_COLOR[h] || { fg: "#475569", bg: "#EEF1F4" };

// Coberturas: solo el ramo AUTO usa este desplegable fijo.
// Para el resto de los ramos la cobertura es texto libre.
const COBERTURAS_AUTO = ["TERCEROS COMPLETOS", "TODO RIESGO", "RESPONSABILIDAD CIVIL"];
// Sugerencias (datalist) para ramos no-auto:
const COBERTURAS = ["M PLUS", "TR 2%", "TR 4%", "TR PORTATIL", "TC", "CRISTAL"];

// ¿El ramo usa el desplegable fijo de coberturas de auto?
function esRamoAuto(ramo) { return ramo === "AUTO"; }
// Coberturas disponibles según ramo (array si es auto, null si es texto libre).
function coberturasDe(ramo) { return esRamoAuto(ramo) ? COBERTURAS_AUTO : null; }
// La franquicia solo aplica a la cobertura TODO RIESGO (auto).
function aplicaFranquicia(cobertura) { return cobertura === "TODO RIESGO"; }

const STATIONS = ["PC_OFICINA_1", "PC_OFICINA_2"];

// Estado: solo dos, como en la planilla real
const ESTADOS = {
  "Abierto":   { key: "Abierto",   fg: "#1D4ED8", bg: "#E8F0FE", dot: "#2563EB" },
  "Terminado": { key: "Terminado", fg: "#15803D", bg: "#E6F4EA", dot: "#16A34A" },
};
const ESTADO_LIST = Object.keys(ESTADOS);

// Urgencia derivada de la fecha límite de respuesta (para los Abiertos)
const URGENCIA = {
  vencido:  { label: "Vencida",     fg: "#B91C1C", bg: "#FBE3E3", dot: "#DC2626" },
  hoy:      { label: "Vence hoy",   fg: "#B45309", bg: "#FEF3E2", dot: "#D97706" },
  proximo:  { label: "Próxima",     fg: "#1D4ED8", bg: "#E8F0FE", dot: "#2563EB" },
  normal:   { label: "En plazo",    fg: "#475569", bg: "#EEF1F4", dot: "#64748B" },
  ninguna:  { label: "—",           fg: "#94A3B8", bg: "#F1F3F5", dot: "#CBD5E1" },
};

// ---- helpers de fecha ----
const pad = (n) => String(n).padStart(2, "0");
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(iso) { if (!iso) return null; const d = new Date(iso + "T00:00:00"); return isNaN(d) ? null : d; }
function fmtDate(iso) { const d = parseDate(iso); if (!d) return "—"; return `${pad(d.getDate())} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(iso) { const d = parseDate(iso); if (!d) return "—"; return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; }
function daysUntil(iso) { const d = parseDate(iso); if (!d) return null; return Math.round((d - today0()) / 86400000); }

function urgenciaDe(item) {
  if (item.estado === "Terminado" || !item.fechaLimite) return "ninguna";
  const du = daysUntil(item.fechaLimite);
  if (du == null) return "ninguna";
  if (du < 0) return "vencido";
  if (du === 0) return "hoy";
  if (du <= 3) return "proximo";
  return "normal";
}
function venceTexto(iso) {
  const du = daysUntil(iso);
  if (du == null) return "—";
  if (du < 0) return `hace ${Math.abs(du)} d`;
  if (du === 0) return "hoy";
  if (du === 1) return "mañana";
  return `en ${du} d`;
}

function fmtTimeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.round(diff / 60000);
  if (m < 1) return "recién";
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}

// Días hábiles transcurridos entre dos fechas (no cuenta sábados ni domingos)
function diasHabilesEntre(desde, hasta) {
  const d0 = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate());
  const d1 = new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate());
  const corridos = Math.floor((d1 - d0) / 86400000);
  if (corridos <= 0) return 0;
  // Cada semana completa aporta 5 hábiles; el resto se cuenta día por día.
  const semanas = Math.floor(corridos / 7);
  let habiles = semanas * 5;
  const cursor = new Date(d0);
  cursor.setDate(cursor.getDate() + semanas * 7);
  for (let i = 0; i < corridos % 7; i++) {
    cursor.setDate(cursor.getDate() + 1);
    const dow = cursor.getDay();
    if (dow !== 0 && dow !== 6) habiles++;
  }
  return habiles;
}

// Días hábiles que lleva activo el siniestro: desde la denuncia (o el hecho / la carga)
function diasActivo(item) {
  let base = item.fechaDenuncia || item.fechaOcurrido || item.creado || item.ultimaModFecha;
  if (!base) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(base)) base = base + "T00:00:00";
  const d = new Date(base);
  if (isNaN(d)) return null;
  return diasHabilesEntre(d, new Date());
}

let _seq = 0;
const nextNum = () => { _seq += 1; return _seq; };
const sinId = (n) => "STR-" + pad(n) + "-" + Date.now().toString(36).slice(-4);

function nowIso() { return new Date().toISOString(); }
function recentIso(daysAgo, hh = 10, mm = 0) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo); d.setHours(hh, mm, 0, 0); return d.toISOString();
}

// ---- registros reales (Excel SEGUIMIENTO) ----
function buildSeed() {
  _seq = 0;
  const raw = [
  // DEMO: acá iban los siniestros reales del broker. Se vaciaron a propósito:
  // esta rama es pública y no puede contener datos de clientes. Los siniestros
  // de la demostración son inventados y salen de demo-db.js.
  ];
  return raw.map((r) => {
    const [estado, cliente, cia, ramo, hecho, cobertura, poliza, nroSiniestro, ocurrido, denuncia, limite, inspeccion, gestionAR, gestionReal, gestor, gestorEmail, obs, ticket, calendar, modAgo] = r;
    const n = nextNum();
    const gestiones = gestionReal && gestionReal.trim()
      ? [{ fecha: (denuncia || ocurrido || ""), texto: gestionReal, pc: STATIONS[n % 2] }]
      : [];
    return {
      id: sinId(n), n, estado, cliente, cia, ramo, hecho, cobertura,
      poliza, nroSiniestro,
      fechaOcurrido: ocurrido, fechaDenuncia: denuncia, fechaLimite: limite,
      fechaInspeccion: inspeccion,
      dominio: "", referencia: "",
      gestionAR, gestionReal, gestiones, gestor, gestorEmail, gestorTel: "", obs, ticket,
      franquiciaPct: "", franquiciaMonto: "", adjuntos: [],
      enCalendario: !!calendar,
      ultimaModPor: STATIONS[n % 2], ultimaModFecha: recentIso(modAgo, 9 + (n % 7), (n * 11) % 60),
      creado: denuncia ? denuncia + "T09:00:00" : recentIso(modAgo, 9, 0),
      eliminado: false,
    };
  });
}

Object.assign(window, {
  CIA_FULL, CIAS, ciaLabel, RAMOS, RAMO_LABEL, RAMO_ICON, HECHOS, HECHO_LABEL, HECHO_COLOR, hechoColor,
  COBERTURAS, COBERTURAS_AUTO, esRamoAuto, coberturasDe, aplicaFranquicia,
  STATIONS, ESTADOS, ESTADO_LIST, URGENCIA,
  fmtDate, fmtDateShort, fmtTimeAgo, daysUntil, urgenciaDe, venceTexto, diasActivo, nowIso,
  parseDate, today0, diasHabilesEntre, MESES,
  nextNum, sinId, buildSeed,
});
</script>
<script type="text/babel" data-file="auth.jsx">
// auth.jsx — Acceso al portal (Supabase Auth)
// Ingreso con contraseña, acceso por Magic Link y registro con email real.
// Los registros nuevos quedan PENDIENTES hasta que un organizador los apruebe.

function LoginScreen({ onSignIn }) {
  const [mode, setMode] = React.useState("login"); // login | signup
  const [nombre, setNombre] = React.useState("");
  const [email, setEmail] = React.useState("");
  const [pass, setPass] = React.useState("");
  const [err, setErr] = React.useState("");
  const [info, setInfo] = React.useState("");
  const [busy, setBusy] = React.useState(false);

  const switchMode = (m) => { setMode(m); setErr(""); setInfo(""); };

  const submit = async (e) => {
    if (e) e.preventDefault();
    setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        await onSignIn(email.trim(), pass);
        // App detecta la sesión y reemplaza esta pantalla
      } else {
        if (pass.length < 8) { setErr("La contraseña debe tener al menos 8 caracteres."); setBusy(false); return; }
        const data = await window.DB.auth.signUp(email.trim(), pass, nombre.trim());
        if (data && data.session) {
          setInfo("Cuenta creada. Un organizador debe aprobar tu acceso.");
        } else {
          setInfo("Cuenta creada. Confirmá tu email desde el link que te enviamos y esperá la aprobación de un organizador.");
        }
        setBusy(false);
      }
    } catch (ex) {
      console.error(ex);
      const m = String((ex && ex.message) || "");
      if (mode === "login") setErr("Email o contraseña incorrectos.");
      else if (m.includes("already registered")) setErr("Ese email ya tiene una cuenta. Probá ingresar.");
      else if (m.includes("rate limit")) setErr("Demasiados intentos de envío de email. Esperá unos minutos.");
      else setErr("No se pudo crear la cuenta. Revisá el email e intentá de nuevo.");
      setBusy(false);
    }
  };

  const canSubmit = mode === "signup" ? !!(email && pass && nombre) : !!(email && pass);

  return (
    <div className="login">
      <form className="login-card" onSubmit={submit}>
        <div className="login-logo"><img src={MARCA.logo} alt={MARCA.nombreCompleto} /></div>
        <h1 className="login-title">Portal de Siniestros</h1>
        <p className="login-sub">{mode === "signup" ? "Creá tu cuenta con tu email" : "Ingresá para continuar"}</p>

        <div className="login-tabs">
          <button type="button" className={"login-tab" + (mode === "login" ? " is-on" : "")} onClick={() => switchMode("login")}>Ingresar</button>
          <button type="button" className={"login-tab" + (mode === "signup" ? " is-on" : "")} onClick={() => switchMode("signup")}>Crear cuenta</button>
        </div>

        {mode === "signup" && (
          <label className="login-field">
            <span>Nombre y apellido</span>
            <input className="input" type="text" autoComplete="name" autoFocus
              value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Juan Pérez" />
          </label>
        )}
        <label className="login-field">
          <span>Email</span>
          <input className="input" type="email" autoComplete="username" autoFocus={mode !== "signup"}
            value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tu@email.com" />
        </label>
        <label className="login-field">
          <span>Contraseña</span>
          <input className="input" type="password" autoComplete={mode === "signup" ? "new-password" : "current-password"}
            value={pass} onChange={(e) => setPass(e.target.value)} placeholder={mode === "signup" ? "Mínimo 8 caracteres" : "••••••••"} />
        </label>

        {err && <div className="login-err">{err}</div>}
        {info && <div className="login-info">{info}</div>}

        <button className="btn-primary login-btn" type="submit" disabled={busy || !canSubmit}>
          {busy ? "Un momento…" : mode === "signup" ? "Crear cuenta" : "Ingresar"}

      </form>

  );
}

// Cuenta creada pero sin acceso todavía (pendiente de aprobación o suspendida)
function PendingScreen({ perfil, email, onLogout, onRefresh }) {
  const suspendida = perfil && perfil.estado === "suspendido";
  return (
    <div className="login">
      <div className="login-card">
        <div className="login-logo"><img src={MARCA.logo} alt={MARCA.nombreCompleto} /></div>

        <p className="login-sub" style={{ marginBottom: 14 }}>
          {suspendida
            ? "Tu usuario fue suspendido por un organizador. Si creés que es un error, contactá a la oficina."
            : "Tu cuenta ya está creada, pero un organizador tiene que habilitarla antes de que puedas ver el portal. Apenas te aprueben, entrás con este mismo email."}
        </p>
        <div className="login-info" style={{ marginBottom: 14 }}>{email}</div>
        {!suspendida && <button className="btn-primary login-btn" type="button" onClick={onRefresh}>Ya me aprobaron — reintentar</button>}
        <button className="btn-ghost" type="button" style={{ width: "100%", justifyContent: "center", marginTop: 8 }} onClick={onLogout}>
          <Ico name="logout" size={15} />Salir
        </button>
        <div className="login-foot">{MARCA.nombre} · {MARCA.bajada}</div>
      </div>
    </div>
  );
}

// Modal para que cada usuario cambie su propia contraseña
function ChangePassModal({ onClose, onDone }) {
  const [p1, setP1] = React.useState("");
  const [p2, setP2] = React.useState("");
  const [err, setErr] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const submit = async (e) => {
    if (e) e.preventDefault();
    setErr("");
    if (p1.length < 8) { setErr("La contraseña debe tener al menos 8 caracteres."); return; }
    if (p1 !== p2) { setErr("Las contraseñas no coinciden."); return; }
    setBusy(true);
    try { await window.DB.auth.updatePassword(p1); onDone(); }
    catch (ex) { console.error(ex); setErr("No se pudo cambiar la contraseña. Probá de nuevo."); setBusy(false); }
  };
  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <form className="modal modal-sm" onMouseDown={(e) => e.stopPropagation()} onSubmit={submit}>
        <div className="modal-head">
          <div><h2>Cambiar contraseña</h2><p>Elegí una nueva contraseña para tu usuario</p></div>
          <button type="button" className="btn-ghost tb-icon" onClick={onClose}><Ico name="close" size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="form-grid">
            <label className="field field-full">
              <span className="field-label">Nueva contraseña</span>
              <input className="input" type="password" autoComplete="new-password" autoFocus
                value={p1} onChange={(e) => setP1(e.target.value)} placeholder="Mínimo 8 caracteres" />
            </label>
            <label className="field field-full">
              <span className="field-label">Repetir contraseña</span>
              <input className="input" type="password" autoComplete="new-password"
                value={p2} onChange={(e) => setP2(e.target.value)} />
            </label>
            {err && <div className="login-err field-full">{err}</div>}
          </div>
        </div>
        <div className="modal-foot">
          <span className="foot-note"><Ico name="shield" size={14} /> Vale desde tu próximo ingreso</span>
          <div className="foot-btns">
            <button type="button" className="btn-ghost" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn-primary" disabled={busy || !p1 || !p2}>{busy ? "Guardando…" : "Guardar"}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

Object.assign(window, { LoginScreen, PendingScreen, ChangePassModal });

// ---------- claims table ----------
function ClaimsTable({ rows, selectedId, onSelect, onOpen, multi, onClientFilter }) {
  // Orden por columna: 1er clic asc, 2do desc, 3ro vuelve al orden por defecto
  const [sort, setSort] = React.useState(null);
  const sorted = React.useMemo(() => {
    if (!sort) return rows;
    const val = (r) => {
      switch (sort.key) {
        case "vence": return r.estado === "Terminado" ? "9999-12-31" : (r.fechaLimite || "9999-12-30");
        case "cliente": return (r.cliente || "").toLowerCase();
        case "cia": return ciaLabel(r.cia).toLowerCase();
        case "ramo": return ((RAMO_LABEL[r.ramo] || r.ramo || "") + " " + (r.hecho || "")).toLowerCase();
        case "estado": return r.estado + "-" + String(999999 - (diasActivo(r) || 0)).padStart(6, "0");
        case "nro": return r.nroSiniestro || "";
        default: return "";
      }
    };
    const arr = [...rows].sort((a, b) => { const x = val(a), y = val(b); return x < y ? -1 : x > y ? 1 : 0; });
    if (sort.dir === "desc") arr.reverse();
    return arr;
  }, [rows, sort]);
  const Th = ({ k, children }) => (
    <th className="th-sort" title="Clic para ordenar"
      onClick={() => setSort((s) => (s && s.key === k ? (s.dir === "asc" ? { key: k, dir: "desc" } : null) : { key: k, dir: "asc" }))}>
      {children}{sort && sort.key === k ? (sort.dir === "asc" ? " ▲" : " ▼") : ""}
    </th>
  );
  if (!rows.length) {
    return (
      <div className="empty">

                    )}

}
