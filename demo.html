<script type="text/babel" data-file="charts.jsx">
// charts.jsx — Saraceni Seguros · gráficos hechos a mano en SVG
// ─────────────────────────────────────────────────────────────────────────────
// El portal no tiene build ni dependencias, así que no se puede usar una
// librería de gráficos: cada uno es un <svg> dibujado acá. Todos escalan solos
// con viewBox, por eso se ven bien en el celular sin cálculos de ancho.
// Los usan Estadísticas de siniestros, Facturación y Objetivos.
// ─────────────────────────────────────────────────────────────────────────────

const CH_COLOR = {
  azul: "#2563EB", verde: "#16A34A", ambar: "#F59E0B", naranja: "#EA580C",
  rojo: "#DC2626", violeta: "#7C3AED", celeste: "#0891B2", gris: "#94A3B8",
};

// Escala "redonda" para el eje: elige un paso de 1/2/2,5/5 × 10ⁿ que cubra el máximo.
function chEje(max, divisiones = 4) {
  if (!(max > 0)) return { top: 1, steps: [0, 1] };
  const crudo = max / divisiones;
  const mag = Math.pow(10, Math.floor(Math.log10(crudo)));
  const norm = crudo / mag;
  const paso = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / paso) * paso;
  const steps = [];
  for (let v = 0; v <= top + paso / 1000; v += paso) steps.push(v);
  return { top, steps };
}

// Mide el ancho real del contenedor para dibujar el svg 1 unidad = 1 píxel.
// Si no, al escalar el viewBox las etiquetas del eje quedan ilegibles en las
// tarjetas angostas (la columna lateral del tablero mide la mitad que el panel).
function useAnchoCh(ref, fallback = 620) {
  const [ancho, setAncho] = React.useState(fallback);
  React.useLayoutEffect(() => {
    const nodo = ref.current;
    if (!nodo) return;
    const medir = () => { const a = nodo.clientWidth; if (a > 0) setAncho(a); };
    medir();
    if (typeof ResizeObserver !== "undefined") {
      const ro = new ResizeObserver(medir);
      ro.observe(nodo);
      return () => ro.disconnect();
    }
    window.addEventListener("resize", medir);
    return () => window.removeEventListener("resize", medir);
  }, [ref]);
  return ancho;
}

// Leyenda compartida (se dibuja fuera del svg para que el texto no se deforme)
function ChLeyenda({ series }) {
  return (
    <div className="ch-leyenda">
      {series.map((s) => (
        <span className="ch-leyenda-item" key={s.nombre}>
          <span className="ch-leyenda-dot" style={{ background: s.color }} />{s.nombre}
        </span>
      ))}
    </div>
  );
}

// ---------- barras verticales agrupadas ----------
// data: [{ label: "Ago 26", valores: [1000, 800] }]  ·  series: [{ nombre, color }]
// marcas: valor opcional por columna, se dibuja como línea punteada (ej: la meta).
function ChBarras({ data, series, fmtEje, fmtValor, marcas, alto = 250 }) {
  const caja = React.useRef(null);
  const W = Math.max(280, useAnchoCh(caja));
  const H = alto, padL = 58, padR = 12, padT = 12, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const valores = data.reduce((a, d) => a.concat(d.valores), []);
  const conMarcas = marcas ? valores.concat(marcas.filter((m) => m != null)) : valores;
  const eje = chEje(Math.max(0, ...conMarcas));
  const y = (v) => padT + plotH - (Math.max(0, v) / eje.top) * plotH;
  const gw = plotW / Math.max(1, data.length);
  const n = Math.max(1, series.length);
  const bw = Math.max(5, Math.min(22, (gw * 0.62 - (n - 1) * 4) / n));
  const fv = fmtValor || ((v) => v);

  return (
    <div className="ch-box" ref={caja}>
    <svg className="ch-svg" viewBox={`0 0 ${W} ${H}`} width={W} height={H} preserveAspectRatio="xMidYMid meet">
      {eje.steps.map((v) => (
        <g key={v}>
          <line className="ch-grid" x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} />
          <text className="ch-eje" x={padL - 9} y={y(v) + 4} textAnchor="end">{fmtEje ? fmtEje(v) : v}</text>
        </g>
      ))}
      {data.map((d, i) => {
        const cx = padL + gw * i + gw / 2;
        const ancho = n * bw + (n - 1) * 4;
        return (
          <g key={i}>
            {d.valores.map((v, j) => {
              const h = v > 0 ? Math.max(2, (v / eje.top) * plotH) : 0;
              return (
                <rect key={j} x={cx - ancho / 2 + j * (bw + 4)} y={padT + plotH - h}
                  width={bw} height={h} rx={3} fill={series[j] ? series[j].color : CH_COLOR.gris}>
                  <title>{d.label + " · " + (series[j] ? series[j].nombre : "") + ": " + fv(v)}</title>
                </rect>
              );
            })}
            {marcas && marcas[i] != null && (
              <line className="ch-marca" x1={cx - ancho / 2 - 4} x2={cx + ancho / 2 + 4} y1={y(marcas[i])} y2={y(marcas[i])}>
                <title>{"Meta: " + fv(marcas[i])}</title>
              </line>
            )}
            <text className="ch-eje" x={cx} y={H - 10} textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
      <line className="ch-base" x1={padL} x2={W - padR} y1={padT + plotH} y2={padT + plotH} />
    </svg>
    </div>
  );
}

// ---------- dona ----------
// items: [{ label, valor, color }]  ·  centro: { valor, label }
function ChDona({ items, size = 168, grosor = 26, centro }) {
  const total = items.reduce((s, i) => s + (Number(i.valor) || 0), 0);
  const r = (size - grosor) / 2;
  const C = 2 * Math.PI * r;
  let acum = 0;
  return (
    <svg className="ch-dona" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line-2)" strokeWidth={grosor} />
      {total > 0 && items.map((it, i) => {
        const frac = (Number(it.valor) || 0) / total;
        if (frac <= 0) return null;
        const el = (
          <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={it.color} strokeWidth={grosor}
            strokeDasharray={`${C * frac} ${C * (1 - frac)}`} strokeDashoffset={-C * acum}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}>
            <title>{it.label + ": " + Math.round(frac * 1000) / 10 + "%"}</title>
          </circle>
        );
        acum += frac;
        return el;
      })}
      {centro && (
        <>
          <text className="ch-dona-v" x={size / 2} y={size / 2 + 2} textAnchor="middle">{centro.valor}</text>
          <text className="ch-dona-l" x={size / 2} y={size / 2 + 20} textAnchor="middle">{centro.label}</text>
        </>
      )}
    </svg>
  );
}

// ---------- anillo de avance (objetivos) ----------
function ChAnillo({ pct, size = 68, grosor = 8, color, texto }) {
  const r = (size - grosor) / 2;
  const C = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  return (
    <svg className="ch-anillo" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line-2)" strokeWidth={grosor} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color || "var(--brand)"} strokeWidth={grosor}
        strokeLinecap="round" strokeDasharray={`${(C * p) / 100} ${C}`}
        transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      <text className="ch-anillo-t" x={size / 2} y={size / 2 + 5} textAnchor="middle"
        style={{ fontSize: size < 60 ? 14 : 16 }}>{texto != null ? texto : Math.round(p) + "%"}</text>
    </svg>
  );
}

// ---------- barras horizontales (ranking / promedios) ----------
// rows: [{ label, valor, texto, sub, color }]  — se dibuja con divs, no con svg,
// porque las etiquetas son largas y así se cortan solas en pantallas chicas.
function ChBarrasH({ rows, max, vacio }) {
  const tope = max != null ? max : Math.max(1, ...rows.map((r) => Number(r.valor) || 0));
  if (!rows.length) return <div className="ch-vacio">{vacio || "Sin datos en el período"}</div>;
  return (
    <div className="ch-hbars">
      {rows.map((r) => (
        <div className="ch-hbar" key={r.label}>
          <div className="ch-hbar-head">
            <span className="ch-hbar-label" title={r.label}>{r.label}</span>
            <span className="ch-hbar-valor mono">{r.texto != null ? r.texto : r.valor}</span>
          </div>
          <div className="ch-hbar-track">
            <span style={{ width: Math.max(2, ((Number(r.valor) || 0) / tope) * 100) + "%", background: r.color || CH_COLOR.azul }} />
          </div>
          {r.sub && <div className="ch-hbar-sub">{r.sub}</div>}
        </div>
      ))}
    </div>
  );
}

Object.assign(window, { CH_COLOR, chEje, useAnchoCh, ChLeyenda, ChBarras, ChDona, ChAnillo, ChBarrasH });
</script>
<script type="text/babel" data-file="estadisticas.jsx">
// estadisticas.jsx — Saraceni Seguros · Estadísticas de siniestros
// ─────────────────────────────────────────────────────────────────────────────
// Responde la pregunta de Hernán: cuánto demora un caso en promedio, abierto
// por ramo y por hecho (cristales, robo total, daño parcial…).
//
// Cómo se mide la demora (en días HÁBILES, igual que el resto del portal):
//   inicio = fecha de denuncia (si no hay, la del hecho; si no, la de carga)
//   cierre = para los Terminados, la última modificación del caso — es lo más
//            cercano a "cuándo se cerró" que guarda la tabla, porque no hay
//            columna de fecha de cierre. Los casos con fechas incoherentes
//            (cierre anterior al inicio) quedan afuera del promedio.
// Los Abiertos no promedian demora: se muestran aparte como antigüedad.
// ─────────────────────────────────────────────────────────────────────────────

function estInicio(s) {
  const f = s.fechaDenuncia || s.fechaOcurrido || s.creado || "";
  return String(f).slice(0, 10) || null;
}
function estCierre(s) {
  if (s.estado !== "Terminado") return null;
  const f = s.ultimaModFecha || s.creado || "";
  return String(f).slice(0, 10) || null;
}
// Días hábiles que tardó (cerrados) o que lleva abierto (abiertos). null si no se puede calcular.
function estDemora(s) {
  const ini = parseDate(estInicio(s));
  if (!ini) return null;
  const fin = s.estado === "Terminado" ? parseDate(estCierre(s)) : today0();
  if (!fin || fin < ini) return null;
  return diasHabilesEntre(ini, fin);
}
const estProm = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
function estMediana(arr) {
  if (!arr.length) return null;
  const a = [...arr].sort((x, y) => x - y);
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
const estDias = (v) => (v == null ? "—" : (Math.round(v * 10) / 10).toLocaleString("es-AR") + " d");
// Año de referencia: el cierre para los terminados, el inicio para los abiertos.
function estAnio(s) {
  const f = s.estado === "Terminado" ? estCierre(s) : estInicio(s);
  return f ? Number(f.slice(0, 4)) : null;
}

// Agrupa los cerrados por una clave y devuelve promedio, mediana y cantidad.
function estAgrupar(cerrados, claveDe) {
  const m = {};
  cerrados.forEach((s) => {
    const k = claveDe(s) || "—";
    (m[k] = m[k] || []).push(s._demora);
  });
  return Object.entries(m).map(([k, ds]) => ({
    clave: k, n: ds.length, prom: estProm(ds), mediana: estMediana(ds),
    min: Math.min(...ds), max: Math.max(...ds),
  })).sort((a, b) => b.prom - a.prom);
}

// ---------- tarjeta contenedora ----------
function EstCard({ title, sub, right, children, className }) {
  return (
    <section className={"est-card" + (className ? " " + className : "")}>
      <div className="est-card-head">
        <div>
          <h3>{title}</h3>
          {sub && <p>{sub}</p>}
        </div>
        {right}
      </div>
      {children}
    </section>
  );
}

// ---------- matriz ramo × hecho ----------
function EstMatriz({ cerrados }) {
  const ramos = Array.from(new Set(cerrados.map((s) => s.ramo || "—")));
  const hechos = Array.from(new Set(cerrados.map((s) => s.hecho || "—")));
  const celda = {};
  cerrados.forEach((s) => {
    const k = (s.ramo || "—") + "|" + (s.hecho || "—");
    (celda[k] = celda[k] || []).push(s._demora);
  });
  const proms = Object.values(celda).map((ds) => estProm(ds));
  const tope = Math.max(1, ...proms);
  if (!cerrados.length) return <div className="ch-vacio">Sin casos cerrados en el período</div>;
  return (
    <div className="table-wrap">
      <table className="table est-matriz">
        <thead>
          <tr>
            <th style={{ minWidth: 130 }}>Ramo</th>
            {hechos.map((h) => <th key={h} style={{ textAlign: "center" }}>{HECHO_LABEL[h] || h}</th>)}
            <th style={{ textAlign: "center" }}>Todos</th>
          </tr>
        </thead>
        <tbody>
          {ramos.map((r) => {
            const fila = cerrados.filter((s) => (s.ramo || "—") === r).map((s) => s._demora);
            return (
              <tr key={r}>
                <td><b>{RAMO_LABEL[r] || r}</b></td>
                {hechos.map((h) => {
                  const ds = celda[r + "|" + h];
                  if (!ds) return <td key={h} style={{ textAlign: "center" }}><span className="urg-none">—</span></td>;
                  const p = estProm(ds);
                  const alpha = 0.08 + (p / tope) * 0.42;
                  return (
                    <td key={h} style={{ textAlign: "center", background: `rgba(220,38,38,${alpha.toFixed(3)})` }}
                      title={ds.length + (ds.length === 1 ? " caso" : " casos")}>
                      <div className="mono est-celda">{estDias(p)}</div>
                      <div className="est-celda-n">{ds.length}</div>
                    </td>
                  );
                })}
                <td style={{ textAlign: "center", background: "var(--surface-2)" }}>
                  <div className="mono est-celda"><b>{estDias(estProm(fila))}</b></div>
                  <div className="est-celda-n">{fila.length}</div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ---------- pantalla ----------
function EstadisticasSiniestros({ data }) {
  const [anioF, setAnioF] = React.useState("Todos");

  const conDemora = React.useMemo(
    () => (data || []).map((s) => ({ ...s, _demora: estDemora(s), _anio: estAnio(s) })).filter((s) => s._demora != null),
    [data]);
  const anios = React.useMemo(
    () => Array.from(new Set(conDemora.map((s) => s._anio).filter(Boolean))).sort((a, b) => b - a),
    [conDemora]);
  const enPeriodo = React.useMemo(
    () => (anioF === "Todos" ? conDemora : conDemora.filter((s) => String(s._anio) === String(anioF))),
    [conDemora, anioF]);

  const cerrados = enPeriodo.filter((s) => s.estado === "Terminado");
  const abiertos = enPeriodo.filter((s) => s.estado !== "Terminado");
  const ds = cerrados.map((s) => s._demora);
  const prom = estProm(ds), med = estMediana(ds);
  const masLargo = cerrados.reduce((a, b) => (!a || b._demora > a._demora ? b : a), null);
  const masCorto = cerrados.reduce((a, b) => (!a || b._demora < a._demora ? b : a), null);
  const promAbiertos = estProm(abiertos.map((s) => s._demora));

  const porRamo = estAgrupar(cerrados, (s) => s.ramo);
  const porHecho = estAgrupar(cerrados, (s) => s.hecho);
  const porCia = estAgrupar(cerrados, (s) => s.cia);

  // cierres por mes de los últimos 12 meses con su demora promedio
  const evolucion = React.useMemo(() => {
    const hoy = new Date();
    const cols = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
      const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      const del = cerrados.filter((s) => (estCierre(s) || "").slice(0, 7) === key);
      cols.push({
        label: MESES[d.getMonth()].charAt(0).toUpperCase() + MESES[d.getMonth()].slice(1),
        valores: [estProm(del.map((x) => x._demora)) || 0],
        n: del.length,
      });
    }
    return cols;
  }, [cerrados]);

  const kpis = [
    { label: "Demora promedio", value: estDias(prom), hint: cerrados.length + (cerrados.length === 1 ? " caso cerrado" : " casos cerrados"), tone: { bg: "#E8F0FE", fg: "#1D4ED8" }, icon: "clock" },
    { label: "Mediana", value: estDias(med), hint: "la mitad tarda menos que esto", tone: { bg: "#E6F4EA", fg: "#15803D" }, icon: "target" },
    { label: "Caso más demorado", value: estDias(masLargo && masLargo._demora), hint: masLargo ? `${masLargo.cliente} · ${HECHO_LABEL[masLargo.hecho] || masLargo.hecho || "—"}` : "—", tone: { bg: "#FBE3E3", fg: "#C0241D" }, icon: "alert" },
    { label: "Abiertos hoy", value: abiertos.length, hint: "antigüedad promedio " + estDias(promAbiertos), tone: { bg: "#FEF3E2", fg: "#B45309" }, icon: "folder" },
  ];

  return (
    <div className="est-wrap">
      <div className="kpis">
        {kpis.map((c) => (
          <div className="kpi" key={c.label}>
            <span className="kpi-stripe" style={{ background: c.tone.fg }} />
            <div className="kpi-top"><span className="kpi-ico" style={{ background: c.tone.bg, color: c.tone.fg }}><Ico name={c.icon} size={17} /></span><span className="kpi-label">{c.label}</span></div>
            <div className="kpi-mid"><span className="kpi-value" style={{ fontSize: 24 }}>{c.value}</span></div>
            <div className="kpi-foot"><span className="kpi-hint">{c.hint}</span></div>
          </div>
        ))}
      </div>

      <div className="est-bar">
        <div className="est-bar-txt">
          <Ico name="info" size={15} />
          <span>Demora en <b>días hábiles</b>, desde la denuncia hasta el cierre del caso. El cierre se toma de la última modificación (la tabla no guarda fecha de cierre propia).</span>
        </div>
        <select className="select" value={anioF} onChange={(e) => setAnioF(e.target.value)}>
          <option value="Todos">Todos los años</option>
          {anios.map((a) => <option key={a} value={a}>{a}</option>)}
        </select>
      </div>

      <div className="est-grid">
        <EstCard title="Demora promedio por ramo" sub="ordenado de mayor a menor">
          <ChBarrasH rows={porRamo.map((g) => ({
            label: RAMO_LABEL[g.clave] || g.clave,
            valor: g.prom,
            texto: estDias(g.prom),
            sub: `${g.n} ${g.n === 1 ? "caso" : "casos"} · mediana ${estDias(g.mediana)} · del más rápido (${estDias(g.min)}) al más lento (${estDias(g.max)})`,
            color: CH_COLOR.azul,
          }))} vacio="Todavía no hay casos cerrados para promediar" />
        </EstCard>

        <EstCard title="Demora promedio por hecho" sub="cristales, robo total, daño parcial…">
          <ChBarrasH rows={porHecho.map((g) => ({
            label: HECHO_LABEL[g.clave] || g.clave,
            valor: g.prom,
            texto: estDias(g.prom),
            sub: `${g.n} ${g.n === 1 ? "caso" : "casos"} · mediana ${estDias(g.mediana)} · del más rápido (${estDias(g.min)}) al más lento (${estDias(g.max)})`,
            color: hechoColor(g.clave).fg,
          }))} vacio="Todavía no hay casos cerrados para promediar" />
        </EstCard>

        <EstCard title="Ramo × hecho" sub="promedio de días hábiles y cantidad de casos en cada cruce" className="est-card-wide">
          <EstMatriz cerrados={cerrados} />
        </EstCard>

        <EstCard title="Demora promedio por compañía" sub="cuánto tarda cada una en cerrar">
          <ChBarrasH rows={porCia.map((g) => ({
            label: ciaLabel(g.clave),
            valor: g.prom,
            texto: estDias(g.prom),
            sub: `${g.n} ${g.n === 1 ? "caso cerrado" : "casos cerrados"} · mediana ${estDias(g.mediana)}`,
            color: CH_COLOR.violeta,
          }))} vacio="Todavía no hay casos cerrados para promediar" />
        </EstCard>

        <EstCard title="Evolución de la demora" sub="promedio de los casos cerrados en cada mes (últimos 12)">
          <ChBarras data={evolucion} series={[{ nombre: "Días hábiles", color: CH_COLOR.celeste }]}
            fmtEje={(v) => Math.round(v) + " d"} fmtValor={(v) => estDias(v)} alto={230} />
          <div className="est-evol-pie">
            {evolucion.reduce((s, c) => s + c.n, 0)} casos cerrados en los últimos 12 meses
          </div>
        </EstCard>

        <EstCard title="Los que más tardaron" sub="para revisar qué los trabó" className="est-card-wide">
          {cerrados.length ? (
            <div className="table-wrap">
              <table className="table">
                <thead><tr><th>Cliente</th><th>Compañía</th><th>Ramo / Hecho</th><th>Denuncia</th><th>Cierre</th><th style={{ textAlign: "right" }}>Demora</th></tr></thead>
                <tbody>
                  {[...cerrados].sort((a, b) => b._demora - a._demora).slice(0, 8).map((s) => (
                    <tr key={s.id}>
                      <td><div className="cell-strong">{s.cliente}</div><div className="cell-sub mono">{s.nroSiniestro || s.id}</div></td>
                      <td><span className="cia-pill">{ciaLabel(s.cia)}</span></td>
                      <td><RamoTag ramo={s.ramo} hecho={s.hecho} /></td>
                      <td className="mono cell-sub">{fmtDateShort(estInicio(s))}</td>
                      <td className="mono cell-sub">{fmtDateShort(estCierre(s))}</td>
                      <td style={{ textAlign: "right" }}><b className="mono">{estDias(s._demora)}</b></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : <div className="ch-vacio">Sin casos cerrados en el período</div>}
        </EstCard>
      </div>
    </div>
  );
}

Object.assign(window, { EstadisticasSiniestros, estDemora, estInicio, estCierre });
</script>
<script type="text/babel" data-file="modals.jsx">
// modals.jsx — Saraceni Seguros · modales (modelo real)

function ModalShell({ title, sub, onClose, children, footer, wide }) {
  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  return (
    <div className="modal-scrim" onMouseDown={onClose}>
      <div className={"modal" + (wide ? " modal-wide" : "")} onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div><h2>{title}</h2>{sub && <p>{sub}</p>}</div>
          <button className="btn-ghost tb-icon" onClick={onClose}><Ico name="close" size={18} /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function Field({ label, children, required, full }) {
  return (
    <label className={"field" + (full ? " field-full" : "")}>
      <span className="field-label">{label}{required && <i> *</i>}</span>
      {children}
    </label>
  );
}
function FormSection({ label }) { return <div className="form-section">{label}</div>; }

// ---- Create / Edit ----
function ClaimFormModal({ mode, initial, station, onClose, onSubmit, usuarios }) {
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const byFecha = (a, b) => (a.fecha || "").localeCompare(b.fecha || "");
  const blank = {
    estado: "Abierto", cliente: "", dominio: "", referencia: "", cia: CIAS[0], ramo: "AUTO", hecho: HECHOS[0], cobertura: COBERTURAS_AUTO[0],
    poliza: "", nroSiniestro: "", fechaOcurrido: "", fechaDenuncia: "", fechaLimite: "", fechaInspeccion: "",
    gestionAR: "", gestionReal: "", gestiones: [], gestor: "", gestorEmail: "", gestorTel: "", obs: "", ticket: "",
    franquiciaPct: "", franquiciaMonto: "", adjuntos: [], enCalendario: false, asignadoA: null,
  };
  const [f, setF] = React.useState(() => {
    const base = initial ? { ...blank, ...initial } : blank;
    return { ...base, gestiones: [...(base.gestiones || [])].sort(byFecha), adjuntos: base.adjuntos || [] };
  });
  const [touched, setTouched] = React.useState(false);
  const [newGest, setNewGest] = React.useState({ fecha: todayISO(), texto: "" });
  const [subiendo, setSubiendo] = React.useState(false);
  const filesReady = !!(window.DB && window.DB.configured() && window.DB.files);
  const onPickFiles = async (e) => {
    const files = Array.from(e.target.files || []); e.target.value = "";
    if (!files.length || !filesReady) return;
    setSubiendo(true);
    for (const file of files) {
      try { const a = await window.DB.files.upload(file); setF((p) => ({ ...p, adjuntos: [...(p.adjuntos || []), a] })); }
      catch (err) { console.error(err); }
    }
    setSubiendo(false);
  };
  const removeAdjunto = async (a) => {
    setF((p) => ({ ...p, adjuntos: (p.adjuntos || []).filter((x) => x.path !== a.path) }));
    if (filesReady) { try { await window.DB.files.remove(a.path, a.bucket); } catch (err) { console.error(err); } }
  };
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  // Al cambiar el ramo ajustamos la cobertura (AUTO usa lista fija; el resto, texto libre)
  const setRamo = (ramo) => setF((p) => ({
    ...p, ramo,
    cobertura: esRamoAuto(ramo) ? (COBERTURAS_AUTO.includes(p.cobertura) ? p.cobertura : COBERTURAS_AUTO[0]) : "",
    franquiciaPct: esRamoAuto(ramo) ? p.franquiciaPct : "",
    franquiciaMonto: esRamoAuto(ramo) ? p.franquiciaMonto : "",
  }));
  // La franquicia solo aplica a TODO RIESGO
  const setCobertura = (cobertura) => setF((p) => ({
    ...p, cobertura,
    franquiciaPct: aplicaFranquicia(cobertura) ? p.franquiciaPct : "",
    franquiciaMonto: aplicaFranquicia(cobertura) ? p.franquiciaMonto : "",
  }));
  const addGestion = () => {
    const texto = (newGest.texto || "").trim();
    if (!texto) return;
    const entry = { fecha: newGest.fecha || todayISO(), texto, pc: station };
    setF((p) => ({ ...p, gestiones: [...(p.gestiones || []), entry].sort(byFecha) }));
    setNewGest({ fecha: todayISO(), texto: "" });
  };
  const removeGestion = (idx) => setF((p) => {
    const g = [...(p.gestiones || [])]; g.splice(idx, 1); return { ...p, gestiones: g };
  });
  // edición de una gestión existente
  const [editIdx, setEditIdx] = React.useState(null);
  const [editGest, setEditGest] = React.useState({ fecha: "", texto: "" });
  const startEdit = (i) => { const g = f.gestiones[i]; setEditIdx(i); setEditGest({ fecha: g.fecha || todayISO(), texto: g.texto || "" }); };
  const saveEdit = () => {
    const texto = (editGest.texto || "").trim();
    if (!texto) return;
    setF((p) => {
      const gs = [...(p.gestiones || [])];
      gs[editIdx] = { ...gs[editIdx], fecha: editGest.fecha || todayISO(), texto };
      return { ...p, gestiones: gs.sort(byFecha) };
    });
    setEditIdx(null);
  };
  // orden de visualización del historial (asc = más vieja primero)
  const [histDesc, setHistDesc] = React.useState(true); // por defecto, la última gestión arriba
  // Aviso de cambios sin guardar al cerrar (scrim, X, Escape o Cancelar)
  const snap0 = React.useRef(null);
  if (snap0.current === null) snap0.current = JSON.stringify(f);
  const hayCambios = () => JSON.stringify(f) !== snap0.current || !!newGest.texto.trim();
  const safeClose = () => {
    if (hayCambios() && !window.confirm("Tenés cambios sin guardar. ¿Cerrar sin guardar?")) return;
    onClose();
  };
  const valid = f.cliente.trim() && f.nroSiniestro.trim();
  // La última gestión del historial queda como "gestión realizada" (compatibilidad)
  const submit = () => {
    setTouched(true);
    if (!valid) return;
    const last = (f.gestiones || []).length ? f.gestiones[f.gestiones.length - 1].texto : f.gestionReal;
    onSubmit({ ...f, gestionReal: last || "" });
  };

  return (
    <ModalShell wide
      title={mode === "edit" ? "Editar siniestro" : "Registrar nuevo siniestro"}
      sub={mode === "edit" ? `${initial.id} · ${initial.cliente}` : "Cargá los datos del siniestro y la gestión"}
      onClose={safeClose}
      footer={
        <>
          <span className="foot-note"><Ico name="monitor" size={14} /> Se registrará como <b>{station}</b></span>
          <div className="foot-btns">
            <button className="btn-ghost" onClick={safeClose}>Cancelar</button>
            <button className="btn-primary" onClick={submit} disabled={!valid}>
              <Ico name="check" size={16} />{mode === "edit" ? "Guardar cambios" : "Registrar"}
            </button>
          </div>
        </>
      }>
      <FormSection label="Datos del siniestro" />
      <div className="form-grid">
        <Field label="Cliente" required full>
          <input className={"input" + (touched && !f.cliente.trim() ? " err" : "")} value={f.cliente}
            onChange={(e) => set("cliente", e.target.value)} placeholder="Nombre / razón social" />
        </Field>
        <Field label="Dominio / bien afectado">
          <input className="input mono" value={f.dominio} onChange={(e) => set("dominio", e.target.value.toUpperCase())}
            placeholder="Ej: AB123CD o Notebook Lenovo" />
        </Field>
        <Field label="Referencia del caso">
          <input className="input" value={f.referencia} onChange={(e) => set("referencia", e.target.value)}
            placeholder="Ej: Choque capó, Espejo lateral…" />
        </Field>
        <Field label="Compañía">
          <select className="input" value={f.cia} onChange={(e) => set("cia", e.target.value)}>
            {CIAS.map((c) => <option key={c} value={c}>{ciaLabel(c)}</option>)}
          </select>
        </Field>
        <Field label="Ramo">
          <select className="input" value={f.ramo} onChange={(e) => setRamo(e.target.value)}>
            {f.ramo && !RAMOS.includes(f.ramo) && <option value={f.ramo}>{RAMO_LABEL[f.ramo] || f.ramo}</option>}
            {RAMOS.map((r) => <option key={r} value={r}>{RAMO_LABEL[r]}</option>)}
          </select>
        </Field>
        <Field label="Hecho">
          <select className="input" value={f.hecho} onChange={(e) => set("hecho", e.target.value)}>
            {HECHOS.map((h) => <option key={h} value={h}>{HECHO_LABEL[h]}</option>)}
          </select>
        </Field>
        <Field label="Cobertura">
          {esRamoAuto(f.ramo) ? (
            <select className="input" value={f.cobertura} onChange={(e) => setCobertura(e.target.value)}>
              {f.cobertura && !COBERTURAS_AUTO.includes(f.cobertura) && <option value={f.cobertura}>{f.cobertura}</option>}
              {COBERTURAS_AUTO.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          ) : (
            <input className="input" list="cob-list" value={f.cobertura}
              onChange={(e) => set("cobertura", e.target.value)} placeholder="Cobertura" />
          )}
          <datalist id="cob-list">{COBERTURAS.map((c) => <option key={c} value={c} />)}</datalist>
        </Field>
        {esRamoAuto(f.ramo) && aplicaFranquicia(f.cobertura) && (
          <>
            <Field label="Franquicia (% de la suma asegurada)">
              <input className="input" inputMode="decimal" value={f.franquiciaPct}
                onChange={(e) => set("franquiciaPct", e.target.value)} placeholder="Ej: 10" />
            </Field>
            <Field label="Franquicia (monto en $)">
              <input className="input mono" inputMode="decimal" value={f.franquiciaMonto}
                onChange={(e) => set("franquiciaMonto", e.target.value)} placeholder="Ej: 500000" />
            </Field>
          </>
        )}
        <Field label="N° de póliza">
          <input className="input mono" value={f.poliza} onChange={(e) => set("poliza", e.target.value)} placeholder="000000000" />
        </Field>
        <Field label="N° de siniestro" required>
          <input className={"input mono" + (touched && !f.nroSiniestro.trim() ? " err" : "")} value={f.nroSiniestro}
            onChange={(e) => set("nroSiniestro", e.target.value)} placeholder="000000000000" />
        </Field>
      </div>

      <FormSection label="Fechas" />
      <div className="form-grid">
        <Field label="Ocurrido"><input className="input" type="date" value={f.fechaOcurrido} onChange={(e) => set("fechaOcurrido", e.target.value)} /></Field>
        <Field label="Denuncia"><input className="input" type="date" value={f.fechaDenuncia} onChange={(e) => set("fechaDenuncia", e.target.value)} /></Field>
        <Field label="Fecha límite de respuesta"><input className="input" type="date" value={f.fechaLimite} onChange={(e) => set("fechaLimite", e.target.value)} /></Field>
        <Field label="Inspección"><input className="input" type="date" value={f.fechaInspeccion} onChange={(e) => set("fechaInspeccion", e.target.value)} /></Field>
      </div>

      <FormSection label="Gestión" />
      <div className="form-grid">
        <Field label="Gestión a realizar (próximo paso)" full>
          <input className="input" value={f.gestionAR} onChange={(e) => set("gestionAR", e.target.value)} placeholder="Qué hay que hacer y cuándo" />
        </Field>
        <div className="field field-full">
          <div className="hist-head">
            <span className="field-label">Historial de gestiones realizadas</span>
            <span className="hist-count">{(f.gestiones || []).length}</span>
            {(f.gestiones || []).length > 1 && (
              <button type="button" className="hist-sort" onClick={() => setHistDesc((v) => !v)} title="Cambiar orden">
                {histDesc ? "↓ Más nueva primero" : "↑ Más vieja primero"}
              </button>
            )}
          </div>
          {(f.gestiones || []).length > 0 ? (
            <ul className="hist-list">
              {(histDesc ? f.gestiones.map((g, i) => ({ g, i })).reverse() : f.gestiones.map((g, i) => ({ g, i }))).map(({ g, i }) => (
                editIdx === i ? (
                  <li className="hist-item hist-item-edit" key={"e" + i}>
                    <input className="input hist-add-date" type="date" value={editGest.fecha}
                      onChange={(e) => setEditGest((p) => ({ ...p, fecha: e.target.value }))} />
                    <input className="input hist-add-text" value={editGest.texto} autoFocus
                      onChange={(e) => setEditGest((p) => ({ ...p, texto: e.target.value }))}
                      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); saveEdit(); } if (e.key === "Escape") { e.stopPropagation(); setEditIdx(null); } }} />
                    <button type="button" className="btn-primary hist-edit-btn" onClick={saveEdit} disabled={!editGest.texto.trim()} title="Guardar"><Ico name="check" size={14} /></button>
                    <button type="button" className="btn-ghost hist-edit-btn" onClick={() => setEditIdx(null)} title="Cancelar"><Ico name="close" size={14} /></button>
                  </li>
                ) : (
                  <li className="hist-item" key={i}>
                    <span className="hist-date mono">{fmtDateShort(g.fecha)}</span>
                    <span className="hist-text">{g.texto}</span>
                    <button type="button" className="hist-del" title="Editar" onClick={() => startEdit(i)}>
                      <Ico name="edit" size={13} />
                    </button>
                    <button type="button" className="hist-del" title="Quitar" onClick={() => removeGestion(i)}>
                      <Ico name="close" size={13} />
                    </button>
                  </li>
                )
              ))}
            </ul>
          ) : (
            <div className="hist-empty">Sin gestiones registradas todavía.</div>
          )}
          <div className="hist-add">

                <Ico name={a.tipo && a.tipo.indexOf("pdf") >= 0 ? "doc" : "doc"} size={15} />

}

        <Ico name={toast.err ? "alert" : "check"} size={15} />

  );
}

<script type="text/babel" data-file="detail.jsx">
// detail.jsx — Saraceni Seguros · pantalla completa de detalle de siniestro

function InfoRow({ k, v, mono }) {

// Exporta la FICHA COMPLETA del siniestro a PDF (datos + historial de gestiones)
function exportSiniestroPDF(item) {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const fd = (iso) => (iso ? esc(fmtDate(iso)) : "—");
  const kv = (pairs) => `<table class="kv">${pairs.map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td class="v">${v == null || v === "" ? "—" : esc(v)}</td></tr>`).join("")}</table>`;
  const dias = diasActivo(item);
  const inspeccion = item.fechaInspeccion ? fmtDate(item.fechaInspeccion) : "Pendiente";
  const franq = item.cobertura === "TODO RIESGO"
    ? [["Franquicia %", item.franquiciaPct ? item.franquiciaPct + "%" : "—"], ["Franquicia $", item.franquiciaMonto || "—"]] : [];
  const gs = [...(item.gestiones || [])].sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  const rows = gs.length
    ? gs.map((g) => `<tr><td class="d">${esc(fmtDate(g.fecha))}</td><td>${esc(g.texto)}</td><td class="pc">${esc(g.pc || "")}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">Sin gestiones registradas.</td></tr>`;
  const w = window.open("", "_blank");
  if (!w) { alert("Permití las ventanas emergentes para exportar el PDF."); return; }
  w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Siniestro ${esc(item.id)}</title>
  <style>
    *{font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
    body{margin:30px;color:#191C22}
    .brand{color:#DD0909;font-weight:800;letter-spacing:.14em;font-size:12px}
    h1{font-size:21px;margin:6px 0 2px}
    .sub{color:#5A6271;font-size:12px;margin-bottom:14px}
    .badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .bdg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border-radius:99px;padding:3px 10px;border:1px solid #E7E9ED}
    h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8B93A1;margin:16px 0 6px;border-bottom:1px solid #EFF1F4;padding-bottom:4px}
    .cols{display:flex;gap:24px}
    .cols>div{flex:1}
    table.kv{width:100%;border-collapse:collapse;font-size:12px}
    table.kv td{padding:5px 0;border-bottom:1px solid #F1F3F5;vertical-align:top}
    table.kv td.k{color:#8B93A1;width:42%}
    table.kv td.v{font-weight:600;text-align:right}
    p.obs{font-size:12px;color:#5A6271;line-height:1.5;margin:4px 0}
    table.hist{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
    table.hist th{text-align:left;background:#F5F6F8;border-bottom:1px solid #E7E9ED;padding:8px 10px;text-transform:uppercase;font-size:10px;letter-spacing:.05em;color:#8B93A1}
    table.hist td{padding:8px 10px;border-bottom:1px solid #EFF1F4;vertical-align:top}
    table.hist td.d{white-space:nowrap;font-weight:600;width:110px}
    table.hist td.pc{white-space:nowrap;color:#8B93A1;width:120px}
    table.hist td.empty{text-align:center;color:#8B93A1}
    .foot{margin-top:20px;font-size:10px;color:#8B93A1}
    @media print{body{margin:14mm}}
  </style></head><body>
    <div class="brand">${esc((MARCA.nombre + " · " + MARCA.bajada).toUpperCase())}</div>
    <h1>Ficha de siniestro — ${esc(item.cliente)}</h1>
    <div class="sub">N° ${esc(item.nroSiniestro)} · ${esc(item.id)}</div>
    <div class="badges">
      <span class="bdg" style="color:#1D4ED8;background:#E8F0FE">${esc(item.estado)}</span>
      <span class="bdg" style="color:#191C22;background:#F5F6F8">${esc(RAMO_LABEL[item.ramo] || item.ramo)}</span>
      <span class="bdg" style="color:#191C22;background:#F5F6F8">${esc(HECHO_LABEL[item.hecho] || item.hecho)}</span>
      ${dias != null ? `<span class="bdg" style="color:#5A6271;background:#F5F6F8">${dias} días hábiles</span>` : ""}
    </div>
    <div class="cols">
      <div>
        <h2>Póliza y cobertura</h2>
        ${kv([["Compañía", ciaLabel(item.cia)], ["Ramo", RAMO_LABEL[item.ramo] || item.ramo], ["Hecho", HECHO_LABEL[item.hecho] || item.hecho], ["Dominio / bien", item.dominio], ["Referencia", item.referencia], ["Cobertura", item.cobertura], ...franq, ["N° póliza", item.poliza], ["N° siniestro", item.nroSiniestro]])}
      </div>
      <div>
        <h2>Fechas</h2>
        ${kv([["Ocurrido", fd(item.fechaOcurrido)], ["Denuncia", fd(item.fechaDenuncia)], ["Límite respuesta", item.fechaLimite ? fmtDate(item.fechaLimite) : "—"], ["Inspección", inspeccion], ["Días hábiles activo", dias != null ? dias + " días hábiles" : "—"]])}
      </div>
    </div>
    <h2>Gestión</h2>
    ${kv([["Próxima gestión a realizar", item.gestionAR], ["Gestor", item.gestor], ["Contacto", item.gestorEmail], ["Teléfono", item.gestorTel]])}
    <h2>Observaciones</h2>
    <p class="obs">${esc(item.obs || "Sin observaciones.")}</p>
    ${item.ticket ? `<p class="obs">Ticket: ${esc(item.ticket)}</p>` : ""}

    <table class="hist"><thead><tr><th>Fecha</th><th>Gestión realizada</th><th>Puesto</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot">Generado el ${new Date().toLocaleString("es-AR")} desde el Portal de gestiones de ${esc(MARCA.nombre)} · Última modificación por ${esc(item.ultimaModPor || "—")}.</div>
  </body></html>`);
  w.document.close(); w.focus();
  setTimeout(() => { try { w.print(); } catch (e) { /* noop */ } }, 350);
}

function DetailScreen({ item, onBack, onEdit, onDelete, onGcal, onIcs, onTerminar, onQuickGestion }) {

  // gestión rápida (sin abrir el editor)
  const hoyISO = () => new Date().toISOString().slice(0, 10);
  const [qg, setQg] = React.useState({ fecha: hoyISO(), texto: "" });
  const [histDesc, setHistDesc] = React.useState(true); // por defecto, la última gestión arriba
  const addQuick = () => {
    const texto = qg.texto.trim();
    if (!texto || !onQuickGestion) return;
    onQuickGestion(item, { fecha: qg.fecha || hoyISO(), texto });
    setQg({ fecha: hoyISO(), texto: "" });
  };
  const [adjUrls, setAdjUrls] = React.useState({});
  React.useEffect(() => {
    let alive = true;
    (async () => {
      if (!window.DB || !window.DB.files || !adjuntos.length) return;
      const map = {};
      for (const a of adjuntos) { try { map[a.path] = await window.DB.files.signedUrl(a.path, 3600, a.bucket); } catch (e) { /* noop */ } }
      if (alive) setAdjUrls(map);

    return () => { alive = false; };

            {item.enCalendario && <span className="dt-cal"><Ico name="agenda" size={13} />En calendario</span>}

          <div className="ds-action-info">
            <div className="ds-action-k"><Ico name="arrowR" size={15} />Próxima gestión a realizar</div>
            <div className="ds-action-v">{item.gestionAR || "—"}</div>

          {item.ticket && (

              <Ico name="link" size={14} />Abrir ticket de la compañía
            </a>
          )}

        <section className="ds-card ds-card-wide">
          <div className="ds-card-title" style={{ justifyContent: "space-between" }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><Ico name="check" size={15} />Historial de gestiones realizadas</span>
            <span style={{ display: "inline-flex", gap: 8 }}>
              {(item.gestiones || []).length > 1 && (
                <button className="btn-ghost sm" onClick={() => setHistDesc((v) => !v)} title="Cambiar orden">

                </button>
              )}
              <button className="btn-ghost sm" onClick={() => exportSiniestroPDF(item)} title="Exportar ficha completa a PDF"><Ico name="download" size={14} />Exportar ficha (PDF)</button>
            </span>
          </div>
          {(item.gestiones && item.gestiones.length) ? (
            <ul className="hist-tl">
              {(histDesc
                ? [...item.gestiones].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""))
                : [...item.gestiones].sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""))
              ).map((g, i) => (
                <li className="hist-tl-item" key={i}>
                  <span className="hist-tl-dot" />
                  <div className="hist-tl-body">
                    <span className="hist-tl-date mono">{fmtDate(g.fecha)}</span>
                    <p className="hist-tl-text">{g.texto}</p>
                  </div>
                </li>
              ))}
            </ul>
          ) : (
            <p className="ds-obs">Sin gestiones registradas todavía.</p>
          )}
          {abierto && onQuickGestion && (
            <div className="hist-add" style={{ marginTop: 14 }}>
              <input className="input hist-add-date" type="date" value={qg.fecha}
                onChange={(e) => setQg((p) => ({ ...p, fecha: e.target.value }))} />
              <input className="input hist-add-text" value={qg.texto}
                onChange={(e) => setQg((p) => ({ ...p, texto: e.target.value }))}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addQuick(); } }}
                placeholder="Registrar una gestión ahora…" />
              <button type="button" className="btn-ghost hist-add-btn" onClick={addQuick} disabled={!qg.texto.trim()}>
                <Ico name="plus" size={15} />Agregar gestión
              </button>
            </div>
          )}
        </section>

        {adjuntos.length > 0 && (
          <section className="ds-card ds-card-wide">
            <div className="ds-card-title"><Ico name="doc" size={15} />Adjuntos <span className="ds-adj-count">{adjuntos.length}</span></div>
            <div className="adj-grid">
              {adjuntos.map((a, i) => {
                const url = adjUrls[a.path];
                const isImg = a.tipo && a.tipo.indexOf("image") >= 0;
                return (
                  <a className="adj-card" key={a.path || i} href={url || "#"} target="_blank" rel="noreferrer"
                    onClick={(e) => { if (!url) e.preventDefault(); }}>
                    {isImg && url
                      ? <img className="adj-thumb" src={url} alt={a.name} />
                      : <span className="adj-thumb adj-thumb-file"><Ico name="doc" size={24} /></span>}
                    <span className="adj-card-name" title={a.name}>{a.name}</span>
                  </a>
                );
              })}
            </div>
          </section>
        )}
      </div>

      <div className="ds-stamp">
        Última modificación {fmtTimeAgo(item.ultimaModFecha)} · registrado desde <span className="mono">{item.ultimaModPor}</span>
      </div>
    </div>
  );
}

Object.assign(window, { DetailScreen });
</script>
<script type="text/babel" data-file="solicitudes.jsx">
// solicitudes.jsx — Saraceni Seguros · Bandeja de solicitudes públicas de siniestro
// Los asegurados cargan sus denuncias en /denuncia (sin login); acá se reciben,
// se revisan y se convierten en siniestros reales con un clic.

// Tipos de siniestro que puede elegir el asegurado en /denuncia, y a qué
// "hecho" del portal corresponde cada uno al convertir la solicitud.
const TIPO_SOL_LABEL = {
  CHOQUE: "Choque / daños con otro vehículo", DANIO_PROPIO: "Daño propio (sin terceros)",
  CRISTALES: "Cristales", ROBO_RUEDAS: "Robo de ruedas", ROBO_TOTAL: "Robo total",
  GRANIZO: "Granizo", INCENDIO: "Incendio", ROBO: "Robo", AGUA: "Daños por agua",
  ELECTRICO: "Daños eléctricos", RC: "Daños a terceros",
};
const TIPO_SOL_HECHO = {
  CHOQUE: "DAÑO PARCIAL", DANIO_PROPIO: "DAÑO PARCIAL", CRISTALES: "CRISTAL",
  ROBO_RUEDAS: "DAÑO PARCIAL", ROBO_TOTAL: "ROBO TOTAL", GRANIZO: "GRANIZO",
  INCENDIO: "INCENDIO", ROBO: "ROBO TOTAL", AGUA: "DAÑO PARCIAL",
  ELECTRICO: "DAÑO PARCIAL", RC: "RC",
};

const SOL_ESTADO = {
  "nueva":      { fg: "#B91C1C", bg: "#FBE3E3", t: "Nueva" },
  "procesada":  { fg: "#15803D", bg: "#E6F4EA", t: "Procesada" },
  "descartada": { fg: "#475569", bg: "#EEF1F4", t: "Descartada" },
};
function solBadge(estado) {
  const c = SOL_ESTADO[estado] || SOL_ESTADO.nueva;
  return <span className="badge" style={{ background: c.bg, color: c.fg, fontSize: 12 }}><span className="badge-dot" style={{ background: c.fg }} />{c.t}</span>;
}

function SolCard({ s, onConvertir, onDescartar, onReabrir }) {
  const [urls, setUrls] = React.useState({});
  React.useEffect(() => {
    let alive = true;
    (async () => {
      if (!window.DB || !window.DB.files || !(s.adjuntos || []).length) return;
      const m = {};
      for (const a of s.adjuntos) { try { m[a.path] = await window.DB.files.signedUrl(a.path, 3600, "solicitudes"); } catch (e) { /* noop */ } }
      if (alive) setUrls(m);
    })();
    return () => { alive = false; };
  }, [s._dbId]);

  const nueva = s.estado === "nueva";
  const D = ({ k, v, mono }) => (v ? <div><div className="sol-k">{k}</div><div className={"sol-v" + (mono ? " mono" : "")}>{v}</div></div> : null);
  return (
    <div className={"sol-card" + (nueva ? " nueva" : "")}>
      <div className="sol-head">
        <div>
          <div className="sol-name">{s.nombre}</div>
          <div className="sol-meta mono">{s.id} · ref {s.ref}{s.creado ? " · recibida " + fmtTimeAgo(s.creado) : ""}</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {solBadge(s.estado)}
          {s.estado === "procesada" && s.siniestroCodigo && <span className="cia-pill sm mono">→ {s.siniestroCodigo}</span>}
        </div>
      </div>

      <div className="sol-sub">Asegurado</div>
      <div className="sol-grid-datos">
        <D k="DNI / CUIT" v={s.dniCuit} mono />
        <D k="Patente" v={s.dominio} mono />
        <D k="Compañía" v={s.cia} />
        <D k="N° de póliza" v={s.poliza} mono />
        <D k="Teléfono" v={s.telefono} mono />
        <D k="Email" v={s.email} />
      </div>

      {(s.terceroNombre || s.terceroDni || s.terceroDominio || s.terceroCia || s.terceroPoliza) && (
        <>
          <div className="sol-sub">Tercero</div>
          <div className="sol-grid-datos">
            <D k="Nombre" v={s.terceroNombre} />
            <D k="DNI / CUIT" v={s.terceroDni} mono />
            <D k="Celular" v={s.terceroCelular} mono />
            <D k="Patente" v={s.terceroDominio} mono />
            <D k="Compañía" v={s.terceroCia} />
            <D k="N° de póliza" v={s.terceroPoliza} mono />
          </div>
        </>
      )}

      <div className="sol-sub">Siniestro</div>
      <div className="sol-grid-datos">
        <D k="Ramo" v={s.ramo ? (RAMO_LABEL[s.ramo] || s.ramo) : ""} />
        <D k="Qué pasó" v={s.tipoSiniestro ? (TIPO_SOL_LABEL[s.tipoSiniestro] || s.tipoSiniestro) : ""} />
        <D k="Fecha" v={s.fechaHecho ? fmtDate(s.fechaHecho) : ""} />
        <D k="Hora" v={s.horaHecho} mono />
        <D k="Ubicación" v={s.ubicacion} />
        <D k="Localidad" v={s.localidad} />
        {s.lesionados && (
          <div>
            <div className="sol-k">¿Lesionados?</div>
            <div className="sol-v" style={s.lesionados === "SI" ? { color: "#C0241D", fontWeight: 800 } : null}>
              {s.lesionados === "SI" ? "⚠ SÍ" : "No"}
            </div>
          </div>
        )}
      </div>

      {s.relato && <div className="sol-relato">{s.relato}</div>}

      {(s.adjuntos || []).length > 0 && (
        <div className="adj-grid" style={{ marginTop: 10 }}>
          {s.adjuntos.map((a, i) => {
            const url = urls[a.path];
            const isImg = a.tipo && a.tipo.indexOf("image") >= 0;
            return (
              <a className="adj-card" key={a.path || i} href={url || "#"} target="_blank" rel="noreferrer"
                onClick={(e) => { if (!url) e.preventDefault(); }}>
                {isImg && url
                  ? <img className="adj-thumb" src={url} alt={a.name} />
                  : <span className="adj-thumb adj-thumb-file"><Ico name="doc" size={24} /></span>}
                {/* si vino de un marco, mostramos qué foto es en vez del nombre del archivo */}
                <span className="adj-card-name" title={a.etiqueta ? a.etiqueta + " — " + a.name : a.name}>
                  {a.etiqueta || a.name}
                </span>
              </a>
            );
          })}
        </div>
      )}

      <div className="sol-actions">
        {nueva ? (
          <>
            <button className="btn-primary" onClick={() => onConvertir(s)}><Ico name="plus" size={16} />Crear siniestro</button>
            <button className="btn-ghost danger" onClick={() => onDescartar(s)}><Ico name="close" size={15} />Descartar</button>
          </>
        ) : (
          s.estado === "descartada" && <button className="btn-ghost sm" onClick={() => onReabrir(s)}><Ico name="refresh" size={14} />Reabrir</button>
        )}
      </div>
    </div>
  );
}

function SolicitudesView({ solicitudes, onConvertir, onDescartar, onReabrir }) {
  const [verHist, setVerHist] = React.useState(false);
  const nuevas = solicitudes.filter((s) => s.estado === "nueva");
  const resto = solicitudes.filter((s) => s.estado !== "nueva");
  // Abierto como archivo suelto (file://) el origin es "null": mostramos un
  // ejemplo en vez de un link roto.
  const baseLink = (window.location.origin && window.location.origin !== "null") ? window.location.origin : "https://tu-portal.com.ar";
  const linkPublico = baseLink + "/denuncia";
  const copiarLink = () => {
    try { navigator.clipboard.writeText(linkPublico); } catch (e) { /* noop */ }
  };
  return (
    <div className="sol-wrap">
      <div className="ag-banner">
        <span className="ag-banner-ico" style={{ background: "#fdecec", color: "var(--brand)" }}><Ico name="mail" size={22} /></span>
        <div className="ag-banner-txt">
          <span className="ag-banner-title">Denuncias online de asegurados</span>
          <span className="ag-banner-sub">Compartí este link con tus clientes: <b className="mono">{linkPublico}</b></span>
        </div>
        <button className="btn-ghost" style={{ marginLeft: "auto" }} onClick={copiarLink}><Ico name="link" size={15} />Copiar link</button>
      </div>

      {nuevas.length > 0 ? (
        <div className="sol-grid">
          {nuevas.map((s) => <SolCard key={s._dbId} s={s} onConvertir={onConvertir} onDescartar={onDescartar} onReabrir={onReabrir} />)}
        </div>
      ) : (
        <div className="empty"><div className="empty-ico"><Ico name="mail" size={26} /></div>
          <div className="empty-title">Sin solicitudes nuevas</div>
          <div className="empty-sub">Cuando un asegurado cargue una denuncia en el link público, aparece acá al instante.</div></div>
      )}

      {resto.length > 0 && (
        <div style={{ marginTop: 22 }}>
          <button className="btn-ghost sm" onClick={() => setVerHist((v) => !v)}>
            <Ico name={verHist ? "chevL" : "chevR"} size={14} />{verHist ? "Ocultar procesadas" : `Ver procesadas y descartadas (${resto.length})`}
          </button>
          {verHist && (
            <div className="sol-grid" style={{ marginTop: 12 }}>
              {resto.map((s) => <SolCard key={s._dbId} s={s} onConvertir={onConvertir} onDescartar={onDescartar} onReabrir={onReabrir} />)}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { SolicitudesView, TIPO_SOL_LABEL, TIPO_SOL_HECHO });
</script>
<script type="text/babel" data-file="usuarios.jsx">
// usuarios.jsx — Saraceni Seguros · Administración de usuarios y roles (solo organizador)
// + Campana de notificaciones in-app (todos los usuarios activos)

const ROL_LABEL = { organizador: "Organizador", empleado: "Empleado" };
const USR_ESTADO = {
  activo:     { fg: "#15803D", bg: "#E6F4EA", t: "Activo" },
  pendiente:  { fg: "#B45309", bg: "#FDF1DC", t: "Pendiente" },
  suspendido: { fg: "#B91C1C", bg: "#FBE3E3", t: "Suspendido" },
};

function UsuariosView({ perfiles, me, onUpdate }) {
  const [busyId, setBusyId] = React.useState(null);
  const act = async (id, patch) => {
    setBusyId(id);
    try { await onUpdate(id, patch); } finally { setBusyId(null); }

  const pendientes = perfiles.filter((p) => p.estado === "pendiente");

  const Fila = ({ p }) => {

    return (
      <tr>

          {esYo ? <span className="cia-pill">{ROL_LABEL[p.rol]}</span> : (

        <td className="cell-sub">{p.creado ? fmtDate(p.creado.slice(0, 10)) : "—"}</td>
        <td>
          {!esYo && (
            <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
              {p.estado === "pendiente" && <button className="btn-primary sm" disabled={busy} onClick={() => act(p.id, { estado: "activo" })}><Ico name="check" size={14} />Aprobar</button>}
              {p.estado === "activo" && <button className="btn-ghost danger sm" disabled={busy} onClick={() => { if (window.confirm(`¿Suspender el acceso de ${p.nombre || p.email}?`)) act(p.id, { estado: "suspendido" }); }}>Suspender</button>}
              {p.estado === "suspendido" && <button className="btn-ghost sm" disabled={busy} onClick={() => act(p.id, { estado: "activo" })}><Ico name="refresh" size={13} />Reactivar</button>}
            </div>
          )}
        </td>
      </tr>
    );
  };

  return (
    <div>
      <div className="ag-banner">
        <span className="ag-banner-ico" style={{ background: "#fdecec", color: "var(--brand)" }}><Ico name="user" size={22} /></span>
        <div className="ag-banner-txt">
          <span className="ag-banner-title">Usuarios del portal</span>
          <span className="ag-banner-sub">

          <div className="table-wrap">
            <table className="table">
              <thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Alta</th><th></th></tr></thead>
              <tbody>{pendientes.map((p) => <Fila key={p.id} p={p} />)}</tbody>
            </table>
          </div>

      )}

      <div className="panel">
        <div className="toolbar"><div className="toolbar-left"><span className="toolbar-title">Todos los usuarios</span><span className="toolbar-count">{resto.length}</span></div></div>
        <div className="table-wrap">
          <table className="table">
            <thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Alta</th><th></th></tr></thead>
            <tbody>{resto.map((p) => <Fila key={p.id} p={p} />)}</tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------- campana de notificaciones (topbar) ----------
const NOTIF_ICON = { asignacion: "user", vencimiento: "alert", solicitud: "mail", cotizacion: "home", sistema: "info" };
function NotifBell({ notifs, onOpenNotif, onMarkAll }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const unread = notifs.filter((n) => !n.leida).length;
  React.useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [open]);
  return (
    <div className="notif-wrap" ref={ref}>
      <button className="btn-ghost tb-icon notif-btn" title="Notificaciones" onClick={() => setOpen((v) => !v)}>
        <Ico name="bell" size={18} />
        {unread > 0 && <span className="notif-badge">{unread > 9 ? "9+" : unread}</span>}
      </button>
      {open && (
        <div className="notif-panel">
          <div className="notif-head">
            <span>Notificaciones</span>
            {unread > 0 && <button className="notif-clear" onClick={onMarkAll}>Marcar todas leídas</button>}
          </div>
          <div className="notif-list">
            {notifs.length === 0 && <div className="notif-empty">Sin notificaciones por ahora.</div>}
            {notifs.slice(0, 30).map((n) => (
              <button key={n._dbId} className={"notif-item" + (n.leida ? "" : " unread")}
                onClick={() => { setOpen(false); onOpenNotif(n); }}>
                <span className={"notif-ico notif-" + n.tipo}><Ico name={NOTIF_ICON[n.tipo] || "info"} size={15} /></span>
                <span className="notif-txt">
                  <span className="notif-title">{n.titulo}</span>
                  {n.cuerpo && <span className="notif-body">{n.cuerpo}</span>}
                  <span className="notif-meta">{n.referencia && <b className="mono">{n.referencia}</b>}{n.referencia && n.creado ? " · " : ""}{n.creado ? fmtTimeAgo(n.creado) : ""}</span>
                </span>
                {!n.leida && <span className="notif-dot" />}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { UsuariosView, NotifBell });
</script>
<script type="text/babel" data-file="facturas.jsx">
// facturas.jsx — Saraceni Seguros · Facturación
// ─────────────────────────────────────────────────────────────────────────────
// Reestructurado sobre dos tablas: `fact_companias` guarda lo que nunca cambia
// (razón social, CUIT, tipo, envío) y `fact_mensual` solo los importes de cada
// mes. La pantalla principal es la CARGA MENSUAL: se elige el período y se
// completa una fila por compañía, sin volver a escribir los datos fijos.
// ─────────────────────────────────────────────────────────────────────────────

const MESES_F = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const MESES_CORTO = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

const money0 = (v) => (v == null || v === "" ? "—" : "$ " + Math.round(Number(v)).toLocaleString("es-AR"));
const moneyK = (v) => {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (Math.abs(n) >= 1000000) return "$" + (n / 1000000).toFixed(1).replace(".", ",") + "M";
  if (Math.abs(n) >= 1000) return "$" + Math.round(n / 1000) + "k";
  return "$" + Math.round(n);
};
// "1.234.567,89" o "1234567.89" → 1234567.89
const parseMonto = (v) => {
  if (v === "" || v == null) return null;
  let s = String(v).trim().replace(/[$\s]/g, "");
  if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s);
  return isNaN(n) ? null : n;
};
const IVA_PCT = 0.21;

// ============================ CARGA MENSUAL ============================
// Una fila por compañía: se ven los datos fijos y se completan los del mes.
function CargaMensual({ companias, movs, anio, mes, onAnio, onMes, onGuardar, onGuardarTodo, station }) {
  const hoy = new Date();
  const [edit, setEdit] = React.useState({});     // { companiaId: {campo: valor} }
  const [guardando, setGuardando] = React.useState(null);

  // lo cargado en la base para este período, indexado por compañía
  const delMes = React.useMemo(() => {
    const m = {};
    movs.filter((x) => x.anio === anio && x.mes === mes).forEach((x) => { m[x.companiaId] = x; });
    return m;
  }, [movs, anio, mes]);

  React.useEffect(() => { setEdit({}); }, [anio, mes]);

  const valorDe = (c, campo) => {
    const e = edit[c.id];
    if (e && e[campo] !== undefined) return e[campo];
    const g = delMes[c.id];
    if (!g) return "";
    const v = g[campo];
    return v == null ? "" : v;
  };
  const setCampo = (c, campo, valor) => {
    setEdit((p) => {
      const fila = { ...(p[c.id] || {}), [campo]: valor };
      // al cargar el neto calculamos IVA y total (para tipo A); el usuario puede corregirlos
      if (campo === "neto" && c.tipo === "A") {
        const neto = parseMonto(valor);
        if (neto != null) {
          fila.iva = (neto * IVA_PCT).toFixed(2);
          fila.total = (neto * (1 + IVA_PCT)).toFixed(2);
        }
      }
      if (campo === "neto" && c.tipo !== "A") {
        const neto = parseMonto(valor);
        if (neto != null) fila.total = String(neto);
      }
      return { ...p, [c.id]: fila };
    });
  };
  const filaSucia = (c) => !!edit[c.id] && Object.keys(edit[c.id]).length > 0;

  const guardarFila = async (c) => {
    const e = edit[c.id] || {};
    const g = delMes[c.id] || {};
    const item = {
      _dbId: g._dbId, companiaId: c.id, anio, mes,
      fecha: e.fecha !== undefined ? e.fecha : (g.fecha || ""),
      nroFactura: e.nroFactura !== undefined ? e.nroFactura : (g.nroFactura || ""),
      neto: parseMonto(e.neto !== undefined ? e.neto : g.neto),
      iva: parseMonto(e.iva !== undefined ? e.iva : g.iva),
      total: parseMonto(e.total !== undefined ? e.total : g.total),
      enviado: e.enviado !== undefined ? e.enviado : !!g.enviado,
      pago: parseMonto(e.pago !== undefined ? e.pago : g.pago),
      observaciones: e.observaciones !== undefined ? e.observaciones : (g.observaciones || ""),
      ultimaModPor: station,
    };
    setGuardando(c.id);
    await onGuardar(item);
    setEdit((p) => { const q = { ...p }; delete q[c.id]; return q; });
    setGuardando(null);
  };

  const guardarTodo = async () => {
    const pendientes = companias.filter(filaSucia);
    if (!pendientes.length) return;
    setGuardando("todo");
    for (const c of pendientes) await guardarFila(c);
    setGuardando(null);
  };

  const sucias = companias.filter(filaSucia).length;
  const cargadas = companias.filter((c) => delMes[c.id] && delMes[c.id].total != null).length;
  const totalMes = companias.reduce((s, c) => {
    const v = parseMonto(valorDe(c, "total"));
    return s + (v || 0);
  }, 0);
  const cobradoMes = companias.reduce((s, c) => {
    const v = parseMonto(valorDe(c, "pago"));
    return s + (v || 0);
  }, 0);
  const anios = [];
  for (let a = hoy.getFullYear() + 1; a >= 2025; a--) anios.push(a);

  return (
    <div>
      {/* selector de período */}
      <div className="fact-periodo">
        <div className="fact-periodo-sel">
          <span className="fact-periodo-label">Período</span>
          <div className="fact-mes-pills">
            {MESES_CORTO.map((m, i) => (
              <button key={m} className={"fact-mes-pill" + (mes === i + 1 ? " on" : "")} onClick={() => onMes(i + 1)}>{m}</button>
            ))}
          </div>
          <select className="select" value={anio} onChange={(e) => onAnio(Number(e.target.value))}>
            {anios.map((a) => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        <div className="fact-periodo-res">
          <div><span className="fact-res-k">Facturado</span><span className="fact-res-v">{money0(totalMes)}</span></div>
          <div><span className="fact-res-k">Cobrado</span><span className="fact-res-v">{money0(cobradoMes)}</span></div>
          <div><span className="fact-res-k">Cargadas</span><span className="fact-res-v">{cargadas}/{companias.length}</span></div>
        </div>
      </div>

      <div className="panel">
        <div className="toolbar">
          <div className="toolbar-left">
            <span className="toolbar-title">{MESES_F[mes - 1]} {anio}</span>
            <span className="toolbar-count">{companias.length}</span>
          </div>
          <div className="toolbar-right">
            {sucias > 0 && <span className="fact-sucias">{sucias} sin guardar</span>}
            <button className="btn-primary" disabled={!sucias || guardando === "todo"} onClick={guardarTodo}>
              <Ico name="check" size={16} />{guardando === "todo" ? "Guardando…" : "Guardar todo"}
            </button>
          </div>
        </div>

        <div className="table-wrap">
          <table className="table fact-carga">
            <thead>
              <tr>
                <th style={{ minWidth: 200 }}>Compañía</th>
                <th style={{ width: 108 }}>Fecha</th>
                <th style={{ width: 78 }}>N° fac</th>
                <th style={{ width: 124 }}>Neto</th>
                <th style={{ width: 116 }}>IVA</th>
                <th style={{ width: 124 }}>Total</th>
                <th style={{ width: 62 }}>Envío</th>
                <th style={{ width: 124 }}>Cobrado</th>
                <th style={{ width: 44 }}></th>
              </tr>
            </thead>
            <tbody>
              {companias.map((c) => {
                const sucia = filaSucia(c);
                const g = delMes[c.id];
                const yaCargada = g && g.total != null;
                return (
                  <tr key={c.id} className={sucia ? "fact-row-sucia" : ""}>
                    <td>
                      <div className="cell-strong">{c.razonSocial}</div>
                      <div className="cell-sub">
                        <span className="mono">{c.cuit}</span>
                        {c.tipo && <span className="fact-tag">Fac. {c.tipo}</span>}
                        {c.envio && <span className="fact-envio" title={c.envio}>{c.envio === "WEB" ? "WEB" : "mail"}</span>}
                      </div>
                    </td>
                    <td><input className="input sm" type="date" value={valorDe(c, "fecha") || ""} onChange={(e) => setCampo(c, "fecha", e.target.value)} /></td>
                    <td><input className="input sm mono" value={valorDe(c, "nroFactura")} onChange={(e) => setCampo(c, "nroFactura", e.target.value)} placeholder="—" /></td>
                    <td><input className="input sm mono num" value={valorDe(c, "neto")} onChange={(e) => setCampo(c, "neto", e.target.value)} placeholder="0" inputMode="decimal" /></td>
                    <td><input className="input sm mono num" value={valorDe(c, "iva")} onChange={(e) => setCampo(c, "iva", e.target.value)} placeholder={c.tipo === "A" ? "auto" : "—"} inputMode="decimal" /></td>
                    <td><input className="input sm mono num strong" value={valorDe(c, "total")} onChange={(e) => setCampo(c, "total", e.target.value)} placeholder="0" inputMode="decimal" /></td>
                    <td style={{ textAlign: "center" }}>
                      <input type="checkbox" className="fact-chk" checked={!!valorDe(c, "enviado")} onChange={(e) => setCampo(c, "enviado", e.target.checked)} title="Factura enviada" />
                    </td>
                    <td><input className="input sm mono num" value={valorDe(c, "pago")} onChange={(e) => setCampo(c, "pago", e.target.value)} placeholder="—" inputMode="decimal" /></td>
                    <td>
                      {sucia ? (
                        <button className="row-open ok" title="Guardar esta fila" disabled={guardando === c.id} onClick={() => guardarFila(c)}>
                          <Ico name="check" size={16} />
                        </button>
                      ) : yaCargada ? <span className="fact-ok" title="Cargada">✓</span> : <span className="urg-none">—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {companias.length === 0 && (
          <div className="empty"><div className="empty-ico"><Ico name="doc" size={26} /></div>
            <div className="empty-title">No hay compañías cargadas</div>
            <div className="empty-sub">Andá a “Compañías” y cargá las que facturás todos los meses.</div></div>
        )}
      </div>
    </div>
  );
}

// ============================ CRECIMIENTO ANUAL ============================
// Matriz compañías × meses con el total facturado y la variación contra el mes
// anterior, igual que la hoja "crecimiento" del Excel.
function CrecimientoAnual({ companias, movs, anio, onAnio }) {
  const [verPct, setVerPct] = React.useState(true);
  const hoy = new Date();
  const anios = [];
  for (let a = hoy.getFullYear() + 1; a >= 2025; a--) anios.push(a);

  const idx = React.useMemo(() => {
    const m = {};
    movs.forEach((x) => { m[x.companiaId + "-" + x.anio + "-" + x.mes] = x; });
    return m;
  }, [movs]);
  const totalDe = (cid, a, ms) => {
    const r = idx[cid + "-" + a + "-" + ms];
    return r && r.total != null ? Number(r.total) : null;
  };
  // mes anterior, cruzando el cambio de año
  const anteriorDe = (cid, ms) => (ms === 1 ? totalDe(cid, anio - 1, 12) : totalDe(cid, anio, ms - 1));
  const pct = (act, ant) => (act == null || ant == null || ant === 0 ? null : ((act - ant) / ant) * 100);

  const totalesMes = MESES_CORTO.map((_, i) =>
    companias.reduce((s, c) => s + (totalDe(c.id, anio, i + 1) || 0), 0));
  const totalAnual = totalesMes.reduce((a, b) => a + b, 0);
  const mesesConDatos = totalesMes.filter((t) => t > 0).length;

  const PctTag = ({ v }) => {
    if (v == null) return <span className="fact-pct nulo">—</span>;
    const cls = v > 0.5 ? "sube" : v < -0.5 ? "baja" : "igual";
    return <span className={"fact-pct " + cls}>{v > 0 ? "+" : ""}{v.toFixed(0)}%</span>;
  };

  return (
    <div>
      <div className="kpis">
        {[
          { label: "Facturado " + anio, value: money0(totalAnual), hint: mesesConDatos + " meses cargados", tone: { bg: "#E8F0FE", fg: "#1D4ED8" }, icon: "doc" },
          { label: "Promedio mensual", value: money0(mesesConDatos ? totalAnual / mesesConDatos : 0), hint: "sobre meses con datos", tone: { bg: "#E6F4EA", fg: "#15803D" }, icon: "grid" },
          { label: "Mejor mes", value: mesesConDatos ? MESES_F[totalesMes.indexOf(Math.max(...totalesMes))] : "—", hint: money0(Math.max(...totalesMes, 0)), tone: { bg: "#FDF1DC", fg: "#B45309" }, icon: "target" },
          { label: "Compañías", value: companias.length, hint: "en el listado", tone: { bg: "#FBE3E3", fg: "#C0241D" }, icon: "folder" },
        ].map((c) => (
          <div className="kpi" key={c.label}>
            <span className="kpi-stripe" style={{ background: c.tone.fg }} />
            <div className="kpi-top"><span className="kpi-ico" style={{ background: c.tone.bg, color: c.tone.fg }}><Ico name={c.icon} size={17} /></span><span className="kpi-label">{c.label}</span></div>
            <div className="kpi-mid"><span className="kpi-value" style={{ fontSize: 22 }}>{c.value}</span></div>
            <div className="kpi-foot"><span className="kpi-hint">{c.hint}</span></div>
          </div>
        ))}
      </div>

      <div className="panel">
        <div className="toolbar">
          <div className="toolbar-left"><span className="toolbar-title">Crecimiento {anio}</span></div>
          <div className="toolbar-right">
            <button className="btn-ghost sm" onClick={() => setVerPct((v) => !v)}>
              <Ico name="refresh" size={14} />{verPct ? "Ocultar variación" : "Ver variación"}
            </button>
            <select className="select" value={anio} onChange={(e) => onAnio(Number(e.target.value))}>
              {anios.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>
        <div className="table-wrap">
          <table className="table fact-matriz">
            <thead>
              <tr>
                <th style={{ minWidth: 190 }}>Compañía</th>
                {MESES_CORTO.map((m) => <th key={m} style={{ textAlign: "right" }}>{m}</th>)}
                <th style={{ textAlign: "right", minWidth: 96 }}>Año</th>
              </tr>
            </thead>
            <tbody>
              {companias.map((c) => {
                const fila = MESES_CORTO.map((_, i) => totalDe(c.id, anio, i + 1));
                const anual = fila.reduce((s, v) => s + (v || 0), 0);
                return (
                  <tr key={c.id}>
                    <td><div className="cell-strong sm">{c.razonSocial}</div></td>
                    {fila.map((v, i) => (
                      <td key={i} style={{ textAlign: "right" }}>
                        <div className="mono fact-celda">{v == null ? "—" : moneyK(v)}</div>
                        {verPct && <PctTag v={pct(v, anteriorDe(c.id, i + 1))} />}
                      </td>
                    ))}
                    <td style={{ textAlign: "right" }}><b className="mono">{moneyK(anual)}</b></td>
                  </tr>
                );
              })}
              <tr className="fact-total-row">
                <td><b>TOTAL</b></td>
                {totalesMes.map((t, i) => {
                  const ant = i === 0
                    ? companias.reduce((s, c) => s + (totalDe(c.id, anio - 1, 12) || 0), 0)
                    : totalesMes[i - 1];
                  return (
                    <td key={i} style={{ textAlign: "right" }}>
                      <div className="mono fact-celda"><b>{t ? moneyK(t) : "—"}</b></div>
                      {verPct && <PctTag v={t && ant ? ((t - ant) / ant) * 100 : null} />}
                    </td>
                  );
                })}
                <td style={{ textAlign: "right" }}><b className="mono">{moneyK(totalAnual)}</b></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ============================ ESTADÍSTICAS (panel) ============================
// Tablero del mes: KPIs contra el mes anterior, resumen por compañía, evolución,
// estado de cobro y alertas. Todo sale de `fact_mensual`, no se carga nada acá.
const money2 = (v) => (v == null || v === "" ? "—" : "$" + Number(v).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const pct1 = (v) => (v == null ? "—" : (v > 0 ? "+" : "") + (Math.round(v * 100) / 100).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%");
// Mes anterior, cruzando el cambio de año
const mesAnterior = (anio, mes) => (mes === 1 ? { anio: anio - 1, mes: 12 } : { anio, mes: mes - 1 });
// Color del monograma de la compañía (mientras no haya logos)
const FACT_TONOS = ["#1D4ED8", "#B45309", "#15803D", "#7C3AED", "#0891B2", "#C0241D", "#475569"];
const tonoCia = (nombre) => {
  let h = 0;
  for (let i = 0; i < (nombre || "").length; i++) h = (h * 31 + nombre.charCodeAt(i)) % 997;
  return FACT_TONOS[h % FACT_TONOS.length];
};
function CiaMarca({ nombre }) {
  const tono = tonoCia(nombre);
  return <span className="fact-marca" style={{ background: tono + "1A", color: tono }}>{(nombre || "?").trim().charAt(0)}</span>;
}
// `v` es siempre la variación real. `invertido` solo da vuelta el color, para
// los indicadores donde subir es malo (el pendiente de cobro).
function FactDelta({ v, sub, invertido }) {
  if (v == null) return <span className="fact-delta nulo">{sub || "sin comparación"}</span>;
  const bueno = invertido ? -v : v;
  const cls = bueno > 0.5 ? "sube" : bueno < -0.5 ? "baja" : "igual";
  // Arriba del 300% el porcentaje deja de decir nada ("+751,97%"): se muestra
  // cuántas veces se multiplicó, que es como uno lo diría en voz alta.
  const txt = Math.abs(v) >= 300
    ? (1 + v / 100).toFixed(1).replace(".", ",") + "×"
    : pct1(v);
  return (
    <span className={"fact-delta " + cls}>
      {sub && <span className="fact-delta-sub">{sub}</span>}
      <b>{v > 0 ? "↑" : v < 0 ? "↓" : "→"} {txt}</b>
    </span>
  );
}
function EstadoCobro({ facturado, cobrado }) {
  if (!facturado) return <span className="badge" style={{ background: "#EEF1F4", color: "#475569" }}>Sin cargar</span>;
  if (cobrado >= facturado) return <span className="badge" style={{ background: "#E6F4EA", color: "#15803D" }}>Cobrado</span>;
  if (cobrado > 0) return <span className="badge" style={{ background: "#FEF3E2", color: "#B45309" }}>Parcial</span>;
  return <span className="badge" style={{ background: "#FBE3E3", color: "#C0241D" }}>Pendiente</span>;
}

// Detalle anual de una compañía (se abre desde "Ver detalle")
function FactDetalleCia({ cia, movs, anio, onClose }) {
